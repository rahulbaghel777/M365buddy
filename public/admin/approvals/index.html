<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>M365Buddy · Approval queue</title><style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#142b49;background:#f3f7fc}*{box-sizing:border-box}body{margin:0}.top{background:#102344;color:#fff;padding:22px max(20px,calc((100% - 1100px)/2))}.top h1{font-size:22px;margin:0}.top p{margin:5px 0 0;color:#c6d5e8;font-size:13px}.wrap{max-width:1100px;margin:26px auto;padding:0 18px}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.filters button,.action{border:1px solid #c9d8e8;background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer;color:#183b64}.filters button.active{background:#e7f2ff;border-color:#77b5f4}.layout{display:grid;grid-template-columns:350px 1fr;gap:16px;margin-top:16px}.panel{background:white;border:1px solid #dce6f0;border-radius:12px;overflow:hidden}.list{max-height:70vh;overflow:auto}.item{padding:14px;border-bottom:1px solid #edf1f6;cursor:pointer}.item.selected{background:#eef6ff}.item strong{display:block;font-size:14px}.meta{font-size:11px;color:#72839a;margin-top:5px}.tag{font-size:10px;font-weight:700;color:#8b5b08;background:#fff3d9;padding:3px 6px;border-radius:5px}.detail{padding:20px;min-height:420px}.detail h2{font-size:19px;margin:0 0 12px}.detail h3{font-size:13px;margin:18px 0 7px;color:#536983}.question{background:#f6f9fc;padding:12px;border-radius:8px;font-size:13px;white-space:pre-wrap}.field{width:100%;min-height:250px;border:1px solid #ccd9e8;border-radius:8px;padding:12px;font:13px/1.5 ui-monospace,Consolas,monospace;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.action.primary{background:#0878ee;color:white;border-color:#0878ee}.action.danger{color:#a32626;border-color:#efb9b9}.empty{padding:28px;color:#718198;text-align:center}.notice{font-size:12px;color:#63758d;margin:12px 0}.hidden{display:none}@media(max-width:760px){.layout{grid-template-columns:1fr}.list{max-height:260px}}
