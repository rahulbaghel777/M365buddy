<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M365Buddy Script Editor</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#f5f7fb;color:#172033;font:13px/1.5 "Segoe UI",Arial,sans-serif;overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer}
.m365-header{height:62px;background:linear-gradient(105deg,#07346f,#0873c9);position:sticky;top:0;z-index:100;color:#fff}
.m365-header-inner{height:100%;max-width:1400px;margin:auto;padding:0 18px;display:grid;grid-template-columns:225px minmax(260px,1fr) 150px;gap:14px;align-items:center}
.m365-nav{display:flex;align-items:center;gap:2px}
.m365-nav a{display:flex;align-items:center;min-height:36px;padding:0 11px;border-radius:8px;color:#fff!important;font-size:13px;font-weight:700;text-decoration:none}
.m365-nav a:hover,.m365-nav a.active{background:rgba(255,255,255,.12)}
.m365-search{position:relative;width:min(100%,480px);justify-self:center}
.m365-search input{width:100%;height:36px;border:1px solid rgba(255,255,255,.42);border-radius:9px;background:rgba(255,255,255,.07);color:#fff;padding:0 12px 0 42px;outline:0;font-size:12px}
.m365-search input::placeholder{color:#e3effb}
.m365-search input:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.m365-search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:#fff;pointer-events:none}
.m365-search-icon svg{width:100%;height:100%}
.m365-brand{justify-self:end;color:#fff!important;text-decoration:none;font-size:23px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.m365-brand span{color:#9bd3ff}
.m365-results{display:none;position:absolute;left:0;right:0;top:42px;background:#fff;border:1px solid #d5dfeb;border-radius:9px;box-shadow:0 10px 28px rgba(15,23,42,.18);overflow:hidden;z-index:500}
.m365-results.show{display:block}
.m365-result{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 11px;border-bottom:1px solid #edf1f6;color:#172033!important;text-decoration:none!important;background:#fff}
.m365-result:hover{background:#eff6ff}
.m365-result-title{font-size:11.5px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m365-result-desc{font-size:10px;color:#647084;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.m365-result-type{font-size:9.5px;color:#2563eb;background:#eff6ff;border:1px solid #bfdbfe;border-radius:999px;padding:2px 6px;white-space:nowrap}
.m365-result-empty{padding:11px;color:#647084;font-size:11px}
@media(max-width:900px){
  .m365-header{height:auto;padding:7px 0}
  .m365-header-inner{grid-template-columns:1fr auto;gap:6px 10px}
  .m365-search{grid-column:1/-1;grid-row:2;width:100%}
}

.editor-app{height:calc(100vh - 62px);display:grid;grid-template-columns:245px minmax(0,1fr);min-height:0}.sidebar{background:#fff;border-right:1px solid #d9dee8;display:flex;flex-direction:column;min-height:0}.side-head{padding:12px;border-bottom:1px solid #e5eaf0}.side-title{font-size:13px;font-weight:800;color:#071a3d;margin-bottom:9px}.side-title span{color:#0878ee}.side-search{width:100%;height:32px;border:1px solid #cbd9e8;border-radius:7px;padding:0 9px;font-size:11px;outline:0}.script-list{padding:8px;overflow:auto;flex:1}.script-item{display:block;width:100%;text-align:left;border:1px solid transparent;background:#fff;border-radius:7px;padding:9px;margin-bottom:4px;color:#263b5c}.script-item:hover{background:#f3f8ff}.script-item.active{background:#eaf4ff;border-color:#c8e0fb;color:#0878ee}.script-name{font-size:11.5px;font-weight:750}.script-desc{font-size:9.5px;color:#718096;margin-top:2px}.side-bottom{padding:10px;border-top:1px solid #e5eaf0}.workspace{min-width:0;display:flex;flex-direction:column;min-height:0}.editor-toolbar{background:#fff;border-bottom:1px solid #d9dee8;padding:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.btn{height:31px;border:1px solid #d9dee8;background:#fff;border-radius:6px;padding:0 10px;font-size:11px;font-weight:750;color:#263b5c}.btn.primary{background:#0878ee;color:#fff;border-color:#0878ee}.btn.dark{background:#172033;color:#fff;border-color:#172033}.btn:disabled{opacity:.65;cursor:default}.editor-wrap{flex:1;min-height:0;display:grid;grid-template-columns:55px minmax(0,1fr);background:#fff}.line-numbers{overflow:hidden;background:#f8fafc;border-right:1px solid #e2e8f0;color:#7a889b;text-align:right;padding:12px 9px 12px 0;font:12px/1.6 Consolas,monospace;white-space:pre;user-select:none}#editor{width:100%;height:100%;resize:none;border:0;outline:0;padding:12px 14px;background:#fff;color:#172033;font:12px/1.6 Consolas,"Cascadia Mono",monospace;tab-size:4;white-space:pre;overflow:auto}.status{height:28px;background:#172033;color:#cbd5e1;display:flex;align-items:center;padding:0 10px;font-size:10px}.right{margin-left:auto}.findbar{display:none;background:#fff;border-bottom:1px solid #d9dee8;padding:7px;gap:5px;align-items:center}.findbar.show{display:flex}.findbar input{height:29px;width:220px;border:1px solid #cbd9e8;border-radius:6px;padding:0 8px;font-size:11px}.count{font-size:10px;color:#617492}@media(max-width:800px){.editor-app{grid-template-columns:1fr}.sidebar{display:none}}

/* Targeted editor improvements */
.toolbar-search{display:flex;align-items:center;gap:5px;margin-left:8px;min-width:240px}
.toolbar-search input{height:31px;width:210px;max-width:25vw;border:1px solid #cbd9e8;border-radius:6px;padding:0 9px;font-size:11px}
.toolbar-search button{height:31px;min-width:31px}
.side-search-wrap{position:relative}
.side-search-wrap .side-search{padding-left:30px}
.side-search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:#526783;pointer-events:none}
.modal-backdrop{position:fixed;inset:0;background:rgba(10,22,42,.45);z-index:1000;display:none;align-items:center;justify-content:center;padding:18px}
.modal-backdrop.show{display:flex}
.modal{background:var(--panel,#fff);color:var(--text,#172033);width:min(460px,100%);border:1px solid var(--border,#d9dee8);border-radius:12px;box-shadow:0 18px 50px #0003;overflow:hidden}
.modal-head{display:flex;align-items:center;gap:8px;padding:13px 15px;border-bottom:1px solid var(--border,#d9dee8);font-weight:800}
.modal-head span{flex:1}.modal-body{padding:15px}.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.modal-close{font-size:20px;line-height:1;border:0;background:transparent;color:inherit;padding:3px 7px}
.theme-btn{margin-left:auto}
body.dark-theme{--panel:#172033;--text:#e6edf7;--border:#34445d;background:#0b1220;color:#e6edf7}
body.dark-theme .sidebar,body.dark-theme .editor-toolbar,body.dark-theme .findbar,body.dark-theme .modal,body.dark-theme .script-item{background:#172033;color:#e6edf7;border-color:#34445d}
body.dark-theme .side-title,body.dark-theme .script-item{color:#e6edf7}
body.dark-theme .side-search,body.dark-theme .toolbar-search input,body.dark-theme .findbar input{background:#0b1220;color:#e6edf7;border-color:#465873}
body.dark-theme .script-item.active{background:#183a60;border-color:#3976b9}
body.dark-theme .editor-wrap,body.dark-theme #editor{background:#0b1220;color:#e6edf7}
body.dark-theme .line-numbers{background:#111a2b;color:#91a3bb;border-color:#34445d}
body.dark-theme .status{background:#050a13}
@media(max-width:800px){.toolbar-search{order:10;margin:4px 0 0;width:100%}.toolbar-search input{max-width:none;flex:1;width:auto}.editor-toolbar{gap:5px}}
</style></head><body>

<header class="m365-header">
  <div class="m365-header-inner">
    <nav class="m365-nav" aria-label="Main navigation">
      <a href="/" data-nav="home">Home</a>
      <a href="/articles/" data-nav="articles">Articles</a>
      <a href="/scripts/" data-nav="scripts">Scripts</a>
    </nav>
    <div class="m365-search">
      <span class="m365-search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></span>
      <input type="search" data-m365-search placeholder="Search M365Buddy..." autocomplete="off" aria-label="Search M365Buddy">
    </div>
    <a class="m365-brand" href="/">M365<span>Buddy</span></a>
  </div>
</header>

<div class="editor-app">
<aside class="sidebar"><div class="side-head"><div class="side-title"><span>M365Buddy</span> Scripts</div><div class="side-search-wrap"><svg class="side-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input class="side-search" id="sideSearch" placeholder="Search scripts..." aria-label="Search scripts"></div></div><div class="script-list" id="scriptList"></div><div class="side-bottom"><button class="btn primary" id="newBtn">＋ New Script</button></div></aside>
<main class="workspace"><div class="editor-toolbar"><button class="btn" id="saveBtn">Save</button><button class="btn" id="copyBtn">Copy</button><button class="btn dark" id="downloadBtn">Download</button><button class="btn" id="findBtn">Find</button><button class="btn" id="resetBtn">Reset</button>
<div class="toolbar-search"><input id="findInput" placeholder="Find in script..." aria-label="Find in script"><button class="btn" id="findIconBtn" aria-label="Find matches" title="Find"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></button><button class="btn" id="prevBtn" aria-label="Previous match" title="Previous match">↑</button><button class="btn" id="nextBtn" aria-label="Next match" title="Next match">↓</button><span class="count" id="findCount">0 / 0</span></div>
<button class="btn theme-btn" id="themeBtn" title="Switch light/dark theme">Dark theme</button><button class="btn" id="closeBtn" title="Close editor">×</button></div>
<div class="findbar" id="findbar"><input id="replaceInput" placeholder="Replace with..." aria-label="Replace with"><button class="btn" id="replaceBtn">Replace</button><button class="btn" id="replaceAllBtn">Replace All</button><button class="btn" id="findCloseBtn" aria-label="Close find and replace">×</button></div>
<div class="editor-wrap"><pre class="line-numbers" id="lines">1</pre><textarea id="editor" spellcheck="false" wrap="off"></textarea></div><div class="status"><span id="status">Ready</span><span class="right" id="pos">Ln 1, Col 1</span></div></main>
</div>
<div class="modal-backdrop" id="scriptModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div class="modal-head"><button class="btn" id="modalBack">← Back</button><span id="modalTitle">New Script</span><button class="modal-close" id="modalClose" aria-label="Close">×</button></div><div class="modal-body" id="modalBody"><p>Choose how you want to start.</p><div class="modal-actions"><button class="btn primary" id="chooseExisting">Choose from existing scripts</button><button class="btn" id="createNew">Create a new script</button></div></div></div></div>
<script>
(function(){
const fallback=`# ============================================================
# M365Buddy - SharePoint Online Site Inventory
# ============================================================

# IMPORTANT:
# Replace the placeholder values before running.
#
# Do NOT publish:
# - Client secrets
# - PFX passwords
# - Private keys
# - Internal SMTP credentials
# - Tenant-specific confidential information


$TenantName = "YOUR-TENANT"

$TenantAdminUrl =
    "https://YOUR-TENANT-admin.sharepoint.com"

$ClientId =
    "YOUR-APP-CLIENT-ID"

$CertificatePath =
    "C:\Path\To\SharePointAutomationCert.pfx"

$CertificatePassword =
    "YOUR-PFX-PASSWORD"


$OutputCsv =
    Join-Path $env:USERPROFILE \`
    "Desktop\SharePoint-Site-Inventory.csv"


# ============================================================
# CONNECT
# ============================================================

Connect-PnPOnline \`
    -Url $TenantAdminUrl \`
    -ClientId $ClientId \`
    -CertificatePath $CertificatePath \`
    -CertificatePassword $CertificatePassword


# ============================================================
# GET SITES
# ============================================================

$Sites =
    Get-PnPTenantSite -Detailed


# ============================================================
# BUILD REPORT
# ============================================================

$Report = foreach ($Site in $Sites) {

    [PSCustomObject]@{

        SiteName =
            $Site.Title

        SiteUrl =
            $Site.Url

        StorageMB =
            [math]::Round(
                $Site.StorageUsageCurrent,
                2
            )

        StorageQuotaMB =
            [math]::Round(
                $Site.StorageQuota,
                2
            )

        Template =
            $Site.Template

        Created =
            $Site.TimeCreated

        LastModified =
            $Site.LastContentModifiedDate
    }
}


# ============================================================
# EXPORT
# ============================================================

$Report |
    Export-Csv \`
        -Path $OutputCsv \`
        -NoTypeInformation


Write-Host "Report created:"
Write-Host $OutputCsv`;
const scripts={"SharePoint Site Inventory":{path:"/scripts/SharePoint/SharePoint_Site_Inventory.ps1",content:""}};
const editor=document.getElementById("editor"),lines=document.getElementById("lines"),status=document.getElementById("status"),fileLabel=document.getElementById("fileLabel"),list=document.getElementById("scriptList"),sideSearch=document.getElementById("sideSearch");let active="SharePoint Site Inventory",saved="",findIndex=0;
function updateLines(){const n=Math.max(1,editor.value.split("\n").length);lines.textContent=Array.from({length:n},(_,i)=>i+1).join("\n");}
function setStatus(t){status.textContent=t;}
function renderList(){const q=sideSearch.value.toLowerCase();list.innerHTML="";Object.keys(scripts).filter(x=>x.toLowerCase().includes(q)).forEach(name=>{const b=document.createElement("button");b.className="script-item"+(name===active?" active":"");b.innerHTML='<div class="script-name"></div><div class="script-desc">Published SharePoint PowerShell script</div>';b.querySelector(".script-name").textContent=name;b.onclick=()=>openScript(name);list.appendChild(b);});}
async function openScript(name){active=name;const item=scripts[name];fileLabel.textContent=name;renderList();setStatus("Loading published script...");try{const r=await fetch(item.path,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);item.content=await r.text();saved=item.content;editor.value=item.content;updateLines();setStatus("Published script loaded");}catch(e){if(!item.content)item.content=fallback;saved=item.content;editor.value=item.content;updateLines();setStatus("Preview fallback loaded; production loads the published .ps1");}editor.setSelectionRange(0,0);editor.scrollTop=0;lines.scrollTop=0;editor.focus();}
document.getElementById("saveBtn").onclick=()=>{saved=editor.value;setStatus("Saved in this browser session.");};
document.getElementById("resetBtn").onclick=()=>{editor.value=saved;updateLines();setStatus("Reset to last saved version.");};
document.getElementById("copyBtn").onclick=async()=>{try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(editor.value);else{const t=document.createElement("textarea");t.value=editor.value;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();}setStatus("Script copied to clipboard.");}catch(e){setStatus("Copy failed.");}};
document.getElementById("downloadBtn").onclick=()=>{const u=URL.createObjectURL(new Blob([editor.value],{type:"text/plain;charset=utf-8"}));const a=document.createElement("a");a.href=u;a.download="SharePoint_Site_Inventory.ps1";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);setStatus("Downloaded SharePoint_Site_Inventory.ps1");};
const findInput=document.getElementById("findInput"),replaceInput=document.getElementById("replaceInput"),findCount=document.getElementById("findCount");
function updateFindCount(){const q=findInput.value;if(!q){findCount.textContent="0 / 0";return;}const text=editor.value.toLowerCase(),needle=q.toLowerCase();let n=0,p=0;while((p=text.indexOf(needle,p))!==-1){n++;p+=Math.max(needle.length,1);}findCount.textContent=(n?"Ready":"0")+" / "+n;}
document.getElementById("findBtn").onclick=()=>{document.getElementById("findbar").classList.add("show");findInput.focus();};
document.getElementById("findCloseBtn").onclick=()=>document.getElementById("findbar").classList.remove("show");
function find(dir){const q=findInput.value;if(!q){findCount.textContent="0 / 0";return;}const text=editor.value.toLowerCase(),needle=q.toLowerCase();let p=dir>0?text.indexOf(needle,editor.selectionEnd):text.lastIndexOf(needle,Math.max(0,editor.selectionStart-1));if(p<0)p=dir>0?text.indexOf(needle):text.lastIndexOf(needle);if(p>=0){editor.focus();editor.setSelectionRange(p,p+q.length);const before=text.slice(0,p);const nth=(before.match(new RegExp(needle.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"g"))||[]).length+1;const total=(text.split(needle).length-1);findCount.textContent=nth+" / "+total;setStatus("Match "+nth+" of "+total);}else{findCount.textContent="0 / 0";setStatus("No match found");}}
document.getElementById("findIconBtn").onclick=()=>find(1);document.getElementById("nextBtn").onclick=()=>find(1);document.getElementById("prevBtn").onclick=()=>find(-1);
findInput.addEventListener("input",()=>{updateFindCount();if(findInput.value)find(1);});
findInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();e.stopPropagation();find(e.shiftKey?-1:1);}if(e.key==="Escape"){findInput.value="";updateFindCount();}});
document.getElementById("replaceBtn").onclick=()=>{const q=findInput.value;if(!q)return;const p=editor.selectionStart;if(editor.value.slice(p,editor.selectionEnd).toLowerCase()===q.toLowerCase()){editor.setRangeText(replaceInput.value,p,editor.selectionEnd,"end");}else{find(1);if(editor.value.slice(editor.selectionStart,editor.selectionEnd).toLowerCase()===q.toLowerCase())editor.setRangeText(replaceInput.value,editor.selectionStart,editor.selectionEnd,"end");}updateLines();updateFindCount();setStatus("Current match replaced.");};
document.getElementById("replaceAllBtn").onclick=()=>{const q=findInput.value;if(!q)return;const before=editor.value;let count=0;editor.value=before.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),()=>{count++;return replaceInput.value;});updateLines();updateFindCount();setStatus("Replaced "+count+" match(es).");};
const modal=document.getElementById("scriptModal"),modalBody=document.getElementById("modalBody"),modalTitle=document.getElementById("modalTitle");
document.getElementById("newBtn").onclick=()=>{modalTitle.textContent="New Script";modalBody.innerHTML='<p>Choose how you want to start.</p><div class="modal-actions"><button class="btn primary" id="chooseExisting">Choose from existing scripts</button><button class="btn" id="createNew">Create a new script</button></div>';modal.classList.add("show");};
function showExisting(){modalTitle.textContent="Choose an existing script";modalBody.innerHTML='<p>Select a published script to open in the editor.</p><div id="existingOptions"></div><div class="modal-actions"><button class="btn" id="modalBackAgain">← Back</button><button class="btn" id="modalDone">Close</button></div>';const opts=modalBody.querySelector("#existingOptions");Object.keys(scripts).filter(n=>scripts[n].path).forEach(n=>{const b=document.createElement("button");b.className="script-item";b.style.width="100%";b.textContent=n;b.onclick=()=>{modal.classList.remove("show");openScript(n);};opts.appendChild(b);});if(!opts.children.length)opts.textContent="No published scripts are configured.";modalBody.querySelector("#modalBackAgain").onclick=()=>document.getElementById("newBtn").click();modalBody.querySelector("#modalDone").onclick=()=>modal.classList.remove("show");}
function createNew(){const name=prompt("Enter a name for the new script:","My Custom Script");if(!name||!name.trim())return;scripts[name.trim()]={path:"",content:"# "+name.trim()+"\\n\\n"};active=name.trim();saved=scripts[active].content;editor.value=saved;updateLines();renderList();fileLabel.textContent=active;modal.classList.remove("show");editor.focus();setStatus("New script created. Download it to save a local copy.");}
modal.addEventListener("click",e=>{if(e.target.id==="chooseExisting")showExisting();if(e.target.id==="createNew")createNew();});
document.getElementById("modalClose").onclick=()=>modal.classList.remove("show");
document.getElementById("closeBtn").onclick=()=>{if(confirm("Close the editor and return to Scripts?"))location.href="/scripts/";};
document.getElementById("themeBtn").onclick=()=>{document.body.classList.toggle("dark-theme");const dark=document.body.classList.contains("dark-theme");document.getElementById("themeBtn").textContent=dark?"Light theme":"Dark theme";};
editor.addEventListener("input",()=>{updateLines();updateFindCount();});editor.addEventListener("scroll",()=>lines.scrollTop=editor.scrollTop);sideSearch.addEventListener("input",renderList);
document.getElementById("newBtn").onclick=()=>{const name=prompt("New script name","My Custom Script");if(!name)return;scripts[name]={path:"",content:"# "+name+"\n\n"};openScript(name);};
editor.addEventListener("keyup",()=>{const s=editor.selectionStart;const before=editor.value.slice(0,s);const line=before.split("\n").length;const col=s-before.lastIndexOf("\n")-1;document.getElementById("pos").textContent="Ln "+line+", Col "+col;});
renderList();
const requested=new URLSearchParams(location.search).get("script");openScript(requested && requested.includes("SharePoint_Site_Inventory.ps1")?"SharePoint Site Inventory":"SharePoint Site Inventory");
})();
</script><script>
(function(){
"use strict";
const M365_INDEX = [{"title": "Export All SharePoint Online Sites Using PnP PowerShell", "type": "Article", "category": "SharePoint", "url": "/articles/sharepoint-online-site-inventory.html", "description": "Generate a SharePoint Online site inventory and storage usage report using PnP PowerShell.", "keywords": ["sharepoint", "site inventory", "storage", "pnp powershell", "powershell", "csv"]}, {"title": "Register an Entra ID App for PnP PowerShell Certificate Authentication", "type": "Article", "category": "Microsoft Entra", "url": "/articles/entra-id-pnp-certificate-authentication.html", "description": "Configure an Entra ID application, certificate, permissions and authentication for PnP PowerShell.", "keywords": ["entra id", "certificate", "app registration", "pnp powershell", "admin consent"]}, {"title": "Create a Self-Signed Certificate for Microsoft Entra App Authentication", "type": "Article", "category": "Microsoft Entra", "url": "/articles/entra-id-self-signed-certificate.html", "description": "Create and export a self-signed certificate with PowerShell, upload the public certificate, and protect the private key.", "keywords": ["entra id", "certificate", "self-signed", "pfx", "cer", "powershell", "authentication"]}, {"title": "SharePoint Storage Management", "type": "Article", "category": "SharePoint", "url": "/articles/sharepoint-storage-management.html", "description": "Understand SharePoint Online storage consumption and practical storage governance.", "keywords": ["sharepoint", "storage", "quota", "capacity", "usage", "report"]}, {"title": "SharePoint Site Lifecycle Management", "type": "Article", "category": "SharePoint", "url": "/articles/sharepoint-site-lifecycle.html", "description": "Manage inactive SharePoint sites with lifecycle and ownership processes.", "keywords": ["sharepoint", "lifecycle", "inactive sites", "attestation", "governance"]}, {"title": "SharePoint Version Management", "type": "Article", "category": "SharePoint", "url": "/articles/sharepoint-version-management.html", "description": "Understand SharePoint version history, version limits and storage governance.", "keywords": ["sharepoint", "versions", "version history", "version limit", "storage"]}, {"title": "Email PowerShell Reports Using Microsoft Graph", "type": "Article", "category": "Microsoft 365", "url": "/articles/powershell-report-delivery-microsoft-graph.html", "description": "Replace SMTP delivery with Microsoft Graph for PowerShell reports.", "keywords": ["smtp", "email", "graph", "sendmail", "powershell", "exchange online"]}, {"title": "Email PowerShell Reports Using Power Automate", "type": "Article", "category": "Power Automate", "url": "/articles/powershell-report-delivery-power-automate.html", "description": "Use Power Automate and Microsoft 365 Outlook to email PowerShell CSV reports.", "keywords": ["smtp", "email", "power automate", "outlook", "powershell", "csv"]}, {"title": "SharePoint Site Inventory PowerShell Script", "type": "Script", "category": "SharePoint", "url": "/scripts/SharePoint/sharepoint-site-inventory-viewer.html", "description": "View the published SharePoint Online site inventory PowerShell script.", "keywords": ["sharepoint", "powershell", "site inventory", "script"]}, {"title": "SharePoint Version Report", "type": "Script", "category": "SharePoint", "url": "/scripts/SharePoint/sharepoint-version-report.html", "description": "SharePoint Online version usage reporting script.", "keywords": ["sharepoint", "version report", "powershell"]}, {"title": "SharePoint Recycle Bin Report", "type": "Script", "category": "SharePoint", "url": "/scripts/SharePoint/sharepoint-recycle-bin-report.html", "description": "SharePoint Online recycle bin reporting script.", "keywords": ["sharepoint", "recycle bin", "powershell"]}, {"title": "SharePoint Storage Report", "type": "Script", "category": "SharePoint", "url": "/scripts/", "description": "SharePoint Online storage reporting scripts.", "keywords": ["sharepoint", "storage report", "powershell"]}];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function scoreItem(item,q){
  const Q=q.toLowerCase();
  const title=item.title.toLowerCase(), text=(item.title+" "+item.type+" "+item.category+" "+item.description+" "+item.keywords.join(" ")).toLowerCase();
  if(!text.includes(Q)) return 0;
  let s=1;
  if(title===Q)s+=100;
  if(title.includes(Q))s+=60;
  if(item.category.toLowerCase().includes(Q))s+=30;
  if(item.type.toLowerCase().includes(Q))s+=20;
  if(item.description.toLowerCase().includes(Q))s+=15;
  s+=item.keywords.filter(k=>k.toLowerCase().includes(Q)).length*10;
  return s;
}
function searchItems(q,type){
  q=(q||"").trim();
  if(!q)return [];
  return M365_INDEX.map(x=>({...x,score:scoreItem(x,q)})).filter(x=>x.score>0 && (!type||type==="All"||x.type===type)).sort((a,b)=>b.score-a.score);
}
function wireGlobalSearch(){
  document.querySelectorAll("[data-m365-search]").forEach(input=>{
    const wrap=input.closest(".m365-search")||input.parentElement;
    let box=wrap.querySelector(".m365-results");
    if(!box){box=document.createElement("div");box.className="m365-results";wrap.appendChild(box);}
    function render(){
      const q=input.value.trim(), items=searchItems(q).slice(0,7);
      if(!q){box.classList.remove("show");box.innerHTML="";return;}
      box.classList.add("show");
      if(!items.length){box.innerHTML='<div class="m365-result-empty">No matching articles or scripts.</div>';return;}
      box.innerHTML=items.map(x=>'<a class="m365-result" href="'+x.url+'"><div style="min-width:0"><div class="m365-result-title">'+esc(x.title)+'</div><div class="m365-result-desc">'+esc(x.description)+'</div></div><span class="m365-result-type">'+esc(x.type)+'</span></a>').join("");
    }
    input.addEventListener("input",render);
    input.addEventListener("focus",render);
    input.addEventListener("keydown",function(e){
      if(e.key==="Enter"){e.preventDefault();const q=input.value.trim();if(q)location.href="/search.html?q="+encodeURIComponent(q);}
      if(e.key==="Escape"){input.value="";box.classList.remove("show");}
    });
  });
  document.addEventListener("click",function(e){
    document.querySelectorAll(".m365-results").forEach(box=>{if(!box.parentElement.contains(e.target))box.classList.remove("show");});
  });
}
function markNav(){
  const p=location.pathname;
  document.querySelectorAll(".m365-nav a[data-nav]").forEach(a=>{
    const n=a.dataset.nav;
    if((n==="home" && (p==="/"||p.endsWith("/index.html"))) ||
       (n==="articles" && p.startsWith("/articles")) ||
       (n==="scripts" && p.startsWith("/scripts"))) a.classList.add("active");
  });
}
document.addEventListener("DOMContentLoaded",function(){wireGlobalSearch();markNav();});
window.M365BuddySearch={index:M365_INDEX,search:searchItems};
})();
</script></body></html>
