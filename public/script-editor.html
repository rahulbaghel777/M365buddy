<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M365Buddy Script Workspace</title>

<link rel="icon" type="image/svg+xml" href="favicon.svg">

<!-- CodeMirror -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">

<style>

:root {
    --bg: #f5f7fb;
    --panel: #ffffff;
    --panel-2: #f8fafc;
    --border: #e2e8f0;
    --border-dark: #cbd5e1;

    --text: #172033;
    --muted: #64748b;

    --primary: #2563eb;
    --primary-hover: #1d4ed8;

    --success: #15803d;
    --danger: #dc2626;

    --editor-bg: #ffffff;
    --editor-text: #172033;

    --tab-bg: #f1f5f9;
    --tab-active: #ffffff;

    --search-bg: #fef3c7;
    --search-current: #bbf7d0;

    --shadow:
        0 10px 30px rgba(15, 23, 42, 0.08);
}

body.dark {

    --bg: #0f172a;
    --panel: #111827;
    --panel-2: #172033;

    --border: #263244;
    --border-dark: #334155;

    --text: #e5e7eb;
    --muted: #94a3b8;

    --primary: #3b82f6;
    --primary-hover: #60a5fa;

    --editor-bg: #111827;
    --editor-text: #e5e7eb;

    --tab-bg: #172033;
    --tab-active: #111827;

    --search-bg: #713f12;
    --search-current: #166534;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family:
        Inter,
        Segoe UI,
        Arial,
        sans-serif;

    background: var(--bg);
    color: var(--text);
}

/* =========================================================
   MAIN APPLICATION
   ========================================================= */

.workspace {

    width: 100%;
    height: 100dvh;

    display: flex;
    overflow: hidden;
}

/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar {

    width: 275px;
    min-width: 275px;

    background: var(--panel);

    border-right: 1px solid var(--border);

    display: flex;
    flex-direction: column;

    overflow: hidden;
}

.brand {

    height: 68px;

    display: flex;
    align-items: center;

    padding: 0 20px;

    border-bottom: 1px solid var(--border);
}

.brand-title {

    font-size: 20px;
    font-weight: 750;
}

.brand-subtitle {

    margin-top: 2px;

    font-size: 11px;

    color: var(--muted);
}

.sidebar-section {

    padding: 16px;

    border-bottom: 1px solid var(--border);
}

.new-script-button {

    width: 100%;

    border: 0;

    border-radius: 8px;

    background: var(--primary);

    color: white;

    padding: 11px 14px;

    font-size: 14px;

    font-weight: 600;

    cursor: pointer;

    transition: 0.15s;
}

.new-script-button:hover {

    background: var(--primary-hover);
}

.script-search {

    margin-top: 12px;

    width: 100%;

    padding: 9px 11px;

    border: 1px solid var(--border);

    border-radius: 7px;

    outline: none;

    background: var(--panel-2);

    color: var(--text);

    font-size: 13px;
}

.script-list {

    flex: 1;

    overflow-y: auto;

    padding: 10px;
}

.script-item {

    padding: 11px 12px;

    border-radius: 8px;

    cursor: pointer;

    margin-bottom: 4px;

    transition: 0.15s;
}

.script-item:hover {

    background: var(--panel-2);
}

.script-item.active {

    background: rgba(37, 99, 235, 0.10);

    color: var(--primary);

    font-weight: 600;
}

.script-name {

    font-size: 13px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.script-type {

    margin-top: 3px;

    font-size: 11px;

    color: var(--muted);
}

/* =========================================================
   MAIN AREA
   ========================================================= */

.main {

    flex: 1;

    min-width: 0;

    height: 100%;

    display: flex;
    flex-direction: column;

    overflow: hidden;
}

/* =========================================================
   TOP HEADER
   ========================================================= */

.topbar {

    height: 68px;

    min-height: 68px;

    padding: 0 18px;

    background: var(--panel);

    border-bottom: 1px solid var(--border);

    display: flex;

    align-items: center;

    justify-content: space-between;
}

.page-title {

    font-size: 16px;

    font-weight: 700;
}

.page-description {

    margin-top: 3px;

    font-size: 11px;

    color: var(--muted);
}

.top-actions {

    display: flex;

    align-items: center;

    gap: 7px;
}

.icon-button,
.toolbar-button {

    border: 1px solid var(--border);

    background: var(--panel);

    color: var(--text);

    border-radius: 7px;

    cursor: pointer;

    transition: 0.15s;
}

.icon-button {

    width: 36px;
    height: 36px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 17px;
}

.toolbar-button {

    padding: 7px 10px;

    font-size: 12px;
}

.icon-button:hover,
.toolbar-button:hover {

    background: var(--panel-2);

    border-color: var(--border-dark);
}

.primary-button {

    background: var(--primary);

    border-color: var(--primary);

    color: white;
}

.primary-button:hover {

    background: var(--primary-hover);

    border-color: var(--primary-hover);
}

/* =========================================================
   OPENED SCRIPT TABS
   ========================================================= */

.tabs-container {

    height: 45px;

    min-height: 45px;

    background: var(--panel-2);

    border-bottom: 1px solid var(--border);

    display: flex;

    align-items: stretch;

    overflow-x: auto;

    overflow-y: hidden;

    padding-left: 10px;
}

.tabs-container::-webkit-scrollbar {

    height: 5px;
}

.tabs-container::-webkit-scrollbar-thumb {

    background: var(--border-dark);

    border-radius: 5px;
}

.editor-tab {

    height: 44px;

    min-width: 155px;
    max-width: 235px;

    padding: 0 9px 0 13px;

    display: flex;

    align-items: center;

    gap: 7px;

    border-right: 1px solid var(--border);

    color: var(--muted);

    cursor: pointer;

    user-select: none;
}

.editor-tab.active {

    background: var(--tab-active);

    color: var(--text);

    font-weight: 600;

    border-top: 2px solid var(--primary);
}

.tab-name {

    flex: 1;

    min-width: 0;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    font-size: 12px;
}

.tab-close {

    width: 20px;
    height: 20px;

    border: 0;

    background: transparent;

    color: var(--muted);

    border-radius: 4px;

    cursor: pointer;

    font-size: 15px;

    line-height: 20px;
}

.tab-close:hover {

    background: var(--panel-2);

    color: var(--danger);
}

/*
    IMPORTANT:
    Plus button is INSIDE the tab row and directly
    after the opened tabs.
*/

.add-tab-button {

    flex: 0 0 auto;

    width: 38px;
    height: 38px;

    margin: 3px 5px;

    border: 1px solid var(--border);

    border-radius: 7px;

    background: var(--panel);

    color: var(--primary);

    font-size: 22px;

    line-height: 34px;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;
}

.add-tab-button:hover {

    background: rgba(37, 99, 235, 0.08);

    border-color: var(--primary);
}

/* =========================================================
   TOOLBAR
   ========================================================= */

.toolbar {

    min-height: 48px;

    padding: 7px 10px;

    background: var(--panel);

    border-bottom: 1px solid var(--border);

    display: flex;

    align-items: center;

    gap: 6px;

    flex-wrap: nowrap;

    overflow-x: auto;
}

.toolbar-divider {

    width: 1px;

    height: 24px;

    background: var(--border);

    margin: 0 3px;
}

.toolbar-select {

    height: 30px;

    padding: 0 8px;

    border: 1px solid var(--border);

    border-radius: 6px;

    background: var(--panel);

    color: var(--text);

    font-size: 12px;

    outline: none;
}

/* =========================================================
   FIND BAR
   ========================================================= */

.find-bar {

    display: none;

    min-height: 42px;

    padding: 6px 10px;

    background: var(--panel-2);

    border-bottom: 1px solid var(--border);

    align-items: center;

    gap: 6px;
}

.find-bar.visible {

    display: flex;
}

.find-input {

    width: 270px;

    height: 29px;

    border: 1px solid var(--border);

    border-radius: 6px;

    padding: 0 9px;

    background: var(--panel);

    color: var(--text);

    outline: none;

    font-size: 12px;
}

.find-count {

    font-size: 11px;

    color: var(--muted);

    min-width: 80px;
}

/* =========================================================
   EDITOR
   ========================================================= */

.editor-wrapper {

    flex: 1;

    min-height: 0;

    padding: 10px;

    background: var(--bg);

    overflow: hidden;
}

.editor-card {

    width: 100%;
    height: 100%;

    background: var(--editor-bg);

    border: 1px solid var(--border);

    border-radius: 8px;

    overflow: hidden;

    box-shadow: var(--shadow);

    position: relative;
}

/*
    CodeMirror is the ONLY editor surface.

    There is intentionally NO transparent textarea
    and NO second text layer.

    This prevents the cursor/scroll mismatch
    from the previous implementation.
*/

.CodeMirror {

    width: 100%;
    height: 100%;

    background: var(--editor-bg);

    color: var(--editor-text);

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 14px;

    line-height: 1.55;
}

.CodeMirror-gutters {

    background: var(--editor-bg);

    border-right: 1px solid var(--border);
}

.CodeMirror-linenumber {

    color: var(--muted);
}

.CodeMirror-cursor {

    border-left-color: var(--text);
}

.cm-search-match {

    background: var(--search-bg);
}

.cm-search-current {

    background: var(--search-current);

    outline: 1px solid rgba(22, 101, 52, 0.45);
}

/* =========================================================
   MODAL
   ========================================================= */

.modal-backdrop {

    position: fixed;

    inset: 0;

    background: rgba(15, 23, 42, 0.45);

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 1000;
}

.modal-backdrop.visible {

    display: flex;
}

.modal {

    width: 520px;

    max-width: calc(100vw - 30px);

    background: var(--panel);

    border: 1px solid var(--border);

    border-radius: 12px;

    box-shadow:
        0 25px 70px rgba(15, 23, 42, 0.25);

    overflow: hidden;
}

.modal-header {

    padding: 17px 20px;

    border-bottom: 1px solid var(--border);

    display: flex;

    justify-content: space-between;

    align-items: center;
}

.modal-title {

    font-size: 16px;

    font-weight: 700;
}

.modal-close {

    width: 30px;
    height: 30px;

    border: 0;

    background: transparent;

    color: var(--muted);

    font-size: 20px;

    border-radius: 6px;

    cursor: pointer;
}

.modal-close:hover {

    background: var(--panel-2);

    color: var(--danger);
}

.modal-body {

    padding: 20px;
}

.modal-footer {

    padding: 12px 20px;

    border-top: 1px solid var(--border);

    display: flex;

    justify-content: flex-end;

    gap: 8px;
}

.modal-option {

    border: 1px solid var(--border);

    background: var(--panel);

    border-radius: 9px;

    padding: 15px;

    margin-bottom: 10px;

    cursor: pointer;

    transition: 0.15s;
}

.modal-option:hover {

    border-color: var(--primary);

    background: rgba(37, 99, 235, 0.04);
}

.modal-option-title {

    font-size: 14px;

    font-weight: 650;
}

.modal-option-description {

    margin-top: 5px;

    font-size: 12px;

    color: var(--muted);

    line-height: 1.45;
}

.modal-script-list {

    max-height: 300px;

    overflow-y: auto;

    margin-top: 10px;
}

.modal-script {

    padding: 11px 12px;

    border: 1px solid var(--border);

    border-radius: 7px;

    margin-bottom: 7px;

    cursor: pointer;
}

.modal-script:hover {

    border-color: var(--primary);

    background: rgba(37, 99, 235, 0.05);
}

.input-label {

    display: block;

    margin-bottom: 7px;

    font-size: 12px;

    font-weight: 600;
}

.modal-input {

    width: 100%;

    padding: 10px;

    border: 1px solid var(--border);

    border-radius: 7px;

    background: var(--panel);

    color: var(--text);

    outline: none;

    font-size: 13px;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast-container {

    position: fixed;

    right: 22px;

    bottom: 22px;

    z-index: 2000;

    display: flex;

    flex-direction: column;

    gap: 8px;
}

.toast {

    min-width: 260px;

    max-width: 400px;

    padding: 11px 14px;

    border-radius: 8px;

    background: #172033;

    color: white;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.2);

    font-size: 13px;

    animation: toastIn 0.18s ease;
}

.toast.success {

    background: #166534;
}

.toast.error {

    background: #991b1b;
}

@keyframes toastIn {

    from {
        transform: translateY(10px);
        opacity: 0;
    }

    to {
        transform: translateY(0);
        opacity: 1;
    }
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 850px) {

    .sidebar {

        width: 220px;
        min-width: 220px;
    }

    .page-description {

        display: none;
    }

    .find-input {

        width: 180px;
    }
}

@media (max-width: 650px) {

    .sidebar {

        width: 190px;
        min-width: 190px;
    }

    .editor-tab {

        min-width: 125px;
    }

    .toolbar-button {

        padding: 7px;
    }
}

</style>
</head>

<body>

<div class="workspace">

    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar">

        <div class="brand">

            <div>
                <div class="brand-title">
                    M365Buddy
                </div>

                <div class="brand-subtitle">
                    Script Workspace
                </div>
            </div>

        </div>


        <div class="sidebar-section">

            <button
                class="new-script-button"
                id="newScriptButton">

                + Create New Script

            </button>


            <input
                id="scriptSearch"
                class="script-search"
                type="text"
                placeholder="Search scripts...">

        </div>


        <div
            id="scriptList"
            class="script-list">
        </div>

    </aside>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="main">


        <!-- TOP BAR -->

        <header class="topbar">

            <div>

                <div class="page-title">
                    Script Editor
                </div>

                <div class="page-description">
                    Create, edit and save your PowerShell scripts
                </div>

            </div>


            <div class="top-actions">

                <button
                    class="icon-button"
                    id="homeButton"
                    title="Open M365Buddy Home">

                    ⌂

                </button>


                <button
                    class="icon-button"
                    id="themeButton"
                    title="Toggle light / dark theme">

                    ☾

                </button>

            </div>

        </header>


        <!-- =================================================
             TABS

             IMPORTANT:
             + IS HERE, NEXT TO OPENED TABS
             ================================================= -->

        <div
            id="tabsContainer"
            class="tabs-container">

            <!-- Tabs generated by JavaScript -->

            <button
                id="addTabButton"
                class="add-tab-button"
                title="Open a new editor tab">

                +

            </button>

        </div>


        <!-- TOOLBAR -->

        <div class="toolbar">

            <button
                class="toolbar-button primary-button"
                id="saveButton">

                Save

            </button>


            <button
                class="toolbar-button"
                id="copyButton">

                Copy

            </button>


            <button
                class="toolbar-button"
                id="editableCopyButton">

                Create Editable Copy

            </button>


            <button
                class="toolbar-button"
                id="downloadButton">

                Download

            </button>


            <div class="toolbar-divider"></div>


            <button
                class="toolbar-button"
                id="findButton">

                Find

            </button>


            <button
                class="toolbar-button"
                id="renameButton">

                Rename

            </button>


            <button
                class="toolbar-button"
                id="resetButton">

                Reset

            </button>


            <button
                class="toolbar-button"
                id="deleteButton">

                Delete

            </button>


            <div class="toolbar-divider"></div>


            <select
                id="fontSelect"
                class="toolbar-select"
                title="Font">

                <option value="Consolas">
                    Consolas
                </option>

                <option value="'Courier New'">
                    Courier New
                </option>

                <option value="monospace">
                    Monospace
                </option>

            </select>


            <select
                id="fontSizeSelect"
                class="toolbar-select"
                title="Font size">

                <option value="12">
                    12px
                </option>

                <option value="13">
                    13px
                </option>

                <option value="14" selected>
                    14px
                </option>

                <option value="15">
                    15px
                </option>

                <option value="16">
                    16px
                </option>

                <option value="18">
                    18px
                </option>

            </select>

        </div>


        <!-- FIND BAR -->

        <div
            id="findBar"
            class="find-bar">

            <input
                id="findInput"
                class="find-input"
                type="text"
                placeholder="Find in current script...">


            <button
                class="toolbar-button"
                id="findPreviousButton">

                ↑

            </button>


            <button
                class="toolbar-button"
                id="findNextButton">

                ↓

            </button>


            <span
                id="findCount"
                class="find-count">

                0 matches

            </span>


            <button
                class="toolbar-button"
                id="closeFindButton">

                Close

            </button>

        </div>


        <!-- EDITOR -->

        <section class="editor-wrapper">

            <div class="editor-card">

                <textarea id="codeEditor"></textarea>

            </div>

        </section>

    </main>

</div>


<!-- =========================================================
     MODAL
     ========================================================= -->

<div
    id="modalBackdrop"
    class="modal-backdrop">

    <div class="modal">

        <div class="modal-header">

            <div
                id="modalTitle"
                class="modal-title">

                Create New Script

            </div>

            <button
                id="modalClose"
                class="modal-close">

                ×

            </button>

        </div>


        <div
            id="modalBody"
            class="modal-body">
        </div>


        <div
            id="modalFooter"
            class="modal-footer">
        </div>

    </div>

</div>


<!-- TOAST -->

<div
    id="toastContainer"
    class="toast-container">
</div>


<!-- =========================================================
     CODEMIRROR
     ========================================================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/powershell/powershell.js"></script>


<script>

"use strict";


/* =========================================================
   STORAGE
   ========================================================= */

const STORAGE_KEY =
    "m365buddy_script_workspace_v5";


/* =========================================================
   ORIGINAL M365BUDDY SCRIPTS
   =========================================================
   
   Add your sanitized public scripts here.

   IMPORTANT:
   Do NOT put tenant IDs, client secrets,
   certificate passwords, SMTP credentials,
   internal email addresses, etc. here.
   ========================================================= */

const ORIGINAL_SCRIPTS = [

    {
        id: "m365-sharepoint-inventory",

        name:
            "SharePoint Online Site Inventory",

        description:
            "Export SharePoint Online sites using PnP PowerShell.",

        content:
`# =====================================================
# M365Buddy - SharePoint Online Site Inventory
# =====================================================

# IMPORTANT:
# Replace the configuration values with your own
# tenant/application details before running.

$TenantName = "<tenant-name>"
$ClientId   = "<client-id>"
$PfxPath    = "<certificate-path>"

Write-Host ""
Write-Host "Connecting to SharePoint Online..." `
    -ForegroundColor Cyan

# Example:
#
# Connect-PnPOnline `
#     -Url "https://<tenant>-admin.sharepoint.com" `
#     -ClientId $ClientId `
#     -Tenant "$TenantName.onmicrosoft.com" `
#     -CertificatePath $PfxPath

Write-Host ""
Write-Host "Retrieving SharePoint sites..." `
    -ForegroundColor Cyan

# Get-PnPTenantSite -Detailed

Write-Host ""
Write-Host "Report generation completed." `
    -ForegroundColor Green
`
    }

];


/* =========================================================
   STATE
   ========================================================= */

let state = {

    personalScripts: [],

    openTabs: [],

    activeTabId: null,

    theme: "light",

    fontFamily: "Consolas",

    fontSize: 14

};


/* =========================================================
   DOM
   ========================================================= */

const scriptList =
    document.getElementById("scriptList");

const scriptSearch =
    document.getElementById("scriptSearch");

const tabsContainer =
    document.getElementById("tabsContainer");

const addTabButton =
    document.getElementById("addTabButton");

const newScriptButton =
    document.getElementById("newScriptButton");

const saveButton =
    document.getElementById("saveButton");

const copyButton =
    document.getElementById("copyButton");

const editableCopyButton =
    document.getElementById("editableCopyButton");

const downloadButton =
    document.getElementById("downloadButton");

const findButton =
    document.getElementById("findButton");

const renameButton =
    document.getElementById("renameButton");

const resetButton =
    document.getElementById("resetButton");

const deleteButton =
    document.getElementById("deleteButton");

const homeButton =
    document.getElementById("homeButton");

const themeButton =
    document.getElementById("themeButton");

const fontSelect =
    document.getElementById("fontSelect");

const fontSizeSelect =
    document.getElementById("fontSizeSelect");

const findBar =
    document.getElementById("findBar");

const findInput =
    document.getElementById("findInput");

const findPreviousButton =
    document.getElementById("findPreviousButton");

const findNextButton =
    document.getElementById("findNextButton");

const findCount =
    document.getElementById("findCount");

const closeFindButton =
    document.getElementById("closeFindButton");

const modalBackdrop =
    document.getElementById("modalBackdrop");

const modalTitle =
    document.getElementById("modalTitle");

const modalBody =
    document.getElementById("modalBody");

const modalFooter =
    document.getElementById("modalFooter");

const modalClose =
    document.getElementById("modalClose");

const toastContainer =
    document.getElementById("toastContainer");


/* =========================================================
   CODEMIRROR
   ========================================================= */

let editor;

let suppressEditorChange =
    false;

let searchMarks = [];

let currentSearchIndex =
    0;


/* =========================================================
   INITIALIZE
   ========================================================= */

function initialize() {

    loadState();

    initializeEditor();

    applyTheme();

    applyFontSettings();

    renderSidebar();

    ensureInitialTab();

    renderTabs();

    loadActiveScriptIntoEditor();

    setupEvents();

}


function initializeEditor() {

    editor = CodeMirror.fromTextArea(
        document.getElementById("codeEditor"),
        {
            mode: "powershell",

            lineNumbers: true,

            lineWrapping: false,

            indentUnit: 4,

            tabSize: 4,

            indentWithTabs: false,

            autofocus: true,

            viewportMargin: Infinity
        }
    );


    editor.on(
        "change",
        function() {

            if (suppressEditorChange) {
                return;
            }

            const script =
                getActiveScript();

            if (!script) {
                return;
            }

            script.content =
                editor.getValue();

            script.modified =
                true;

            saveState();

            renderTabs();

        }
    );
}


/* =========================================================
   STATE LOAD / SAVE
   ========================================================= */

function loadState() {

    try {

        const stored =
            localStorage.getItem(
                STORAGE_KEY
            );

        if (!stored) {
            return;
        }

        const parsed =
            JSON.parse(stored);

        if (Array.isArray(parsed.personalScripts)) {

            state.personalScripts =
                parsed.personalScripts;

        }

        if (Array.isArray(parsed.openTabs)) {

            state.openTabs =
                parsed.openTabs;

        }

        if (parsed.activeTabId) {

            state.activeTabId =
                parsed.activeTabId;

        }

        if (
            parsed.theme === "dark" ||
            parsed.theme === "light"
        ) {

            state.theme =
                parsed.theme;

        }

        if (parsed.fontFamily) {

            state.fontFamily =
                parsed.fontFamily;

        }

        if (parsed.fontSize) {

            state.fontSize =
                parsed.fontSize;

        }

    }
    catch (error) {

        console.error(
            "Could not load workspace:",
            error
        );

    }
}


function saveState() {

    try {

        localStorage.setItem(

            STORAGE_KEY,

            JSON.stringify(state)

        );

    }
    catch (error) {

        console.error(
            "Could not save workspace:",
            error
        );

        showToast(
            "Unable to save workspace locally.",
            "error"
        );

    }
}


/* =========================================================
   SCRIPT HELPERS
   ========================================================= */

function getAllPersonalScripts() {

    return state.personalScripts || [];

}


function getPersonalScript(id) {

    return state.personalScripts.find(
        script => script.id === id
    );

}


function getOriginalScript(id) {

    return ORIGINAL_SCRIPTS.find(
        script => script.id === id
    );

}


function getScript(id) {

    return (
        getPersonalScript(id) ||
        getOriginalScript(id)
    );

}


function getActiveScript() {

    if (!state.activeTabId) {
        return null;
    }

    return getScript(
        state.activeTabId
    );

}


/* =========================================================
   SCRIPT TYPE
   ========================================================= */

function isOriginalScript(id) {

    return !!getOriginalScript(id);

}


function isPersonalScript(id) {

    return !!getPersonalScript(id);

}


/* =========================================================
   INITIAL TAB
   ========================================================= */

function ensureInitialTab() {

    /*
        Remove tabs whose scripts no longer exist.
    */

    state.openTabs =
        state.openTabs.filter(
            id => !!getScript(id)
        );


    if (
        state.activeTabId &&
        !getScript(state.activeTabId)
    ) {

        state.activeTabId =
            null;

    }


    if (
        state.openTabs.length === 0
    ) {

        if (ORIGINAL_SCRIPTS.length > 0) {

            state.openTabs.push(
                ORIGINAL_SCRIPTS[0].id
            );

            state.activeTabId =
                ORIGINAL_SCRIPTS[0].id;

        }

    }


    if (
        !state.activeTabId &&
        state.openTabs.length > 0
    ) {

        state.activeTabId =
            state.openTabs[0];

    }

}


/* =========================================================
   SIDEBAR
   ========================================================= */

function renderSidebar() {

    const filter =
        scriptSearch.value
            .trim()
            .toLowerCase();

    scriptList.innerHTML = "";


    /*
        ORIGINAL scripts
        +
        normal custom scripts

        Copies are intentionally NOT shown here.
    */

    const scripts = [

        ...ORIGINAL_SCRIPTS,

        ...state.personalScripts.filter(
            script =>
                !script.hiddenFromSidebar
        )

    ];


    const filtered =
        scripts.filter(
            script =>
                !filter ||
                script.name
                    .toLowerCase()
                    .includes(filter)
        );


    if (filtered.length === 0) {

        const empty =
            document.createElement("div");

        empty.style.padding =
            "20px 10px";

        empty.style.color =
            "var(--muted)";

        empty.style.fontSize =
            "12px";

        empty.textContent =
            "No scripts found.";

        scriptList.appendChild(
            empty
        );

        return;
    }


    filtered.forEach(
        script => {

            const item =
                document.createElement("div");

            item.className =
                "script-item";


            if (
                script.id ===
                state.activeTabId
            ) {

                item.classList.add(
                    "active"
                );

            }


            const name =
                document.createElement("div");

            name.className =
                "script-name";

            name.textContent =
                script.name;


            const type =
                document.createElement("div");

            type.className =
                "script-type";

            type.textContent =
                isOriginalScript(
                    script.id
                )
                    ? "M365Buddy Script"
                    : "My Script";


            item.appendChild(name);

            item.appendChild(type);


            item.addEventListener(
                "click",
                () => {

                    openScriptTab(
                        script.id
                    );

                }
            );


            scriptList.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   TABS
   ========================================================= */

function renderTabs() {

    /*
        Remove every generated tab but
        keep the + button.
    */

    Array.from(
        tabsContainer.children
    ).forEach(
        child => {

            if (
                child !== addTabButton
            ) {

                child.remove();

            }

        }
    );


    state.openTabs.forEach(
        id => {

            const script =
                getScript(id);

            if (!script) {
                return;
            }


            const tab =
                document.createElement("div");

            tab.className =
                "editor-tab";


            if (
                id === state.activeTabId
            ) {

                tab.classList.add(
                    "active"
                );

            }


            const name =
                document.createElement("span");

            name.className =
                "tab-name";

            name.textContent =
                script.name;


            const close =
                document.createElement("button");

            close.className =
                "tab-close";

            close.textContent =
                "×";

            close.title =
                "Close tab";


            close.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    closeTab(id);

                }
            );


            tab.appendChild(name);

            tab.appendChild(close);


            tab.addEventListener(
                "click",
                () => {

                    activateTab(id);

                }
            );


            tabsContainer.insertBefore(
                tab,
                addTabButton
            );

        }
    );

}


/* =========================================================
   OPEN SCRIPT
   ========================================================= */

function openScriptTab(id) {

    if (!getScript(id)) {
        return;
    }


    if (
        !state.openTabs.includes(id)
    ) {

        state.openTabs.push(id);

    }


    state.activeTabId =
        id;


    saveState();

    renderTabs();

    renderSidebar();

    loadActiveScriptIntoEditor();

}


function activateTab(id) {

    if (!getScript(id)) {
        return;
    }

    state.activeTabId =
        id;

    saveState();

    renderTabs();

    renderSidebar();

    loadActiveScriptIntoEditor();

}


/* =========================================================
   LOAD SCRIPT INTO EDITOR
   ========================================================= */

function loadActiveScriptIntoEditor() {

    const script =
        getActiveScript();

    if (!script) {

        suppressEditorChange =
            true;

        editor.setValue("");

        suppressEditorChange =
            false;

        return;
    }


    suppressEditorChange =
        true;

    editor.setValue(
        script.content || ""
    );

    suppressEditorChange =
        false;


    editor.clearHistory();

    editor.focus();

    clearSearchMarks();

}


/* =========================================================
   CLOSE TAB
   ========================================================= */

function closeTab(id) {

    const index =
        state.openTabs.indexOf(id);

    if (index === -1) {
        return;
    }


    state.openTabs.splice(
        index,
        1
    );


    if (
        state.activeTabId === id
    ) {

        if (
            state.openTabs.length === 0
        ) {

            state.activeTabId =
                null;

        }
        else {

            const nextIndex =
                Math.min(
                    index,
                    state.openTabs.length - 1
                );

            state.activeTabId =
                state.openTabs[nextIndex];

        }

    }


    saveState();

    renderTabs();

    renderSidebar();

    loadActiveScriptIntoEditor();

}

/* =========================================================
   CREATE EDITABLE COPY
   ========================================================= */

function createEditableCopy() {

    const source =
        getActiveScript();

    if (!source) {

        showToast(
            "No script is currently open.",
            "error"
        );

        return;
    }


    const baseName =
        getBaseScriptName(
            source.name
        );


    const copyName =
        getNextCopyName(
            baseName
        );


    const id =
        "copy-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .substring(2, 8);


    const copy = {

        id: id,

        name: copyName,

        description:
            "Editable copy.",

        content:
            editor.getValue(),

        hiddenFromSidebar: true,

        isCopy: true,

        sourceId:
            source.id,

        modified: false,

        createdAt:
            new Date().toISOString()

    };


    state.personalScripts.push(
        copy
    );


    state.openTabs.push(
        id
    );


    state.activeTabId =
        id;


    saveState();

    renderSidebar();

    renderTabs();

    loadActiveScriptIntoEditor();


    showToast(
        `"${copyName}" created.`,
        "success"
    );

}


function getBaseScriptName(name) {

    return name
        .replace(
            /\s+Copy(?:\s+\d+)?$/i,
            ""
        )
        .trim();

}


function getNextCopyName(baseName) {

    const names =
        new Set(

            state.personalScripts
                .map(
                    script =>
                        script.name
                            .toLowerCase()
                )
        );


    const originalExists =
        ORIGINAL_SCRIPTS.some(
            script =>
                script.name
                    .toLowerCase() ===
                baseName.toLowerCase()
        );


    /*
        First copy:
        Script Copy

        Second:
        Script Copy 2

        Third:
        Script Copy 3
    */

    let candidate =
        `${baseName} Copy`;

    let counter =
        2;


    while (
        names.has(
            candidate.toLowerCase()
        )
    ) {

        candidate =
            `${baseName} Copy ${counter}`;

        counter++;

    }


    /*
        In case an original script has
        exactly that name.
    */

    if (
        originalExists &&
        candidate
            .toLowerCase() ===
        baseName.toLowerCase()
    ) {

        candidate =
            `${baseName} Copy`;

    }


    return candidate;

}


/* =========================================================
   SAVE
   ========================================================= */

function saveCurrentScript() {

    const script =
        getActiveScript();

    if (!script) {

        showToast(
            "No script is open.",
            "error"
        );

        return;
    }


    /*
        Only personal scripts are saved
        into localStorage.

        Original M365Buddy scripts remain
        read-only source templates.
    */

    if (
        isOriginalScript(
            script.id
        )
    ) {

        showToast(
            "M365Buddy source scripts are read-only. Create an editable copy to modify it.",
            "error"
        );

        return;
    }


    script.content =
        editor.getValue();

    script.modified =
        false;


    saveState();

    renderTabs();

    renderSidebar();


    showToast(
        "Script saved successfully.",
        "success"
    );

}


/* =========================================================
   COPY TO CLIPBOARD
   ========================================================= */

async function copyCurrentScript() {

    const content =
        editor.getValue();


    try {

        await navigator.clipboard.writeText(
            content
        );


        showToast(
            "Script copied to clipboard.",
            "success"
        );

    }
    catch (error) {

        /*
            Fallback for browsers where
            clipboard permission is unavailable.
        */

        const temp =
            document.createElement(
                "textarea"
            );

        temp.value =
            content;

        document.body.appendChild(
            temp
        );

        temp.select();

        document.execCommand(
            "copy"
        );

        temp.remove();


        showToast(
            "Script copied to clipboard.",
            "success"
        );

    }

}


/* =========================================================
   DOWNLOAD
   ========================================================= */

function downloadCurrentScript() {

    const script =
        getActiveScript();

    if (!script) {
        return;
    }


    const blob =
        new Blob(
            [
                editor.getValue()
            ],
            {
                type:
                    "text/plain;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );

    link.href =
        url;

    link.download =
        sanitizeFilename(
            script.name
        ) +
        ".ps1";


    document.body.appendChild(
        link
    );

    link.click();

    link.remove();


    URL.revokeObjectURL(
        url
    );


    showToast(
        "PowerShell file downloaded.",
        "success"
    );

}


function sanitizeFilename(name) {

    return name
        .replace(
            /[<>:"/\\|?*]+/g,
            "_"
        )
        .trim();

}

            () => {

                suppressEditorChange =
                    true;

                editor.setValue(
                    script.content || ""
                );

                suppressEditorChange =
                    false;

                closeModal();


                showToast(
                    "Script reset.",
                    "success"
                );

            }
        );

}


/* =========================================================
   FIND
   ========================================================= */

function openFindBar() {

    findBar.classList.add(
        "visible"
    );

    findInput.focus();

    findInput.select();

    updateSearchHighlights();

}


function closeFindBar() {

    findBar.classList.remove(
        "visible"
    );

    clearSearchMarks();

    editor.focus();

}


function clearSearchMarks() {

    searchMarks.forEach(
        mark => mark.clear()
    );

    searchMarks = [];

    currentSearchIndex =
        0;

    findCount.textContent =
        "0 matches";

}


function updateSearchHighlights() {

    clearSearchMarks();


    const query =
        findInput.value;


    if (!query) {
        return;
    }


    const content =
        editor.getValue();


    const lowerContent =
        content.toLowerCase();

    const lowerQuery =
        query.toLowerCase();


    let position = 0;


    while (true) {

        const index =
            lowerContent.indexOf(
                lowerQuery,
                position
            );


        if (index === -1) {
            break;
        }


        const from =
            editor.posFromIndex(
                index
            );


        const to =
            editor.posFromIndex(
                index +
                query.length
            );


        const mark =
            editor.markText(
                from,
                to,
                {
                    className:
                        "cm-search-match"
                }
            );


        searchMarks.push(
            mark
        );


        position =
            index +
            Math.max(
                query.length,
                1
            );

    }


    findCount.textContent =
        `${searchMarks.length} match${
            searchMarks.length === 1
                ? ""
                : "es"
        }`;


    if (
        searchMarks.length > 0
    ) {

        currentSearchIndex =
            0;

        selectSearchMatch(
            0
        );

    }

}


function selectSearchMatch(index) {

    if (
        searchMarks.length === 0
    ) {
        return;
    }


    /*
        Rebuild current-match styling.
    */

    searchMarks.forEach(
        mark => {

            const range =
                mark.find();

            if (!range) {
                return;
            }


            mark.clear();

            /*
                Recreate ordinary highlight.
            */

        }
    );


    /*
        Instead of modifying the existing
        marks in place, rebuild all marks.
    */

    clearSearchMarksWithoutReset();


    const query =
        findInput.value;


    const content =
        editor.getValue();


    const lowerContent =
        content.toLowerCase();

    const lowerQuery =
        query.toLowerCase();


    let position = 0;

    let foundIndex = 0;


    while (true) {

        const contentIndex =
            lowerContent.indexOf(
                lowerQuery,
                position
            );


        if (
            contentIndex === -1
        ) {
            break;
        }


        const from =
            editor.posFromIndex(
                contentIndex
            );


        const to =
            editor.posFromIndex(
                contentIndex +
                query.length
            );


        const mark =
            editor.markText(
                from,
                to,
                {
                    className:
                        foundIndex === index
                            ? "cm-search-current"
                            : "cm-search-match"
                }
            );


        searchMarks.push(
            mark
        );


        foundIndex++;

        position =
            contentIndex +
            Math.max(
                query.length,
                1
            );

    }


    currentSearchIndex =
        index;


    const current =
        searchMarks[index];


    if (current) {

        const range =
            current.find();

        if (range) {

            editor.setSelection(
                range.from,
                range.to
            );

            editor.scrollIntoView(
                {
                    from: range.from,
                    to: range.to
                },
                120
            );

        }

    }

}


function clearSearchMarksWithoutReset() {

    searchMarks.forEach(
        mark => mark.clear()
    );

    searchMarks = [];

}


function findNext() {

    if (
        searchMarks.length === 0
    ) {

        updateSearchHighlights();

        return;

    }


    const next =
        (
            currentSearchIndex +
            1
        ) %
        searchMarks.length;


    selectSearchMatch(
        next
    );

}


function findPrevious() {

    if (
        searchMarks.length === 0
    ) {

        updateSearchHighlights();

        return;

    }


    const previous =
        (
            currentSearchIndex -
            1 +
            searchMarks.length
        ) %
        searchMarks.length;


    selectSearchMatch(
        previous
    );

}


/* =========================================================
   THEME
   ========================================================= */

function applyTheme() {

    if (
        state.theme === "dark"
    ) {

        document.body.classList.add(
            "dark"
        );

        themeButton.textContent =
            "☀";

    }
    else {

        document.body.classList.remove(
            "dark"
        );

        themeButton.textContent =
            "☾";

    }

}


function toggleTheme() {

    state.theme =
        state.theme === "light"
            ? "dark"
            : "light";


    applyTheme();

    saveState();

}


/* =========================================================
   FONT
   ========================================================= */

function applyFontSettings() {

    editor.getWrapperElement().style.fontFamily =
        state.fontFamily;

    editor.getWrapperElement().style.fontSize =
        `${state.fontSize}px`;


    /*
        CodeMirror's actual editor element
        needs explicit font settings.
    */

    editor.getWrapperElement()
        .querySelectorAll(
            ".CodeMirror-code, .CodeMirror-line, .CodeMirror-linenumber"
        )
        .forEach(
            element => {

                element.style.fontFamily =
                    state.fontFamily;

                element.style.fontSize =
                    `${state.fontSize}px`;

            }
        );


    fontSelect.value =
        state.fontFamily;

    fontSizeSelect.value =
        String(
            state.fontSize
        );


    /*
        CSS custom properties aren't needed
        here because CodeMirror is controlled
        directly.
    */

    const styleId =
        "dynamic-editor-font";


    let style =
        document.getElementById(
            styleId
        );


    if (!style) {

        style =
            document.createElement(
                "style"
            );

        style.id =
            styleId;

        document.head.appendChild(
            style
        );

    }


    style.textContent = `

        .CodeMirror,
        .CodeMirror pre,
        .CodeMirror-line,
        .CodeMirror-linenumber {

            font-family:
                ${state.fontFamily} !important;

            font-size:
                ${state.fontSize}px !important;

        }

    `;

}


/* =========================================================
   HOME
   ========================================================= */

function openHome() {

    /*
        Reusing the named browser window means:
        if M365Buddy Home was already opened
        using this name, the browser can reuse it.

        The editor itself stays open.
    */

    window.open(
        "https://m365buddy.com/",
        "M365BuddyHome"
    );

}


/* =========================================================
   MODAL
   ========================================================= */

function closeModal() {

    modalBackdrop.classList.remove(
        "visible"
    );

    modalBody.innerHTML =
        "";

    modalFooter.innerHTML =
        "";

}


modalClose.addEventListener(
    "click",
    closeModal
);


/*
    Clicking the dark area outside the
    modal also closes it.
*/

modalBackdrop.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            modalBackdrop
        ) {

            closeModal();

        }

    }
);


/* =========================================================
   TOAST
   ========================================================= */

function showToast(
    message,
    type = ""
) {

    const toast =
        document.createElement(
            "div"
        );


    toast.className =
        "toast " +
        type;


    toast.textContent =
        message;


    toastContainer.appendChild(
        toast
    );


    setTimeout(
        () => {

            toast.remove();

        },
        3000
    );

}


/* =========================================================
   EVENTS
   ========================================================= */

function setupEvents() {


    /*
        CREATE NEW SCRIPT
    */

    newScriptButton.addEventListener(
        "click",
        openCreateScriptModal
    );


    /*
        PLUS NEXT TO TABS

        This is the important new behavior.
    */

    addTabButton.addEventListener(
        "click",
        event => {

            event.preventDefault();

            event.stopPropagation();

            openCreateScriptModal();

        }
    );


    /*
        SAVE
    */

    saveButton.addEventListener(
        "click",
        saveCurrentScript
    );


    /*
        COPY
    */

    copyButton.addEventListener(
        "click",
        copyCurrentScript
    );


    /*
        EDITABLE COPY
    */

    editableCopyButton.addEventListener(
        "click",
        createEditableCopy
    );


    /*
        DOWNLOAD
    */

    downloadButton.addEventListener(
        "click",
        downloadCurrentScript
    );


    /*
        FIND
    */

    findButton.addEventListener(
        "click",
        openFindBar
    );


    findInput.addEventListener(
        "input",
        updateSearchHighlights
    );


    findInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                if (
                    event.shiftKey
                ) {

                    findPrevious();

                }
                else {

                    findNext();

                }

                event.preventDefault();

            }


            if (
                event.key === "Escape"
            ) {

                closeFindBar();

            }

        }
    );


    findNextButton.addEventListener(
        "click",
        findNext
    );


    findPreviousButton.addEventListener(
        "click",
        findPrevious
    );


    closeFindButton.addEventListener(
        "click",
        closeFindBar
    );


    /*
        RENAME
    */

    renameButton.addEventListener(
        "click",
        renameCurrentScript
    );


    /*
        RESET
    */

    resetButton.addEventListener(
        "click",
        resetCurrentScript
    );


    /*
        DELETE
    */

    deleteButton.addEventListener(
        "click",
        deleteCurrentScript
    );


    /*
        HOME
    */

    homeButton.addEventListener(
        "click",
        openHome
    );


    /*
        THEME
    */

    themeButton.addEventListener(
        "click",
        toggleTheme
    );


    /*
        FONT
    */

    fontSelect.addEventListener(
        "change",
        () => {

            state.fontFamily =
                fontSelect.value;

            applyFontSettings();

            saveState();

        }
    );


    /*
        FONT SIZE
    */

    fontSizeSelect.addEventListener(
        "change",
        () => {

            state.fontSize =
                Number(
                    fontSizeSelect.value
                );

            applyFontSettings();

            saveState();

        }
    );


    /*
        SIDEBAR SEARCH
    */

    scriptSearch.addEventListener(
        "input",
        renderSidebar
    );


    /*
        Keyboard shortcut:
        Ctrl + F
    */

    document.addEventListener(
        "keydown",
        event => {

            if (
                (event.ctrlKey ||
                 event.metaKey) &&
                event.key.toLowerCase() === "f"
            ) {

                event.preventDefault();

                openFindBar();

            }

        }
    );

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value) {

    return escapeHtml(
        value
    );

}


/* =========================================================
   START
   ========================================================= */

initialize();

</script>
