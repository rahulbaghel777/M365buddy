<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M365Buddy Script Workspace</title>

<link rel="icon" type="image/svg+xml" href="favicon.svg">

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #f5f7fb;
    --panel: #ffffff;
    --panel-soft: #f8fafc;
    --border: #d9dee8;
    --text: #172033;
    --muted: #647084;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --danger: #dc2626;
    --editor-bg: #ffffff;
    --editor-text: #172033;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

/* =========================================================
   MAIN APPLICATION
========================================================= */

.app {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
}

/* =========================================================
   TOP HEADER
========================================================= */
.topbar {
    height: 56px;
    min-height: 56px;

    background: var(--panel);
    border-bottom: 1px solid var(--border);

    display: grid;
    grid-template-columns: 1fr auto 1fr;

    align-items: center;

    padding: 0 12px;
}

.header-left {
    justify-self: start;

    display: flex;
    align-items: center;
    gap: 6px;
}

.brand {
    justify-self: center;

    font-size: 18px;
    font-weight: 800;
    white-space: nowrap;
    cursor: pointer;
}

.brand span {
    color: #0078d4;
}

.top-actions {
    justify-self: end;

    display: flex;
    align-items: center;
}
    
/* =========================================================
   BUTTONS
========================================================= */

.btn {
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    background: #ffffff;
    color: var(--text);
    border-radius: 7px;
    padding: 0 10px;
    font-size: 12.5px;
    line-height: 1;
    text-decoration: none;
}

.btn:hover {
    background: #f1f5f9;
}

.btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
}

.btn.primary:hover {
    background: var(--accent-hover);
}

.btn.danger {
    color: var(--danger);
}

.btn.danger:hover {
    background: #fef2f2;
}

.header-left .btn,
.top-actions .btn {
    height: 28px;
    min-height: 28px;
    padding: 0 8px;
    font-size: 12px;
    line-height: 1;
}

/* =========================================================
   BODY
========================================================= */

.body {
    flex: 1;
    min-height: 0;
    display: flex;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    width: 245px;
    min-width: 245px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
}

.side-head {
    padding: 8px 9px;
    border-bottom: 1px solid var(--border);
}

.side-title {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
}

.m365-brand {
    color: #0078d4;
}

.side-search {
    width: 100%;
    height: 30px;
    min-height: 30px;
    box-sizing: border-box;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 7px;
    outline: none;
    font-size: 12px;
    line-height: 20px;
}

.side-search:focus {
    border-color: var(--accent);
}

.script-list {
    padding: 6px;
    overflow-y: auto;
    flex: 1;
}

.script-item {
    padding: 9px 10px;
    border-radius: 7px;
    margin-bottom: 4px;
    cursor: pointer;
    border: 1px solid transparent;
}

.script-item:hover {
    background: #f1f5f9;
}

.script-item.active {
    background: #eff6ff;
    border-color: #bfdbfe;
    color: #1d4ed8;
}

.script-name {
    font-size: 13px;
    font-weight: 600;
}

.script-meta {
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 3px;
}

.side-bottom {
    padding: 10px;
    border-top: 1px solid var(--border);
}

.side-bottom .btn {
    width: 100%;
}

    /* =========================================================
   SIDEBAR SCRIPT CLOSE BUTTON
========================================================= */

.script-item {
    position: relative;
    padding-right: 34px;
}

.script-close {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);

    width: 22px;
    height: 22px;

    border: none;
    background: transparent;

    color: #94a3b8;

    border-radius: 5px;

    font-size: 17px;
    line-height: 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    opacity: 0.55;

    transition:
        opacity 0.15s,
        background 0.15s,
        color 0.15s;
}

.script-item:hover .script-close {
    opacity: 1;
}

.script-close:hover {
    background: #fee2e2;
    color: #dc2626;
}
    
/* =========================================================
   WORKSPACE
========================================================= */

.workspace {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

/* =========================================================
   EDITOR TABS
========================================================= */

.tabbar {
    height: 38px;
    min-height: 38px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    overflow-x: auto;
}

.tab {
    height: 32px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px 0 10px;
    font-size: 12.5px;
    border: 1px solid transparent;
    border-radius: 7px 7px 0 0;
    background: #f1f5f9;
    white-space: nowrap;
    max-width: 240px;
    flex-shrink: 0;
}

.tab.active {
    background: #ffffff;
    border-color: var(--border);
    border-bottom-color: #ffffff;
    margin-bottom: -6px;
}

.tab-label {
    overflow: hidden;
    text-overflow: ellipsis;
}

.tab-close {
    border: 0;
    background: transparent;
    color: #647084;
    font-size: 16px;
    width: 20px;
    height: 20px;
    border-radius: 4px;
    padding: 0;
    line-height: 18px;
}

.tab-close:hover {
    background: #e2e8f0;
    color: #111827;
}

/* =========================================================
   PLUS BUTTON
   DIRECTLY NEXT TO OPENED SCRIPT TABS
========================================================= */

.add-tab {
    flex: 0 0 34px;
    width: 34px;
    height: 34px;
    border: 1px dashed #94a3b8;
    background: #ffffff;
    border-radius: 8px;
    font-size: 19px;
    color: #475569;
    line-height: 30px;
    margin-left: 2px;
}

.add-tab:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: #eff6ff;
}

/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {
    min-height: 72px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 4px;
    padding: 4px 8px;
    overflow: visible;
}

.toolbar-row {
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
}

.toolbar-actions {
    flex: 0 0 auto;
}

.toolbar-tools {
    flex: 1 1 auto;
}

.toolbar-tools #findInput {
    flex: 1 1 220px;
    min-width: 150px;
}

.toolbar-tools .replace-input {
    flex: 0 1 210px;
    min-width: 150px;
}

.toolbar .separator {
    height: 22px;
    width: 1px;
    background: var(--border);
    margin: 0 3px;
}

.toolbar input,
.toolbar select {
    height: 32px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #ffffff;
    padding: 0 7px;
    font-size: 12px;
}

.toolbar input {
    width: 175px;
}

.toolbar input.replace-input {
    width: 165px;
}

.toolbar #findInput {
    flex: 1 1 175px;
    min-width: 135px;
    width: auto;
}

.toolbar .spacer {
    display: none;
}

#fontSelect {
    width: 108px;
    flex: 0 0 108px;
}

#fontSizeSelect {
    width: 58px;
    flex: 0 0 58px;
}

#findBtn,
#findPrevBtn,
#findNextBtn,
#replaceBtn,
#replaceAllBtn {
    flex: 0 0 auto;
    white-space: nowrap;
}

#findPrevBtn,
#findNextBtn {
    width: 34px;
    padding: 0;
}

/* =========================================================
   EDITOR
========================================================= */

.editor-wrap {
    flex: 1;
    min-height: 0;
    padding: 2px;
    background: #eef2f7;
    display: flex;
}

.editor-card {
    flex: 1;
    min-width: 0;
    min-height: 0;
    background: var(--editor-bg);
    border: 1px solid var(--border);
    border-radius: 9px;
    display: flex;
    overflow: hidden;
}

.line-numbers {
    width: 52px;
    min-width: 52px;
    background: #f8fafc;
    border-right: 1px solid #e2e8f0;
    color: #94a3b8;
    text-align: right;
    padding: 10px 8px 10px 0;
    font: 12px/19px Consolas, "Courier New", monospace;
    overflow: hidden;
    user-select: none;
    white-space: pre;
}

.editor {
    flex: 1;
    min-width: 0;
    min-height: 0;
    resize: none;
    border: 0;
    outline: 0;
    padding: 9px 13px;
    font: 12px/19px Consolas, "Courier New", monospace;
    color: var(--editor-text);
    background: var(--editor-bg);
    white-space: pre;
    overflow: auto;
    tab-size: 4;
}

.editor:focus {
    box-shadow: inset 0 0 0 2px rgba(37, 99, 235, 0.12);
}

/* Find-match highlight: readable in both light and dark themes. */
.editor::selection {
    background: #facc15;
    color: #111827;
}

.editor[readonly] {
    background: #fbfcfe;
}

/* =========================================================
   STATUS BAR
========================================================= */

.statusbar {
    height: 26px;
    min-height: 26px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-size: 11px;
    color: var(--muted);
    gap: 15px;
}

.statusbar .right {
    margin-left: auto;
}

/* =========================================================
   MODAL
========================================================= */

.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.38);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.modal-backdrop.show {
    display: flex;
}

.modal {
    width: min(520px, calc(100vw - 32px));
    background: #ffffff;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 25px 70px rgba(15, 23, 42, 0.25);
    overflow: hidden;
}

.modal-head {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
}

.modal-title {
    font-weight: 700;
}

.modal-x {
    margin-left: auto;
    border: 0;
    background: transparent;
    font-size: 22px;
    color: #647084;
    cursor: pointer;
}

.modal-body {
    padding: 18px;
}

.modal-foot {
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

.option {
    display: flex;
    gap: 12px;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 9px;
    margin-bottom: 10px;
    cursor: pointer;
}

.option:hover {
    border-color: #93c5fd;
    background: #f8fbff;
}

.option-icon {
    font-size: 20px;
}

.option-title {
    font-weight: 650;
    font-size: 14px;
}

.option-desc {
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
}

.modal-input {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: 0;
}

.modal-input:focus {
    border-color: var(--accent);
}

/* =========================================================
   TOAST
========================================================= */

.toast {
    position: fixed;
    right: 18px;
    bottom: 42px;
    background: #172033;
    color: #ffffff;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    box-shadow: 0 8px 25px rgba(15, 23, 42, 0.15);
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: 0.2s;
    z-index: 1200;
}

.toast.show {
    opacity: 1;
    transform: translateY(0);
}

/* =========================================================
   EMPTY STATE
========================================================= */

.empty {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    text-align: center;
    padding: 30px;
}

.empty-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
}

.empty-text {
    font-size: 13px;
    line-height: 1.6;
}

/* =========================================================
   DARK THEME
========================================================= */

body.dark {
    --bg: #111827;
    --panel: #1f2937;
    --panel-soft: #111827;
    --border: #374151;
    --text: #f3f4f6;
    --muted: #9ca3af;
    --editor-bg: #111827;
    --editor-text: #f3f4f6;
}

body.dark .btn,
body.dark .toolbar input,
body.dark .toolbar select,
body.dark .side-search,
body.dark .modal-input {
    background: #111827;
    color: #f3f4f6;
    border-color: #374151;
}

body.dark .btn:hover {
    background: #374151;
}

/* Keep primary actions blue in dark mode as well. */
body.dark .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
}

body.dark .btn.primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
}

body.dark .m365-brand {
    color: #0078d4;
}

.script-item.original .script-meta {
    color: #0078d4;
    font-weight: 600;
}

.m365-status-brand {
    color: #0078d4;
    font-weight: 600;
}

body.dark .script-item:hover {
    background: #374151;
}

body.dark .script-item.active {
    background: #1e3a5f;
    border-color: #2563eb;
    color: #bfdbfe;
}

body.dark .tab {
    background: #111827;
    color: #f3f4f6;
}

body.dark .tab.active {
    background: #1f2937;
    border-color: #374151;
    border-bottom-color: #1f2937;
}

body.dark .add-tab {
    background: #111827;
    color: #d1d5db;
    border-color: #4b5563;
}

body.dark .add-tab:hover {
    background: #1e3a5f;
}

body.dark .editor-wrap {
    background: #0f172a;
}

body.dark .line-numbers {
    background: #1f2937;
    border-color: #374151;
    color: #6b7280;
}

body.dark .editor[readonly] {
    background: #172033;
}

body.dark .modal {
    background: #1f2937;
}

body.dark .option:hover {
    background: #374151;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 850px) {

    .sidebar {
        width: 220px;
        min-width: 220px;
    }

    .toolbar input {
        width: 150px;
    }

    .topbar {
        padding: 0 10px;
    }

    .brand {
        font-size: 17px;
    }
}

@media (max-width: 650px) {

    .sidebar {
        display: none;
    }

    .top-actions .btn:first-child {
        display: none;
    }

    .toolbar {
        overflow-y: auto;
        max-height: 100px;
    }

    .editor-wrap {
        padding: 5px;
    }

    .line-numbers {
        width: 40px;
        min-width: 40px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- =====================================================
         TOP HEADER
    ====================================================== -->
<header class="topbar">

    <div class="header-left">

        <button
            type="button"
            class="btn"
            id="homeBtn">
            ← Home
        </button>

        <a
            href="/articles/sharepoint-online-site-inventory.html"
            class="btn">
            Articles
        </a>

    </div>

    <div
        class="brand"
        id="brandHome"
        title="Open M365Buddy home">

        <span>M365Buddy</span> Script Workspace

    </div>

    <div class="top-actions">

        <button
            type="button"
            class="btn"
            id="themeBtn">
            Dark
        </button>

    </div>

</header>
    
    <!-- =====================================================
         BODY
    ====================================================== -->

    <div class="body">

        <!-- =================================================
             SIDEBAR
        ================================================== -->

        <aside class="sidebar">

            <div class="side-head">

                <div class="side-title">
                    <span class="m365-brand">M365Buddy</span> Scripts
                </div>

                <input
                    type="text"
                    id="sideSearch"
                    class="side-search"
                    placeholder="Search scripts...">

            </div>

            <div
                class="script-list"
                id="scriptList">
            </div>

            <div class="side-bottom">

    <button
        type="button"
        class="btn primary"
        id="newScriptBtn"
        style="margin-bottom:8px;">
        ＋ Add New Script
    </button>

    </div>

        </aside>


        <!-- =================================================
             WORKSPACE
        ================================================== -->

        <main class="workspace">

            <!-- =================================================
                 EDITOR TABS

                 IMPORTANT:
                 PLUS BUTTON IS HERE, DIRECTLY NEXT TO TABS.
            ================================================== -->

            <div
                class="tabbar"
                id="tabbar">

                <button
                    type="button"
                    class="add-tab"
                    id="addTabBtn"
                    title="Open another editor tab">
                    +
                </button>

            </div>


            <!-- =================================================
                 TOOLBAR
            ================================================== -->

            <div class="toolbar">

                <div class="toolbar-row toolbar-actions">

                <button
                    type="button"
                    class="btn"
                    id="saveBtn">
                    Save
                </button>

                <button
                    type="button"
                    class="btn"
                    id="copyBtn">
                    Copy
                </button>

                <button
    type="button"
    class="btn"
    id="pasteBtn">
    Paste
</button>
                

                <button
                    type="button"
                    class="btn"
                    id="downloadBtn">
                    Download
                </button>

                <button
                    type="button"
                    class="btn"
                    id="renameBtn">
                    Rename
                </button>

                <button
                    type="button"
                    class="btn danger"
                    id="deleteBtn">
                    Delete
                </button>

                <button
                    type="button"
                    class="btn"
                    id="resetBtn">
                    Reset
                </button>

                </div>

                <div class="toolbar-row toolbar-tools">

                <input
                    type="text"
                    id="findInput"
                    placeholder="Find in script..."
                    autocomplete="off">

                <button
                    type="button"
                    class="btn"
                    id="findBtn">
                    Find
                </button>

                <button
                    type="button"
                    class="btn"
                    id="findPrevBtn">
                    ↑
                </button>

                <button
                    type="button"
                    class="btn"
                    id="findNextBtn">
                    ↓
                </button>

                <span
                    id="findCount"
                    style="font-size:12px;color:#647084">
                </span>

                <input
                    type="text"
                    id="replaceInput"
                    class="replace-input"
                    placeholder="Replace with..."
                    autocomplete="off">

                <button
                    type="button"
                    class="btn"
                    id="replaceBtn">
                    Replace
                </button>

                <button
                    type="button"
                    class="btn"
                    id="replaceAllBtn">
                    Replace All
                </button>

                <select id="fontSelect">
                    <option value="Consolas">Consolas</option>
                    <option value="Courier New">Courier New</option>
                    <option value="monospace">Monospace</option>
                </select>

                <select id="fontSizeSelect">
    <option value="10">10</option>
    <option value="11">11</option>
    <option value="12" selected>12</option>
    <option value="13">13</option>
    <option value="14">14</option>
    <option value="15">15</option>
    <option value="16">16</option>
</select>

                </div>

            </div>


            <!-- =================================================
                 EDITOR
            ================================================== -->

            <div class="editor-wrap">

                <div class="editor-card">

                    <div
                        class="line-numbers"
                        id="lineNumbers">
                        1
                    </div>

                    <textarea
                        id="editor"
                        class="editor"
                        spellcheck="false"
                        wrap="off"></textarea>

                </div>

            </div>


            <!-- =================================================
                 STATUS BAR
            ================================================== -->

            <div class="statusbar">

                <span id="statusText">
                    Ready
                </span>

                <span id="dirtyText">
                </span>

                <span
                    class="right"
                    id="positionText">
                    Ln 1, Col 1
                </span>

            </div>

        </main>

    </div>

</div>


<!-- =========================================================
     SITE NATIVE MODAL
========================================================= -->

<div
    class="modal-backdrop"
    id="modalBackdrop">

    <div
        class="modal"
        role="dialog"
        aria-modal="true">

        <div class="modal-head">

            <div
                class="modal-title"
                id="modalTitle">
                Create New Script
            </div>

            <button
                type="button"
                class="modal-x"
                id="modalClose">
                ×
            </button>

        </div>

        <div
            class="modal-body"
            id="modalBody">
        </div>

        <div
            class="modal-foot"
            id="modalFoot">
        </div>

    </div>

</div>


<div
    class="toast"
    id="toast">
</div>


<script>

(function () {

"use strict";

/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
    "m365buddy_script_workspace_functional_v2";

const LEGACY_STORAGE_KEY =

/* =========================================================
   UTILITY
========================================================= */

function makeId(prefix) {

    return (
        prefix +
        "_" +
        Date.now().toString(36) +
        "_" +
        Math.random()
            .toString(36)
            .slice(2, 8)
    );
}


function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function showToast(message) {

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer =
        setTimeout(
            function () {
                toast.classList.remove("show");
            },
            2200
        );
}


/* =========================================================
   STORAGE
========================================================= */

function saveState() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
                scripts: state.scripts,
                openTabs: state.openTabs,
                activeTabId: state.activeTabId,
                theme: state.theme,
                font: state.font,
                fontSize: state.fontSize
            })
        );

    } catch (error) {

        console.error(error);

        showToast(
            "Unable to save workspace locally."
        );
    }
}


function loadState() {

    isFirstRun = false;

    try {

        let raw =
            localStorage.getItem(STORAGE_KEY);

        /*
         * One-time migration from the previous workspace.
         * We deliberately do NOT migrate old open tabs because
         * those tabs are what caused stale editors to return.
         */
        if (!raw) {
            const legacyRaw =
                localStorage.getItem(LEGACY_STORAGE_KEY);

            if (legacyRaw) {
                try {
                    const legacy =
                        JSON.parse(legacyRaw);

                    state.scripts =
                        Array.isArray(legacy.scripts)
                            ? legacy.scripts
                            : [];

                    state.openTabs = [];
                    state.activeTabId = null;
                    state.theme =
                        legacy.theme === "dark"
                            ? "dark"
                            : "light";
                    state.font =
                        legacy.font || "Consolas";
                    state.fontSize =
                        legacy.fontSize || "12";

                    raw = null;
                } catch (migrationError) {
                    console.error(migrationError);
                    raw = null;
                }
            } else {
                isFirstRun = true;
            }
        }

        if (raw) {

            const saved =
                JSON.parse(raw);

            state.scripts =
                Array.isArray(saved.scripts)
                    ? saved.scripts
                    : [];

            state.openTabs =
                Array.isArray(saved.openTabs)
                    ? saved.openTabs
                    : [];

            state.activeTabId =
                saved.activeTabId || null;

            state.theme =
                saved.theme === "dark"
                    ? "dark"
                    : "light";

            state.font =
                saved.font || "Consolas";

            state.fontSize =
                ["10", "11", "12", "13", "14", "15", "16"].includes(String(saved.fontSize))
                    ? String(saved.fontSize)
                    : "12";
        }

        ORIGINAL_SCRIPTS.forEach(
            function (original) {

                const existing =
                    state.scripts.find(
                        function (script) {
                            return script.id === original.id;
                        }
                    );

                if (!existing) {

                    state.scripts.push({
                        ...original,
                        original: true,
                        readOnly: true,
                        sidebarHidden: false
                    });

                } else {

                    existing.original = true;
                    existing.readOnly = true;

                    if (
                        typeof existing.sidebarHidden !== "boolean"
                    ) {
                        existing.sidebarHidden = false;
                    }

                    existing.name = original.name;
                    existing.description = original.description;
                    existing.content = original.content;
                }
            }
        );

        /*
         * Remove broken or hidden-script tabs immediately.
         */
        state.openTabs =
            state.openTabs.filter(
                function (tab) {

                    const script =
                        getScript(tab.scriptId);

                    return !!script &&
                        !script.sidebarHidden;
                }
            );

        if (
            !state.openTabs.some(
                function (tab) {
                    return tab.id === state.activeTabId;
                }
            )
        ) {
            state.activeTabId =
                state.openTabs.length
                    ? state.openTabs[state.openTabs.length - 1].id
                    : null;
        }

    } catch (error) {

        console.error(error);

        state.scripts =
            ORIGINAL_SCRIPTS.map(
                function (script) {
                    return {
                        ...script,
                        original: true,
                        readOnly: true,
                        sidebarHidden: false
                    };
                }
            );

        state.openTabs = [];
        state.activeTabId = null;
        state.theme = "light";
        state.font = "Consolas";
        state.fontSize = "12";
        isFirstRun = true;
    }
}

/* =========================================================
   SCRIPT HELPERS
========================================================= */

function getScript(scriptId) {

    return state.scripts.find(
        function (script) {
            return script.id === scriptId;
        }
    );
}


function getTab(tabId) {

    return state.openTabs.find(
        function (tab) {
            return tab.id === tabId;
        }
    );
}


function getActiveTab() {

    return getTab(
        state.activeTabId
    );
}


/* =========================================================
   SIDEBAR
========================================================= */

function renderScriptList() {

    const search =
        sideSearch.value
            .trim()
            .toLowerCase();

    const visibleScripts =
        state.scripts.filter(
            function (script) {

                
                if (script.sidebarHidden) {
                    return false;
                }

                const haystack =
                    (
                        script.name +
                        " " +
                        (script.description || "")
                    ).toLowerCase();

                return haystack.includes(search);
            }
        );

    if (!visibleScripts.length) {

        scriptList.innerHTML =
            '<div class="empty">' +
                '<div>' +
                    '<div class="empty-title">No scripts found</div>' +
                    '<div class="empty-text">Create a new script or change your search.</div>' +
                '</div>' +
            '</div>';

        return;
    }

    scriptList.innerHTML =
        visibleScripts.map(
            function (script) {

                const active =
                    state.openTabs.some(
                        function (tab) {
                            return (
                                tab.scriptId === script.id &&
                                tab.id === state.activeTabId
                            );
                        }
                    );

                return (
                    '<div class="script-item ' +
                    (active ? 'active ' : '') +
                    (script.original ? 'original' : '') +
                    '" data-script-id="' +
                    escapeHtml(script.id) +
                    '">' +
                        '<div class="script-info" style="padding-right:26px;">' +
                            '<div class="script-name">' +
                                escapeHtml(script.name) +
                            '</div>' +
                            '<div class="script-meta">' +
                                (script.original ? 'M365Buddy script' : 'Personal script') +
                            '</div>' +
                        '</div>' +
                        '<button type="button" class="script-close" title="Close script" aria-label="Close ' +
                            escapeHtml(script.name) +
                        '">×</button>' +
                    '</div>'
                );
            }
        ).join("");

    scriptList
        .querySelectorAll(".script-item")
        .forEach(
            function (item) {

                item.addEventListener(
                    "click",
                    function (event) {

                        if (
                            event.target.closest(".script-close")
                        ) {
                            return;
                        }

                        openScript(
                            item.dataset.scriptId
                        );
                    }
                );

                item.addEventListener(
                    "dblclick",
                    function (event) {

                        if (
                            event.target.closest(".script-close")
                        ) {
                            return;
                        }

                        event.preventDefault();
                        event.stopPropagation();

                        openScript(
                            item.dataset.scriptId
                        );

                        openRenameModal();
                    }
                );

                const closeButton =
                    item.querySelector(".script-close");

                closeButton.addEventListener(
                    "click",
                    function (event) {

                        event.preventDefault();
                        event.stopPropagation();

                        closeSidebarScript(
                            item.dataset.scriptId
                        );
                    }
                );
            }
        );
}


function closeSidebarScript(scriptId) {

    const script =
        getScript(scriptId);

    if (!script) {
        return;
    }

    syncEditorToState();

    /* Remove every open editor tab for this script. */
    state.openTabs =
        state.openTabs.filter(
            function (tab) {
                return tab.scriptId !== scriptId;
            }
        );

    if (script.original) {

        /* Built-in scripts are hidden, not deleted. */
        script.sidebarHidden = true;

    } else {

        /* Personal scripts are removed from the workspace. */
        state.scripts =
            state.scripts.filter(
                function (item) {
                    return item.id !== scriptId;
                }
            );
    }

    if (
        !state.openTabs.some(
            function (tab) {
                return tab.id === state.activeTabId;
            }
        )
    ) {
        state.activeTabId =
            state.openTabs.length
                ? state.openTabs[state.openTabs.length - 1].id
                : null;
    }

    saveState();
    renderScriptList();
    renderTabs();
    loadActiveEditor();

    showToast(
        script.name + " closed."
    );
}

/* =========================================================
   TABS
========================================================= */

function renderTabs() {

    /*
     * Remove everything except the + button.
     */

    Array.from(
        tabbar.children
    ).forEach(
        function (child) {

            if (child !== addTabBtn) {
                child.remove();
            }

        }
    );

    state.openTabs.forEach(
        function (tab) {

            const script =
                getScript(tab.scriptId);

            if (!script) {
                return;
            }

            const tabElement =
                document.createElement("div");

            tabElement.className =
                "tab" +
                (
                    tab.id === state.activeTabId
                        ? " active"
                        : ""
                );

            tabElement.dataset.tabId =
                tab.id;

            const label =
                document.createElement("span");

            label.className =
                "tab-label";

            label.textContent =
                script.name;

            const close =
                document.createElement("button");

            close.type = "button";

            close.className =
                "tab-close";

            close.textContent =
                "×";

            close.title =
                "Close editor tab";

            tabElement.appendChild(
                label
            );

            tabElement.appendChild(
                close
            );

            tabElement.addEventListener(
                "click",
                function (event) {

                    if (
                        event.target === close
                    ) {
                        return;
                    }

                    activateTab(
                        tab.id
                    );
                }
            );

            tabElement.addEventListener(
                "dblclick",
                function (event) {

                    if (event.target === close) {
                        return;
                    }

                    event.preventDefault();
                    event.stopPropagation();

                    activateTab(tab.id);
                    openRenameModal();
                }
            );

            close.addEventListener(
                "click",
                function (event) {

                    event.stopPropagation();

                    closeTab(
                        tab.id
                    );
                }
            );

            tabbar.insertBefore(
                tabElement,
                addTabBtn
            );

        }
    );
}


/* =========================================================
   OPEN SCRIPT
========================================================= */

function openScript(scriptId, options) {

    options = options || {};

    const script =
        getScript(scriptId);

    if (!script) {

        showToast(
            "Script could not be found."
        );

        return;
    }

    if (
        options.unhide &&
        script.original
    ) {
        script.sidebarHidden = false;
    }

    let existingTab =
        state.openTabs.find(
            function (tab) {
                return tab.scriptId === scriptId;
            }
        );

    if (!existingTab) {

        existingTab = {
            id: makeId("tab"),
            scriptId: scriptId,
            originalContent: script.content,
            content: script.content,
            dirty: false
        };

        state.openTabs.push(
            existingTab
        );
    }

    state.activeTabId =
        existingTab.id;

    saveState();
    renderTabs();
    renderScriptList();
    loadActiveEditor();
}

/* =========================================================
   ACTIVATE TAB
========================================================= */

function activateTab(tabId) {

    const tab =
        getTab(tabId);

    if (!tab) {
        return;
    }

    state.activeTabId =
        tabId;

    renderTabs();

    renderScriptList();

    loadActiveEditor();

    saveState();
}


/* =========================================================
   CLOSE TAB
========================================================= */

function closeTab(tabId) {

    const tab =
        getTab(tabId);

    if (!tab) {
        return;
    }

    /*
     * Closing a top tab should behave the same
     * as closing the script from the sidebar.
     *
     * This keeps both sides synchronized.
     */
    closeSidebarScript(
        tab.scriptId
    );
}
/* =========================================================
   LOAD ACTIVE EDITOR
========================================================= */

function loadActiveEditor() {

    const tab =
        getActiveTab();

    if (!tab) {

        editor.value = "";

        editor.readOnly = true;

        lineNumbers.textContent =
            "1";

        statusText.textContent =
            "No script open";

        dirtyText.textContent =
            "";

        positionText.textContent =
            "Ln 1, Col 1";

        updateReplaceControls();

        return;
    }

    const script =
        getScript(tab.scriptId);

    if (!script) {
        return;
    }

    editor.value =
        tab.content;

    /*
     * Original M365Buddy scripts are read-only.
     * Personal copies/custom scripts are editable.
     */

    editor.readOnly =
        !!script.original;

    updateLineNumbers();

    updateStatus();

    updateEditorStyle();
    updateReplaceControls();

    editor.focus();

    editor.setSelectionRange(
        0,
        0
    );
}


/* =========================================================
   SAVE CURRENT EDITOR CONTENT
========================================================= */

function syncEditorToState() {

    const tab =
        getActiveTab();

    if (!tab) {
        return;
    }

    tab.content =
        editor.value;

    tab.dirty =
        tab.content !==
        tab.originalContent;
}


/* =========================================================
   SAVE BUTTON
========================================================= */

function saveCurrent() {

    const tab =
        getActiveTab();

    if (!tab) {

        showToast(
            "No editor tab is open."
        );

        return;
    }

    if (editor.readOnly) {

        showToast(
            "Original M365Buddy scripts are read-only. Create a copy to edit."
        );

        return;
    }

    syncEditorToState();

    const script =
        getScript(tab.scriptId);

    if (script) {

        script.content =
            tab.content;
    }

    tab.originalContent =
        tab.content;

    tab.dirty = false;

    saveState();

    updateStatus();

    showToast(
        "Script saved."
    );
}


/* =========================================================
   CREATE EDITABLE COPY
========================================================= */
function getNextCopyName(originalScript) {

    const baseName = originalScript.name;

    let candidate = baseName + " (Editable)";

    let counter = 2;

    while (
        state.scripts.some(
            function (script) {
                return script.name === candidate;
            }
        )
    ) {

        candidate =
            baseName +
            " (Editable " +
            counter +
            ")";

        counter++;
    }

    return candidate;
}

/* =========================================================
   CREATE PERSONAL SCRIPT
========================================================= */

function createPersonalScript(
    name,
    content,
    originalId
) {

    let finalName =
        name.trim();

    if (!finalName) {
        finalName = "New Script";
    }

    /*
     * Avoid duplicate names.
     */

    let candidate =
        finalName;

    let counter = 2;

    while (
        state.scripts.some(
            function (script) {
                return script.name === candidate;
            }
        )
    ) {

        candidate =
            finalName +
            " " +
            counter;

        counter++;
    }

    const script = {

        id:
            makeId("script"),

        name:
            candidate,

        description:
            originalId
                ? "Editable copy"
                : "Custom script",

        content:
            content || "",

        original:
            false,

        originalId:
            originalId || null,

        sidebarHidden:
            false
    };

    state.scripts.push(
        script
    );

    /*
     * Open it immediately as a
     * completely separate editor tab.
     */

    openScript(
        script.id
    );

    saveState();

    renderScriptList();

    renderTabs();

    loadActiveEditor();

    showToast(
        candidate + " opened."
    );
}

    modalTitle.textContent =
        "Choose an M365Buddy Script";

    const scripts =
        ORIGINAL_SCRIPTS;

    modalBody.innerHTML =

        scripts.map(
            function (script) {

                return `

                    <div
                        class="option"
                        data-original-script="${escapeHtml(script.id)}">

                        <div class="option-icon">
                            📜
                        </div>

                        <div>

                            <div class="option-title">
                                ${escapeHtml(script.name)}
                            </div>

                            <div class="option-desc">
                                ${escapeHtml(script.description || "")}
                            </div>

                        </div>

                    </div>
                `;
            }
        ).join("");

    modalFoot.innerHTML = `

        <button
            type="button"
            class="btn"
            id="modalBack">
            Back
        </button>

        <button
            type="button"
            class="btn"
            id="modalCancel">
            Cancel
        </button>
    `;

    document
        .querySelectorAll(
            "[data-original-script]"
        )
        .forEach(
            function (option) {

                option.addEventListener(
                    "click",
                    function () {

                        const id =
                            option.dataset.originalScript;

                        const source =
                            getScript(id);

                        if (!source) {
                            return;
                        }

                        /*
                         * Selecting an existing M365Buddy
                         * script creates an editable copy
                         * instead of modifying the original.
                         */

                        const copyName =
                            getNextCopyName(
                                source
                            );

                        createPersonalScript(
                            copyName,
                            source.content,
                            source.id
                        );

                        closeModal();

                    }
                );

            }
        );

    document
        .getElementById("modalBack")
        .addEventListener(
            "click",
            openCreateModal
        );

    document
        .getElementById("modalCancel")
        .addEventListener(
            "click",
            closeModal
        );

/* =========================================================
   UPDATE LINE NUMBERS
========================================================= */

function updateLineNumbers() {

    const lineCount =
        editor.value.split("\n").length;

    let numbers = "";

    for (
        let i = 1;
        i <= lineCount;
        i++
    ) {

        numbers +=
            i +
            (
                i < lineCount
                    ? "\n"
                    : ""
            );
    }

    lineNumbers.textContent =
        numbers;
}

   KEEP LINE NUMBERS ALIGNED

function syncScroll() {

    lineNumbers.scrollTop =
        editor.scrollTop;

/* =========================================================
   POSITION
========================================================= */

function updatePosition() {

    const position =
        editor.selectionStart;

    const before =
        editor.value.slice(
            0,
            position

    const lines =
        before.split("\n");

    const line =
        lines.length;

    const col =
        lines[
            lines.length - 1
        ].length + 1;

    positionText.textContent =
        "Ln " +
        line +
        ", Col " +
        col;

/* =========================================================
   COPY TO CLIPBOARD
========================================================= */

async function copyToClipboard() {

    const tab =
        getActiveTab();

    if (!tab) {

        showToast(
            "No script is open."
        );

        return;
    }

    try {

        await navigator.clipboard.writeText(
            editor.value
        );

        showToast(
            "Script copied to clipboard."
        );

    } catch (error) {

        /*
         * Fallback for browsers where Clipboard API
         * is unavailable.
         */

        editor.focus();

        editor.select();

        document.execCommand(
            "copy"
        );

        editor.setSelectionRange(
            0,
            0
        );

        showToast(
            "Script copied to clipboard."
        );
    }
}

async function pasteFromClipboard() {

    const tab =
        getActiveTab();

    if (!tab) {

        showToast(
            "No script is open."
        );

        return;
    }

    const script =
        getScript(tab.scriptId);

    if (!script) {
        return;
    }

    if (script.original) {

        showToast(
            "Original M365Buddy scripts are read-only."
        );

        return;
    }

    try {

        const clipboardText =
            await navigator.clipboard.readText();

        if (!clipboardText) {

            showToast(
                "Clipboard is empty."
            );

            return;
        }

        const start =
            editor.selectionStart;

        const end =
            editor.selectionEnd;

        const currentText =
            editor.value;

        editor.value =
            currentText.substring(
                0,
                start
            ) +
            clipboardText +
            currentText.substring(
                end
            );

        /*
         * Move cursor to the end of
         * the pasted content.
         */
        const newPosition =
            start +
            clipboardText.length;

        editor.setSelectionRange(
            newPosition,
            newPosition
        );

        syncEditorToState();

        updateLineNumbers();

        updatePosition();

        updateStatus();

        saveState();

        editor.focus();

        showToast(
            "Pasted from clipboard."
        );

    } catch (error) {

        console.error(
            "Clipboard paste failed:",
            error
        );

        showToast(
            "Clipboard access was blocked. Please allow clipboard permission for this site."
        );
    }
}

    

/* =========================================================
   DOWNLOAD
========================================================= */

function downloadCurrent() {

    const tab =
        getActiveTab();

    if (!tab) {

        showToast(
            "No script is open."
        );

        return;
    }

    const script =
        getScript(tab.scriptId);

    if (!script) {
        return;
    }

    const blob =
        new Blob(
            [
                editor.value
            ],
            {
                type:
                    "text/plain;charset=utf-8"
            }
        );

    const url =
        URL.createObjectURL(
            blob
        );

    const anchor =
        document.createElement(
            "a"
        );

    anchor.href =
        url;

    anchor.download =
        sanitizeFileName(
            script.name
        ) +
        ".ps1";

    document.body.appendChild(
        anchor
    );

    anchor.click();

    anchor.remove();

    URL.revokeObjectURL(
        url
    );

    showToast(
        "PowerShell script downloaded."
    );
}


/* =========================================================
   FILE NAME
========================================================= */

function sanitizeFileName(name) {

    return name
        .replace(
            /[<>:"/\\|?*]/g,
            "_"
        )
        .trim() ||
        "script";
}

/* =========================================================
   SEARCH + REPLACE
========================================================= */

function getSearchMatches() {

    const term =
        findInput.value;

    if (!term) {

        findCount.textContent =
            "";

        return [];
    }

    const text =
        editor.value;

    const matches = [];
    const lowerText = text.toLowerCase();
    const lowerTerm = term.toLowerCase();

    let index = 0;

    while (true) {

        const found =
            lowerText.indexOf(
                lowerTerm,
                index
            );

        if (found === -1) {
            break;
        }

        matches.push(found);

        index =
            found +
            term.length;
    }

    findCount.textContent =
        matches.length
            ? matches.length +
              " match" +
              (matches.length === 1 ? "" : "es")
            : "No matches";

    return matches;
}


function updateReplaceControls() {

    const disabled =
        editor.readOnly ||
        !findInput.value;

    replaceBtn.disabled = disabled;
    replaceAllBtn.disabled = disabled;
}


function scrollEditorToMatch(start) {

    if (start < 0) {
        return;
    }

    /*
     * A textarea does not expose individual line elements, so calculate
     * the matching line from the character offset and move the editor
     * viewport explicitly. This keeps Find/Up/Down useful even when the
     * browser does not automatically scroll a textarea selection.
     */
    const beforeMatch =
        editor.value.slice(0, start);

    const lineNumber =
        beforeMatch.split("\n").length - 1;

    const computed =
        window.getComputedStyle(editor);

    let lineHeight =
        parseFloat(computed.lineHeight);

    if (!lineHeight || Number.isNaN(lineHeight)) {
        lineHeight = 20;
    }

    const targetTop =
        Math.max(
            0,
            lineNumber * lineHeight -
            (editor.clientHeight / 2) +
            lineHeight
        );

    editor.scrollTop = targetTop;
}


function selectAndShowMatch(start) {

    if (start < 0) {
        return;
    }

    const length =
        findInput.value.length;

    editor.focus();

    editor.setSelectionRange(
        start,
        start + length
    );

    scrollEditorToMatch(start);
    updatePosition();
    updateReplaceControls();
}


function findNext() {

    const matches =
        getSearchMatches();

    if (!matches.length) {
        updateReplaceControls();
        return;
    }

    if (
        currentSearchIndex >=
        matches.length
    ) {
        currentSearchIndex = 0;
    }

    const start =
        matches[currentSearchIndex];

    selectAndShowMatch(start);

    currentSearchIndex++;
}


function findPrevious() {

    const matches =
        getSearchMatches();

    if (!matches.length) {
        updateReplaceControls();
        return;
    }

    currentSearchIndex--;

    if (currentSearchIndex < 0) {
        currentSearchIndex =
            matches.length - 1;
    }

    const start =
        matches[currentSearchIndex];

    selectAndShowMatch(start);
}


function findFirst() {

    currentSearchIndex = 0;

    const matches =
        getSearchMatches();

    if (!matches.length) {
        updateReplaceControls();
        return;
    }

    selectAndShowMatch(matches[0]);
    currentSearchIndex = 1;
}


function getCurrentMatchStart(matches) {

    const term =
        findInput.value;

    if (!term || !matches.length) {
        return -1;
    }

    const selectedText =
        editor.value.slice(
            editor.selectionStart,
            editor.selectionEnd
        );

    if (
        selectedText.toLowerCase() ===
        term.toLowerCase() &&
        editor.selectionEnd > editor.selectionStart
    ) {
        return editor.selectionStart;
    }

    let index =
        currentSearchIndex - 1;

    if (index < 0) {
        index = matches.length - 1;
    }

    if (index >= matches.length) {
        index = 0;
    }

    return matches[index];
}


function replaceCurrent() {

    if (editor.readOnly) {

        showToast(
            "Original M365Buddy scripts are read-only. Create a copy to edit."
        );

        return;
    }

    const term =
        findInput.value;

    if (!term) {
        showToast("Enter text in Find first.");
        return;
    }

    const matches =
        getSearchMatches();

    if (!matches.length) {
        return;
    }

    const start =
        getCurrentMatchStart(matches);

    if (start < 0) {
        return;
    }

    const replacement =
        replaceInput.value;

    editor.setRangeText(
        replacement,
        start,
        start + term.length,
        "select"
    );

    syncEditorToState();
    updateLineNumbers();
    updateStatus();
    saveState();

    /* Move to the next occurrence after the replacement. */
    const updatedMatches =
        getSearchMatches();

    if (updatedMatches.length) {

        const next =
            updatedMatches.findIndex(
                function (value) {
                    return value >= start + replacement.length;
                }
            );

        currentSearchIndex =
            next === -1 ? 0 : next;

        findNext();

    } else {

        currentSearchIndex = 0;
        findCount.textContent = "No matches";
        updateReplaceControls();
        editor.focus();
    }

    showToast("1 occurrence replaced.");
}


function replaceAllMatches() {

    if (editor.readOnly) {

        showToast(
            "Original M365Buddy scripts are read-only. Create a copy to edit."
        );

        return;
    }

    const term =
        findInput.value;

    if (!term) {
        showToast("Enter text in Find first.");
        return;
    }

    const matches =
        getSearchMatches();

    if (!matches.length) {
        return;
    }

    const replacement =
        replaceInput.value;

    const escaped =
        term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

    const regex =
        new RegExp(escaped, "gi");

    const count =
        matches.length;

    editor.value =
        editor.value.replace(
            regex,
            replacement
        );

    syncEditorToState();
    updateLineNumbers();
    updateStatus();
    saveState();

    currentSearchIndex = 0;
    getSearchMatches();
    updateReplaceControls();
    editor.focus();

    showToast(
        count +
        " occurrence" +
        (count === 1 ? "" : "s") +
        " replaced."
    );
}


findInput.addEventListener(
    "input",
    function () {

        currentSearchIndex = 0;

        getSearchMatches();
        updateReplaceControls();
    }
);

replaceInput.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Enter") {

            event.preventDefault();
            replaceCurrent();
        }
    }
);

replaceBtn.addEventListener(
    "click",
    replaceCurrent
);

replaceAllBtn.addEventListener(
    "click",
    replaceAllMatches
);


/*
 * The Find box selects the current match in the textarea so the
 * user can see exactly which occurrence is active. Prevent Enter
 * in the editor from replacing that selected match with a newline.
 * Enter therefore continues to mean "next match" after Find has
 * moved focus into the editor.
 */
editor.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key !== "Enter" ||
            !findInput.value
        ) {
            return;
        }

        const selected =
            editor.value.slice(
                editor.selectionStart,
                editor.selectionEnd
            );

        if (
            selected &&
            selected.toLowerCase() ===
                findInput.value.toLowerCase()
        ) {

            event.preventDefault();

            if (event.shiftKey) {
                findPrevious();
            } else {
                findNext();
            }
        }
    }
);

    .addEventListener(
        "click",
        function () {

            state.theme =
                state.theme === "light"
                    ? "dark"
                    : "light";

            applyTheme();

            saveState();
        }
    );


sideSearch.addEventListener(
    "input",
    renderScriptList
);



document
    .getElementById("modalClose")
    .addEventListener(
        "click",
        closeModal
    );


modalBackdrop.addEventListener(
    "click",
    function (event) {

        if (
            event.target ===
            modalBackdrop
        ) {

            closeModal();
        }
    }
);


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
    "keydown",
    function (event) {

        /*
         * Ctrl + S
         */

        if (
            event.ctrlKey &&
            event.key.toLowerCase() === "s"
        ) {

            event.preventDefault();

            saveCurrent();

            return;
        }

        /*
         * Ctrl + F
         */

        if (
            event.ctrlKey &&
            event.key.toLowerCase() === "f"
        ) {

            event.preventDefault();

            findInput.focus();

            findInput.select();

            return;
        }

        /*
         * Escape closes the modal.
         */

        if (
            event.key === "Escape"
        ) {

            if (
                modalBackdrop.classList.contains(
                    "show"
                )
            ) {

                closeModal();
            }
        }

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

loadState();

document.getElementById(
    "fontSelect"
).value =
    state.font;

document.getElementById(
    "fontSizeSelect"
).value =
    state.fontSize;

applyTheme();

const requestedScript =
    new URLSearchParams(
        window.location.search
    ).get("script");

if (requestedScript) {

    const requested =
        getScript(requestedScript);

    if (requested) {
        openScript(
            requestedScript,
            { unhide: true }
        );
    } else {
        renderScriptList();
        renderTabs();
        loadActiveEditor();
    }

} else if (isFirstRun) {

    /* First visit only: open the first published script. */
    openScript(
        ORIGINAL_SCRIPTS[0].id
    );

} else {

    renderScriptList();
    renderTabs();
    loadActiveEditor();
}

updateLineNumbers();
updatePosition();

})();

</script>

</body>
</html>
