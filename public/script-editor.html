<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M365Buddy Script Workspace</title>

<link rel="icon" type="image/svg+xml" href="favicon.svg">

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #f5f7fb;
    --panel: #ffffff;
    --panel-soft: #f8fafc;
    --border: #d9dee8;
    --text: #172033;
    --muted: #647084;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --danger: #dc2626;
    --editor-bg: #ffffff;
    --editor-text: #172033;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

/* =========================================================
   MAIN APPLICATION
========================================================= */

.app {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
}

/* =========================================================
   TOP HEADER
========================================================= */

.topbar {
    height: 58px;
    min-height: 58px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 12px;
}

.brand {
    font-size: 18px;
    font-weight: 800;
    white-space: nowrap;
}

.brand span {
    color: var(--accent);
}

.top-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
}

/* =========================================================
   BUTTONS
========================================================= */

.btn {
    border: 1px solid var(--border);
    background: #ffffff;
    color: var(--text);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
}

.btn:hover {
    background: #f1f5f9;
}

.btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
}

.btn.primary:hover {
    background: var(--accent-hover);
}

.btn.danger {
    color: var(--danger);
}

.btn.danger:hover {
    background: #fef2f2;
}

/* =========================================================
   BODY
========================================================= */

.body {
    flex: 1;
    min-height: 0;
    display: flex;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    width: 285px;
    min-width: 285px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
}

.side-head {
    padding: 16px;
    border-bottom: 1px solid var(--border);
}

.side-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 10px;
}

.side-search {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
}

.side-search:focus {
    border-color: var(--accent);
}

.script-list {
    padding: 10px;
    overflow-y: auto;
    flex: 1;
}

.script-item {
    padding: 11px 12px;
    border-radius: 8px;
    margin-bottom: 5px;
    cursor: pointer;
    border: 1px solid transparent;
}

.script-item {
    position: relative;
    padding-right: 38px;
}

.script-close {
    position: absolute;
    right: 7px;
    top: 50%;
    transform: translateY(-50%);
    width: 24px;
    height: 24px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: #94a3b8;
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: .65;
    cursor: pointer;
}

.script-close:hover {
    background: #fee2e2;
    color: #dc2626;
    opacity: 1;
}

body.dark .script-close:hover {
    background: #3f1d1d;
    color: #f87171;
}

.script-item:hover {
    background: #f1f5f9;
}

.script-item.active {
    background: #eff6ff;
    border-color: #bfdbfe;
    color: #1d4ed8;
}

.script-name {
    font-size: 13px;
    font-weight: 600;
}

.script-meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
}

.side-bottom {
    padding: 12px;
    border-top: 1px solid var(--border);
}

.side-bottom .btn {
    width: 100%;
}

/* =========================================================
   WORKSPACE
========================================================= */

.workspace {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

/* =========================================================
   EDITOR TABS
========================================================= */

.tabbar {
    height: 46px;
    min-height: 46px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    overflow-x: auto;
}

.tab {
    height: 35px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 9px 0 12px;
    border: 1px solid transparent;
    border-radius: 7px 7px 0 0;
    background: #f1f5f9;
    white-space: nowrap;
    max-width: 240px;
    flex-shrink: 0;
}

.tab.active {
    background: #ffffff;
    border-color: var(--border);
    border-bottom-color: #ffffff;
    margin-bottom: -6px;
}

.tab-label {
    overflow: hidden;
    text-overflow: ellipsis;
}

.tab-close {
    border: 0;
    background: transparent;
    color: #647084;
    font-size: 16px;
    width: 20px;
    height: 20px;
    border-radius: 4px;
    padding: 0;
    line-height: 18px;
}

.tab-close:hover {
    background: #e2e8f0;
    color: #111827;
}

/* PLUS BUTTON IS DIRECTLY NEXT TO TABS */

.add-tab {
    flex: 0 0 35px;
    width: 35px;
    height: 35px;
    border: 1px dashed #94a3b8;
    background: #ffffff;
    border-radius: 8px;
    font-size: 21px;
    color: #475569;
    line-height: 30px;
    margin-left: 2px;
}

.add-tab:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: #eff6ff;
}

/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {
    min-height: 50px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 10px;
    flex-wrap: wrap;
}

.toolbar .separator {
    height: 25px;
    width: 1px;
    background: var(--border);
    margin: 0 2px;
}

.toolbar input,
.toolbar select {
    height: 34px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #ffffff;
    padding: 0 8px;
}

.toolbar input {
    width: 220px;
}

.toolbar .spacer {
    flex: 1;
}

/* =========================================================
   EDITOR
========================================================= */

.editor-wrap {
    flex: 1;
    min-height: 0;
    padding: 10px;
    background: #eef2f7;
    display: flex;
}

.editor-card {
    flex: 1;
    min-width: 0;
    min-height: 0;
    background: var(--editor-bg);
    border: 1px solid var(--border);
    border-radius: 9px;
    display: flex;
    overflow: hidden;
}

.line-numbers {
    width: 52px;
    min-width: 52px;
    background: #f8fafc;
    border-right: 1px solid #e2e8f0;
    color: #94a3b8;
    text-align: right;
    padding: 14px 9px 14px 0;
    font: 13px/20px Consolas, "Courier New", monospace;
    overflow: hidden;
    user-select: none;
    white-space: pre;
}

.editor {
    flex: 1;
    min-width: 0;
    min-height: 0;
    resize: none;
    border: 0;
    outline: 0;
    padding: 14px 16px;
    font: 13px/20px Consolas, "Courier New", monospace;
    color: var(--editor-text);
    background: var(--editor-bg);
    white-space: pre;
    overflow: auto;
    tab-size: 4;
}

.editor:focus {
    box-shadow: inset 0 0 0 2px rgba(37, 99, 235, 0.12);
}

.editor[readonly] {
    background: #fbfcfe;
}

/* =========================================================
   STATUS BAR
========================================================= */

.statusbar {
    height: 28px;
    min-height: 28px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-size: 11px;
    color: var(--muted);
    gap: 15px;
}

.statusbar .right {
    margin-left: auto;
}

/* =========================================================
   MODAL
========================================================= */

.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.38);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.modal-backdrop.show {
    display: flex;
}

.modal {
    width: min(520px, calc(100vw - 32px));
    background: #ffffff;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 25px 70px rgba(15, 23, 42, 0.25);
    overflow: hidden;
}

.modal-head {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
}

.modal-title {
    font-weight: 700;
}

.modal-x {
    margin-left: auto;
    border: 0;
    background: transparent;
    font-size: 22px;
    color: #647084;
    cursor: pointer;
}

.modal-body {
    padding: 18px;
}

.modal-foot {
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

.option {
    display: flex;
    gap: 12px;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 9px;
    margin-bottom: 10px;
    cursor: pointer;
}

.option:hover {
    border-color: #93c5fd;
    background: #f8fbff;
}

.option-icon {
    font-size: 20px;
}

.option-title {
    font-weight: 650;
    font-size: 14px;
}

.option-desc {
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
}

.modal-input {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: 0;
}

.modal-input:focus {
    border-color: var(--accent);
}

/* =========================================================
   TOAST
========================================================= */

.toast {
    position: fixed;
    right: 18px;
    bottom: 42px;
    background: #172033;
    color: #ffffff;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    box-shadow: 0 8px 25px rgba(15, 23, 42, 0.15);
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: 0.2s;
    z-index: 2000;
}

.toast.show {
    opacity: 1;
    transform: translateY(0);
}

/* =========================================================
   DARK THEME
========================================================= */

body.dark {
    --bg: #111827;
    --panel: #172033;
    --panel-soft: #1e293b;
    --border: #334155;
    --text: #e5e7eb;
    --muted: #94a3b8;
    --editor-bg: #0f172a;
    --editor-text: #e5e7eb;
}

body.dark .btn,
body.dark .add-tab,
body.dark .toolbar input,
body.dark .toolbar select,
body.dark .side-search {
    background: #1e293b;
    color: #e5e7eb;
}

body.dark .script-item:hover,
body.dark .tab {
    background: #1e293b;
}

body.dark .tab.active {
    background: #172033;
    border-bottom-color: #172033;
}

body.dark .editor {
    background: #0f172a;
    color: #e5e7eb;
}

body.dark .line-numbers {
    background: #111827;
    color: #64748b;
    border-color: #334155;
}

body.dark .editor-wrap {
    background: #0b1220;
}

body.dark .editor[readonly] {
    background: #111827;
}

body.dark .modal {
    background: #172033;
}

body.dark .modal-foot,
body.dark .modal-head {
    border-color: #334155;
}

body.dark .option:hover {
    background: #1e293b;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 900px) {

    .sidebar {
        width: 230px;
        min-width: 230px;
    }

    .toolbar input {
        width: 150px;
    }
}

@media (max-width: 700px) {

    .sidebar {
        display: none;
    }

    .brand {
        font-size: 15px;
    }

    .top-actions .btn:first-child {
        display: none;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="topbar">

        <div class="brand" id="brandHome" title="Back to M365Buddy home">
            M365<span>Buddy</span> Script Workspace
        </div>

        <div class="top-actions">

            <button
                type="button"
                class="btn"
                id="homeBtn">
                Back to Home
            </button>

            <button
                type="button"
                class="btn primary"
                id="newScriptBtn">
                ＋ Add New Script
            </button>

        </div>

    </header>


    <!-- =====================================================
         BODY
    ====================================================== -->

    <div class="body">

        <!-- =================================================
             SIDEBAR
        ================================================== -->

        <aside class="sidebar">

            <div class="side-head">

                <div class="side-title">
                    M365Buddy Scripts
                </div>

                <input
                    type="text"
                    id="sideSearch"
                    class="side-search"
                    placeholder="Search scripts...">

            </div>

            <div
                class="script-list"
                id="scriptList">
            </div>

            <div class="side-bottom">

                <button
                    type="button"
                    class="btn"
                    id="refreshBtn">
                    ↻ Refresh List
                </button>

            </div>

        </aside>


        <!-- =================================================
             WORKSPACE
        ================================================== -->

        <main class="workspace">

            <!-- =================================================
                 EDITOR TABS

                 IMPORTANT:
                 PLUS BUTTON IS HERE, DIRECTLY NEXT TO TABS.
            ================================================== -->

            <div
                class="tabbar"
                id="tabbar">

                <button
                    type="button"
                    class="add-tab"
                    id="addTabBtn"

                    +
                </button>

            </div>


            <!-- =================================================
                 TOOLBAR
            ================================================== -->

            <div class="toolbar">

                <button
                    type="button"

                    id="saveBtn">

                </button>

                <button
                    type="button"
                    class="btn"
                    id="copyBtn">
                    Copy
                </button>

                <button
                    type="button"
                    class="btn"
                    id="downloadBtn">
                    Download
                </button>

                <button
                    type="button"
                    class="btn"
                    id="renameBtn">
                    Rename
                </button>

                <button
                    type="button"

                    autocomplete="off">

                <button

                <button

                </span>

                <select id="fontSelect">

                    <option value="Courier New">Courier New</option>
                    <option value="monospace">Monospace</option>
                </select>

                <select id="fontSizeSelect">
                    <option value="12">12</option>
                    <option value="13" selected>13</option>
                    <option value="14">14</option>
                    <option value="15">15</option>
                    <option value="16">16</option>
                </select>

                <button
                    type="button"
                    class="btn"
                    id="themeBtn">
                    Dark
                </button>

            </div>


            <!-- =================================================
                 EDITOR
            ================================================== -->

            <div class="editor-wrap">

                <div class="editor-card">

                    <div
                        class="line-numbers"
                        id="lineNumbers">
                        1
                    </div>

                    <textarea
                        id="editor"
                        class="editor"
                        spellcheck="false"
                        wrap="off"></textarea>

                </div>

            </div>


            <!-- =================================================
                 STATUS BAR
            ================================================== -->

            <div class="statusbar">

                <span id="statusText">
                    Ready
                </span>

                <span id="dirtyText">
                </span>

                <span
                    class="right"
                    id="positionText">
                    Ln 1, Col 1
                </span>

            </div>

        </main>

    </div>

</div>


<!-- =========================================================
     SITE NATIVE MODAL
========================================================= -->

<div
    class="modal-backdrop"
    id="modalBackdrop">

    <div
        class="modal"
        role="dialog"
        aria-modal="true">

        <div class="modal-head">

            <div
                class="modal-title"
                id="modalTitle">
                Create New Script
            </div>

            <button
                type="button"
                class="modal-x"
                id="modalClose">
                ×
            </button>

        </div>

        <div
            class="modal-body"
            id="modalBody">
        </div>

        <div
            class="modal-foot"
            id="modalFoot">
        </div>

    </div>

</div>


<div
    class="toast"
    id="toast">
</div>


<script>
(function () {
"use strict";

const STORAGE_KEY = "m365buddy_script_workspace_functional_v2";

const ORIGINAL_SCRIPTS = [

    {
        id: "spo-site-inventory",

        name: "SharePoint Online - Get All Sites",

        description: "PnP PowerShell site inventory example",

        content:
`# ============================================================
# M365Buddy - SharePoint Online Site Inventory
# ============================================================

# IMPORTANT:
# Replace the placeholder values before running.
#
# Do NOT publish:
# - Client secrets
# - PFX passwords
# - Private keys
# - Internal SMTP credentials
# - Tenant-specific confidential information


$TenantName = "YOUR-TENANT"

$TenantAdminUrl =
    "https://YOUR-TENANT-admin.sharepoint.com"

$ClientId =
    "YOUR-APP-CLIENT-ID"

$CertificatePath =
    "C:\\Path\\To\\SharePointAutomationCert.pfx"

$CertificatePassword =
    "YOUR-PFX-PASSWORD"


$OutputCsv =
    Join-Path $env:USERPROFILE \`
    "Desktop\\SharePoint-Site-Inventory.csv"


# ============================================================
# CONNECT
# ============================================================

Connect-PnPOnline \`
    -Url $TenantAdminUrl \`
    -ClientId $ClientId \`
    -CertificatePath $CertificatePath \`
    -CertificatePassword $CertificatePassword


# ============================================================
# GET SITES
# ============================================================

$Sites =
    Get-PnPTenantSite -Detailed


# ============================================================
# BUILD REPORT
# ============================================================

$Report = foreach ($Site in $Sites) {

    [PSCustomObject]@{

        SiteName =
            $Site.Title

        SiteUrl =
            $Site.Url

        StorageMB =
            [math]::Round(
                $Site.StorageUsageCurrent,
                2
            )

        StorageQuotaMB =
            [math]::Round(
                $Site.StorageQuota,
                2
            )

        Template =
            $Site.Template

        Created =
            $Site.TimeCreated

        LastModified =
            $Site.LastContentModifiedDate
    }
}


# ============================================================
# EXPORT
# ============================================================

$Report |
    Sort-Object SiteName |
    Export-Csv \`
        -Path $OutputCsv \`
        -NoTypeInformation \`
        -Encoding UTF8


Write-Host ""
Write-Host "Report created:" -ForegroundColor Green
Write-Host $OutputCsv -ForegroundColor Cyan
`,

        original: true,
        readOnly: true

    }

];




/* =========================================================
   APPLICATION STATE
========================================================= */
let state = {
    theme: "light",
    font: "Consolas",
    fontSize: "13",
    scripts: [],
    tabs: [],
    activeTabId: null
};

let search = { term: "", matches: [], index: -1 };
let toastTimer = null;

const editor = document.getElementById("editor");
const lineNumbers = document.getElementById("lineNumbers");
const tabbar = document.getElementById("tabbar");
const addTabBtn = document.getElementById("addTabBtn");
const scriptList = document.getElementById("scriptList");
const sideSearch = document.getElementById("sideSearch");
const modalBackdrop = document.getElementById("modalBackdrop");
const modalTitle = document.getElementById("modalTitle");
const modalBody = document.getElementById("modalBody");
const modalFoot = document.getElementById("modalFoot");
const modalClose = document.getElementById("modalClose");
const toast = document.getElementById("toast");
const statusText = document.getElementById("statusText");
const dirtyText = document.getElementById("dirtyText");
const positionText = document.getElementById("positionText");
const findInput = document.getElementById("findInput");
const findCount = document.getElementById("findCount");

function generateId(prefix) {
    return prefix + "-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
}

function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function (c) {
        return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c];
    });
}

function showToast(message) {
    clearTimeout(toastTimer);
    toast.textContent = message;
    toast.classList.add("show");
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2200);
}

function setStatus(message) { statusText.textContent = message; }

/* =========================================================
   STORAGE + MIGRATION
========================================================= */
function loadState() {
    let saved = null;
    try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}

    if (saved) {
        try { state = Object.assign(state, JSON.parse(saved)); } catch (e) { console.warn("Workspace data could not be read.", e); }
    }

    /* Migrate older workspace keys if the new key is empty. */
    if (!saved) {
        try {
            const old = localStorage.getItem("m365buddy_script_workspace_functional_v1");
            if (old) state = Object.assign(state, JSON.parse(old));
        } catch (e) {}
    }

    if (!Array.isArray(state.scripts)) state.scripts = [];
    if (!Array.isArray(state.tabs)) state.tabs = [];
    if (!state.theme) state.theme = "light";
    if (!state.font) state.font = "Consolas";
    if (!state.fontSize) state.fontSize = "13";

    ORIGINAL_SCRIPTS.forEach(function (original) {
        let script = state.scripts.find(function (s) { return s.id === original.id; });
        if (!script) {
            state.scripts.push({
                id: original.id,
                name: original.name,
                description: original.description,
                content: original.content,
                original: true,
                readOnly: true,
                sidebarHidden: false
            });
        } else {
            script.original = true;
            script.readOnly = true;
            if (typeof script.sidebarHidden !== "boolean") script.sidebarHidden = false;
            /* Keep the published original content authoritative. */
            script.name = original.name;
            script.description = original.description;
            script.content = original.content;
        }
    });

    /* Remove broken tabs from older versions. */
    state.tabs = state.tabs.filter(function (tab) {
        return tab && tab.id && getScript(tab.scriptId);
    });
    if (!state.tabs.some(function (tab) { return tab.id === state.activeTabId; })) {
        state.activeTabId = state.tabs.length ? state.tabs[0].id : null;
    }

    saveState();
}

function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { console.warn("Workspace could not be saved.", e); }
}

function getScript(scriptId) {
    return state.scripts.find(function (script) { return script.id === scriptId; }) || null;
}

function getActiveTab() {
    return state.tabs.find(function (tab) { return tab.id === state.activeTabId; }) || null;
}

function getActiveScript() {
    const tab = getActiveTab();
    return tab ? getScript(tab.scriptId) : null;
}

/* =========================================================
   EDITOR
========================================================= */
function syncActiveContent() {
    const tab = getActiveTab();
    if (tab) tab.content = editor.value;
}

function setEditorContent(content) {
    editor.value = content || "";
    updateLineNumbers();
    updatePosition();
}

function loadActiveTab() {
    const tab = getActiveTab();
    const script = getActiveScript();

    if (!tab || !script) {
        setEditorContent("");
        editor.readOnly = false;
        dirtyText.textContent = "";
        setStatus("No editor tab open");
        updateLineNumbers();
        return;
    }

    editor.value = tab.content || "";
    editor.readOnly = !!script.readOnly;
    editor.scrollTop = 0;
    editor.scrollLeft = 0;
    editor.selectionStart = 0;
    editor.selectionEnd = 0;
    updateLineNumbers();
    updatePosition();
    clearSearch();
    setStatus(script.readOnly ? "Original M365Buddy script — Read Only" : "Ready to edit");
    dirtyText.textContent = tab.dirty ? "• Unsaved changes" : "Saved";
    applyTheme();
}

function updateLineNumbers() {
    const count = Math.max(1, editor.value.split("\n").length);
    let output = "";
    for (let i = 1; i <= count; i++) output += i + (i < count ? "\n" : "");
    lineNumbers.textContent = output;
    lineNumbers.scrollTop = editor.scrollTop;
}

function updatePosition() {
    const before = editor.value.slice(0, editor.selectionStart || 0).split("\n");
    positionText.textContent = "Ln " + before.length + ", Col " + (before[before.length - 1].length + 1);
}

function updateDirtyStatus() {
    const tab = getActiveTab();
    dirtyText.textContent = tab ? (tab.dirty ? "• Unsaved changes" : "Saved") : "";
}

/* =========================================================
   SIDEBAR
========================================================= */
function renderSidebar(filter) {
    const searchText = String(filter || "").trim().toLowerCase();
    scriptList.innerHTML = "";

    state.scripts
        .filter(function (script) {
            return !script.sidebarHidden && (script.original || !script.originalId);
        })
        .filter(function (script) {
            return !searchText || script.name.toLowerCase().includes(searchText) || String(script.description || "").toLowerCase().includes(searchText);
        })
        .forEach(function (script) {
            const item = document.createElement("div");
            item.className = "script-item";
            const active = getActiveTab();
            if (active && active.scriptId === script.id) item.classList.add("active");

            const info = document.createElement("div");
            info.innerHTML = '<div class="script-name">' + escapeHtml(script.name) + '</div>' +
                             '<div class="script-meta">' + escapeHtml(script.description || (script.original ? "M365Buddy script" : "Personal script")) + '</div>';

            const close = document.createElement("button");
            close.type = "button";
            close.className = "script-close";
            close.textContent = "×";
            close.title = "Close / remove from sidebar";
            close.setAttribute("aria-label", "Close " + script.name);
            close.addEventListener("click", function (event) {
                event.preventDefault();
                event.stopPropagation();
                closeSidebarScript(script.id);
            });

            item.appendChild(info);
            item.appendChild(close);
            item.addEventListener("click", function () { openScript(script.id); });
            scriptList.appendChild(item);
        });

    if (!scriptList.children.length) {
        const empty = document.createElement("div");
        empty.style.cssText = "padding:12px;color:#647084;font-size:12px;";
        empty.textContent = "No scripts found.";
        scriptList.appendChild(empty);
    }
}

function closeSidebarScript(scriptId) {
    const script = getScript(scriptId);
    if (!script) return;

    const tab = state.tabs.find(function (t) { return t.scriptId === scriptId; });
    if (tab) closeTab(tab.id, false);

    if (script.original) {
        script.sidebarHidden = true;
    } else {
        state.scripts = state.scripts.filter(function (s) { return s.id !== scriptId; });
        state.tabs = state.tabs.filter(function (t) { return t.scriptId !== scriptId; });
        if (!getActiveTab()) state.activeTabId = state.tabs.length ? state.tabs[state.tabs.length - 1].id : null;
    }

    saveState();
    renderTabs();
    renderSidebar(sideSearch.value);
    if (state.activeTabId) loadActiveTab(); else setEditorContent("");
    showToast(script.name + " closed.");
}

/* =========================================================
   TABS
========================================================= */
function renderTabs() {
    tabbar.querySelectorAll(".tab").forEach(function (tab) { tab.remove(); });
    state.tabs.forEach(function (tab) {
        const script = getScript(tab.scriptId);
        if (!script) return;

        const el = document.createElement("div");
        el.className = "tab" + (tab.id === state.activeTabId ? " active" : "");

        const label = document.createElement("span");
        label.className = "tab-label";
        label.textContent = (tab.dirty ? "● " : "") + script.name;

        const close = document.createElement("button");
        close.type = "button";
        close.className = "tab-close";
        close.textContent = "×";
        close.title = "Close editor tab";
        close.addEventListener("click", function (event) {
            event.stopPropagation();
            closeTab(tab.id);
        });

        el.appendChild(label);
        el.appendChild(close);
        el.addEventListener("click", function () { activateTab(tab.id); });
        tabbar.insertBefore(el, addTabBtn);
    });
}

function openScript(scriptId, options) {
    options = options || {};
    const script = getScript(scriptId);
    if (!script) {
        showToast("Script is not available.");
        return false;
    }

    syncActiveContent();
    let tab = state.tabs.find(function (t) { return t.scriptId === scriptId; });
    if (!tab) {
        tab = { id: generateId("tab"), scriptId: script.id, content: script.content || "", dirty: false };
        state.tabs.push(tab);
    }
    if (options.unhide) script.sidebarHidden = false;
    state.activeTabId = tab.id;
    saveState();
    renderTabs();
    renderSidebar(sideSearch.value);
    loadActiveTab();
    return true;
}

function activateTab(tabId) {
    if (!state.tabs.some(function (t) { return t.id === tabId; })) return;
    syncActiveContent();
    state.activeTabId = tabId;
    saveState();
    renderTabs();
    renderSidebar(sideSearch.value);
    loadActiveTab();
}

function closeTab(tabId, showMessage) {
    const index = state.tabs.findIndex(function (t) { return t.id === tabId; });
    if (index < 0) return;
    const wasActive = state.activeTabId === tabId;
    state.tabs.splice(index, 1);

    if (wasActive) {
        if (state.tabs.length) {
            const next = Math.min(index, state.tabs.length - 1);
            state.activeTabId = state.tabs[next].id;
        } else {
            state.activeTabId = null;
        }
    }

    saveState();
    renderTabs();
    renderSidebar(sideSearch.value);
    if (state.activeTabId) loadActiveTab(); else {
        setEditorContent("");
        dirtyText.textContent = "";
        setStatus("No editor tab open");
    }
    if (showMessage !== false) showToast("Editor tab closed.");
}

/* =========================================================
   SCRIPT CREATION / COPIES
========================================================= */
function createPersonalScript(name, content, originalId) {
    const script = {
        id: generateId("script"),
        name: name || "New Script",
        description: originalId ? "Editable copy" : "Custom script",
        content: content || "",
        original: false,
        readOnly: false,
        originalId: originalId || null,
        sidebarHidden: false
    };
    state.scripts.push(script);
    const tab = { id: generateId("tab"), scriptId: script.id, content: script.content, dirty: false };
    state.tabs.push(tab);
    state.activeTabId = tab.id;
    saveState();
    renderTabs();
    renderSidebar(sideSearch.value);
    loadActiveTab();
    return script;
}

function getNextCopyName(source) {
    const originalName = typeof source === "string" ? source : source.name;
    const base = originalName.replace(/\s+Copy(?:\s+\d+)?$/i, "").trim();
    const names = new Set(state.scripts.map(function (s) { return s.name.toLowerCase(); }));
    let name = base + " Copy";
    let n = 2;
    while (names.has(name.toLowerCase())) { name = base + " Copy " + n; n++; }
    return name;
}

function createCopy() {
    syncActiveContent();
    const current = getActiveScript();
    if (!current) { showToast("No script is open."); return; }
    const copy = createPersonalScript(getNextCopyName(current), editor.value, current.original ? current.id : current.originalId);
    showToast(copy.name + " opened in a new editor tab.");
}

/* =========================================================
   MODALS
========================================================= */
function showModal(title, body, footer) {
    modalTitle.textContent = title;
    modalBody.innerHTML = body;
    modalFoot.innerHTML = footer;
    modalBackdrop.classList.add("show");
}

function closeModal() { modalBackdrop.classList.remove("show"); }

function openCreateModal() {
    showModal(
        "Add New Script",
        '<div class="option" id="existingOption">' +
            '<div class="option-icon">📄</div><div><div class="option-title">Use an M365Buddy script</div>' +
            '<div class="option-desc">Create an editable copy of an existing M365Buddy script in a new editor tab.</div></div>' +
        '</div>' +
        '<div class="option" id="customOption">' +
            '<div class="option-icon">＋</div><div><div class="option-title">New Custom Script</div>' +
            '<div class="option-desc">Create a blank editor tab for a new PowerShell script.</div></div>' +
        '</div>',
        '<button type="button" class="btn" id="createCancel">Cancel</button>'
    );
    document.getElementById("existingOption").addEventListener("click", openExistingScripts);
    document.getElementById("customOption").addEventListener("click", openCustomScript);
    document.getElementById("createCancel").addEventListener("click", closeModal);
}

function openExistingScripts() {
    const originals = ORIGINAL_SCRIPTS.map(function (o) { return getScript(o.id); }).filter(Boolean);
    let body = "";
    originals.forEach(function (script) {
        body += '<div class="option existing-choice" data-id="' + escapeHtml(script.id) + '">' +
            '<div class="option-icon">📄</div><div><div class="option-title">' + escapeHtml(script.name) + '</div>' +
            '<div class="option-desc">' + escapeHtml(script.description || "M365Buddy script") + '</div></div></div>';
    });
    showModal(
        "Choose M365Buddy Script",
        body || '<div style="font-size:13px;color:#647084;">No M365Buddy scripts are currently available.</div>',
        '<button type="button" class="btn" id="existingBack">Back</button><button type="button" class="btn" id="existingCancel">Cancel</button>'
    );
    document.getElementById("existingBack").addEventListener("click", openCreateModal);
    document.getElementById("existingCancel").addEventListener("click", closeModal);
    document.querySelectorAll(".existing-choice").forEach(function (choice) {
        choice.addEventListener("click", function () {
            const source = getScript(choice.dataset.id);
            if (!source) { showToast("Script is not available."); return; }
            const copy = createPersonalScript(getNextCopyName(source), source.content, source.id);
            closeModal();
            showToast(copy.name + " opened in a new editor tab.");
            setTimeout(function () { editor.focus(); }, 30);
        });
    });
}

function openCustomScript() {
    showModal(
        "New Custom Script",
        '<label style="display:block;font-size:12px;font-weight:600;margin-bottom:6px;">Script name</label>' +
        '<input id="customScriptName" class="modal-input" value="New Script" autocomplete="off">' +
        '<div style="height:12px;"></div><div style="font-size:12px;color:#647084;line-height:1.5;">A blank editor tab will be created. You can type or paste your PowerShell script there.</div>',
        '<button type="button" class="btn" id="customBack">Back</button>' +
        '<button type="button" class="btn" id="customCancel">Cancel</button>' +
        '<button type="button" class="btn primary" id="customCreate">Create Editor Tab</button>'
    );
    const input = document.getElementById("customScriptName");
    input.focus();
    input.select();
    document.getElementById("customBack").addEventListener("click", openCreateModal);
    document.getElementById("customCancel").addEventListener("click", closeModal);
    document.getElementById("customCreate").addEventListener("click", function () {
        const name = input.value.trim() || "New Script";
        const script = createPersonalScript(name, "", null);
        closeModal();
        showToast(script.name + " opened in a new editor tab.");
        setTimeout(function () { editor.focus(); }, 30);
    });
    input.addEventListener("keydown", function (event) {
        if (event.key === "Enter") { event.preventDefault(); document.getElementById("customCreate").click(); }
    });
}

/* =========================================================
   SAVE / COPY / DOWNLOAD / RENAME / DELETE / RESET
========================================================= */
function saveCurrent() {
    syncActiveContent();
    const tab = getActiveTab();
    const script = getActiveScript();
    if (!tab || !script) { showToast("No script is open."); return; }
    if (script.readOnly) { showToast("Original script is read-only. Use Copy first."); return; }
    script.content = tab.content;
    tab.dirty = false;
    saveState();
    renderTabs();
    updateDirtyStatus();
    setStatus("Saved successfully");
    showToast("Script saved.");
}

function copyToClipboard() {
    syncActiveContent();
    if (!getActiveScript()) { showToast("No script is open."); return; }
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(editor.value).then(function () { showToast("Script copied to clipboard."); }, fallbackCopy);
    } else fallbackCopy();
}
function fallbackCopy() {
    editor.focus(); editor.select();
    try { document.execCommand("copy"); showToast("Script copied to clipboard."); }
    catch (e) { showToast("Copy failed. Please copy manually."); }
}

function downloadCurrent() {
    syncActiveContent();
    const script = getActiveScript();
    if (!script) { showToast("No script is open."); return; }
    const blob = new Blob([editor.value], {type:"text/plain;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = (script.name.replace(/[\\/:*?"<>|]/g, "_") || "script") + ".ps1";
    document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url);
    showToast("PowerShell script downloaded.");
}

function openRenameModal() {
    const script = getActiveScript();
    if (!script) { showToast("No script is open."); return; }
    if (script.original) { showToast("Original M365Buddy scripts cannot be renamed."); return; }
    showModal("Rename Script", '<input id="renameInput" class="modal-input" value="' + escapeHtml(script.name) + '" autocomplete="off">',
        '<button type="button" class="btn" id="renameCancel">Cancel</button><button type="button" class="btn primary" id="renameSave">Rename</button>');
    const input = document.getElementById("renameInput"); input.focus(); input.select();
    document.getElementById("renameCancel").addEventListener("click", closeModal);
    document.getElementById("renameSave").addEventListener("click", function () {
        const name = input.value.trim();
        if (!name) { showToast("Enter a script name."); return; }
        script.name = name; saveState(); renderTabs(); renderSidebar(sideSearch.value); closeModal(); showToast("Script renamed.");
    });
    input.addEventListener("keydown", function(e){ if(e.key === "Enter"){e.preventDefault();document.getElementById("renameSave").click();} });
}

function deleteCurrent() {
    const script = getActiveScript();
    if (!script) { showToast("No script is open."); return; }
    if (script.original) { showToast("Original M365Buddy scripts cannot be deleted. Use the sidebar × to hide one."); return; }
    showModal("Delete Script", '<div style="font-size:13px;line-height:1.5;">Delete <strong>' + escapeHtml(script.name) + '</strong> and close its editor tab?</div>',
        '<button type="button" class="btn" id="deleteCancel">Cancel</button><button type="button" class="btn danger" id="deleteConfirm">Delete</button>');
    document.getElementById("deleteCancel").addEventListener("click", closeModal);
    document.getElementById("deleteConfirm").addEventListener("click", function () {
        const id = script.id;
        state.scripts = state.scripts.filter(function(s){return s.id !== id;});
        state.tabs = state.tabs.filter(function(t){return t.scriptId !== id;});
        state.activeTabId = state.tabs.length ? state.tabs[state.tabs.length-1].id : null;
        saveState(); renderTabs(); renderSidebar(sideSearch.value); closeModal();
        if (state.activeTabId) loadActiveTab(); else { setEditorContent(""); setStatus("No editor tab open"); }
        showToast("Script deleted.");
    });
}

function resetCurrent() {
    const tab = getActiveTab(); const script = getActiveScript();
    if (!tab || !script) { showToast("No script is open."); return; }
    if (script.original) {
        tab.content = script.content; tab.dirty = false; saveState(); loadActiveTab(); showToast("Original script reloaded."); return;
    }
    showModal("Reset Script", '<div style="font-size:13px;line-height:1.5;">Reset this editor to the last saved version? Unsaved changes will be discarded.</div>',
        '<button type="button" class="btn" id="resetCancel">Cancel</button><button type="button" class="btn primary" id="resetConfirm">Reset</button>');
    document.getElementById("resetCancel").addEventListener("click", closeModal);
    document.getElementById("resetConfirm").addEventListener("click", function () {
        tab.content = script.content; tab.dirty = false; saveState(); closeModal(); loadActiveTab(); showToast("Unsaved changes discarded.");
    });
}

/* =========================================================
   SEARCH
========================================================= */
function getSearchMatches(term) {
    if (!term) return [];
    const text = editor.value.toLowerCase(); const needle = term.toLowerCase(); const matches = [];
    let pos = 0;
    while ((pos = text.indexOf(needle, pos)) !== -1) { matches.push(pos); pos += Math.max(1, needle.length); }
    return matches;
}
function updateSearch() {
    search.term = findInput.value; search.matches = getSearchMatches(search.term);
    if (!search.matches.length) { search.index = -1; findCount.textContent = search.term ? "0 matches" : ""; return; }
    if (search.index < 0 || search.index >= search.matches.length) search.index = 0;
    findCount.textContent = (search.index + 1) + " / " + search.matches.length;
}
function goToMatch(index) {
    updateSearch();
    if (!search.matches.length) { if (search.term) showToast("No matches found."); return; }
    search.index = (index + search.matches.length) % search.matches.length;
    const start = search.matches[search.index]; const end = start + search.term.length;
    editor.focus(); editor.setSelectionRange(start, end); findCount.textContent = (search.index + 1) + " / " + search.matches.length;
}
function findNext(){ goToMatch(search.index + 1); }
function findPrevious(){ goToMatch(search.index - 1); }
function clearSearch(){ search={term:"",matches:[],index:-1}; findInput.value=""; findCount.textContent=""; }

/* =========================================================
   THEME / FONT
========================================================= */
function updateEditorStyle() {
    editor.style.fontFamily = state.font;
    editor.style.fontSize = state.fontSize + "px";
    lineNumbers.style.fontFamily = state.font;
    lineNumbers.style.fontSize = state.fontSize + "px";
}
function applyTheme() {
    document.body.classList.toggle("dark", state.theme === "dark");
    const themeBtn = document.getElementById("themeBtn");
    themeBtn.textContent = state.theme === "light" ? "Dark" : "Light";
    updateEditorStyle();
}

/* =========================================================
   HOME
========================================================= */
function openHome() { window.location.href = "https://m365buddy.com/"; }

/* =========================================================
   EVENTS
========================================================= */
document.getElementById("newScriptBtn").addEventListener("click", openCreateModal);
addTabBtn.addEventListener("click", function(){ const script=createPersonalScript("New Script", "", null); showToast(script.name + " opened in a new editor tab."); setTimeout(function(){editor.focus();},30); });
document.getElementById("homeBtn").addEventListener("click", openHome);
document.getElementById("brandHome").addEventListener("click", openHome);
document.getElementById("saveBtn").addEventListener("click", saveCurrent);
document.getElementById("copyBtn").addEventListener("click", copyToClipboard);
document.getElementById("downloadBtn").addEventListener("click", downloadCurrent);
document.getElementById("renameBtn").addEventListener("click", openRenameModal);
document.getElementById("deleteBtn").addEventListener("click", deleteCurrent);
document.getElementById("resetBtn").addEventListener("click", resetCurrent);
sideSearch.addEventListener("input", function(){ renderSidebar(sideSearch.value); });
document.getElementById("refreshBtn").addEventListener("click", function(){ renderSidebar(sideSearch.value); renderTabs(); if(state.activeTabId) loadActiveTab(); showToast("Script list refreshed."); });
editor.addEventListener("input", function(){ syncActiveContent(); const tab=getActiveTab(); if(tab) tab.dirty=true; updateLineNumbers(); updatePosition(); updateSearch(); updateDirtyStatus(); renderTabs(); saveState(); });
editor.addEventListener("scroll", function(){ lineNumbers.scrollTop=editor.scrollTop; });
editor.addEventListener("click", updatePosition); editor.addEventListener("keyup", updatePosition); editor.addEventListener("select", updatePosition);
editor.addEventListener("keydown", function(event){
    if(event.key === "Tab"){
        event.preventDefault(); const start=editor.selectionStart, end=editor.selectionEnd;
        editor.setRangeText("    ", start, end, "end"); editor.dispatchEvent(new Event("input", {bubbles:true}));
    }
});
findInput.addEventListener("input", updateSearch);
findInput.addEventListener("keydown", function(event){ if(event.key === "Enter"){event.preventDefault(); event.shiftKey ? findPrevious() : findNext();} if(event.key === "Escape") clearSearch(); });
document.getElementById("findPrevBtn").addEventListener("click", findPrevious);
document.getElementById("findNextBtn").addEventListener("click", findNext);
document.getElementById("fontSelect").addEventListener("change", function(e){state.font=e.target.value;saveState();applyTheme();});
document.getElementById("fontSizeSelect").addEventListener("change", function(e){state.fontSize=e.target.value;saveState();applyTheme();updateLineNumbers();});
document.getElementById("themeBtn").addEventListener("click", function(){state.theme=state.theme==="light"?"dark":"light";saveState();applyTheme();showToast(state.theme==="light"?"Light theme enabled.":"Dark theme enabled.");});
modalClose.addEventListener("click", closeModal);
modalBackdrop.addEventListener("click", function(e){ if(e.target === modalBackdrop) closeModal(); });
document.addEventListener("keydown", function(event){
    if((event.ctrlKey || event.metaKey) && event.key.toLowerCase()==="s"){event.preventDefault();saveCurrent();}
    if((event.ctrlKey || event.metaKey) && event.key.toLowerCase()==="f"){event.preventDefault();findInput.focus();findInput.select();}
    if(event.key === "Escape" && modalBackdrop.classList.contains("show")) closeModal();
});

/* =========================================================
   STARTUP
========================================================= */
function startApplication() {
    loadState();
    document.getElementById("fontSelect").value = state.font;
    document.getElementById("fontSizeSelect").value = state.fontSize;
    applyTheme();

    const requested = new URLSearchParams(window.location.search).get("script");

    if (requested) {
        const requestedScript = getScript(requested);
        if (requestedScript) {
            requestedScript.sidebarHidden = false;
            /* A direct article link should always show the requested script. */
            state.tabs = state.tabs.filter(function(t){ return getScript(t.scriptId); });
            saveState();
            openScript(requested, {unhide:true});
            return;
        }
    }

    /* Restore a valid saved tab first. */
    const validActive = getActiveTab() && getScript(getActiveTab().scriptId);
    if (validActive) {
        renderTabs(); renderSidebar(sideSearch.value); loadActiveTab(); return;
    }

    /* If stale/invalid tabs existed, remove them before opening a default. */
    state.tabs = state.tabs.filter(function(t){ return getScript(t.scriptId); });
    state.activeTabId = state.tabs.length ? state.tabs[0].id : null;

    if (state.activeTabId) {
        saveState(); renderTabs(); renderSidebar(sideSearch.value); loadActiveTab(); return;
    }

    /* First visit / no open tab: open the inventory script. */
    const first = getScript("spo-site-inventory") || state.scripts.find(function(s){ return s.original && !s.sidebarHidden; });
    if (first) openScript(first.id, {unhide:true});
    else { renderTabs(); renderSidebar(""); setEditorContent(""); setStatus("No script available"); }
}

startApplication();

})();
