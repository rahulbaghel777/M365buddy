<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M365Buddy Script Workspace</title>

<link rel="icon" type="image/svg+xml" href="favicon.svg">

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #f5f7fb;
    --panel: #ffffff;
    --panel-soft: #f8fafc;
    --border: #d9dee8;
    --text: #172033;
    --muted: #647084;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --danger: #dc2626;
    --editor-bg: #ffffff;
    --editor-text: #172033;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

/* =========================================================
   MAIN APPLICATION
========================================================= */

.app {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
}

/* =========================================================
   TOP HEADER
========================================================= */

.topbar {
    height: 58px;
    min-height: 58px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 12px;
}

.brand {
    font-size: 18px;
    font-weight: 800;
    white-space: nowrap;
}

.brand span {
    color: var(--accent);
}

.top-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
}

/* =========================================================
   BUTTONS
========================================================= */

.btn {
    border: 1px solid var(--border);
    background: #ffffff;
    color: var(--text);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
}

.btn:hover {
    background: #f1f5f9;
}

.btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
}

.btn.primary:hover {
    background: var(--accent-hover);
}

.btn.danger {
    color: var(--danger);
}

.btn.danger:hover {
    background: #fef2f2;
}

/* =========================================================
   BODY
========================================================= */

.body {
    flex: 1;
    min-height: 0;
    display: flex;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    width: 285px;
    min-width: 285px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
}

.side-head {
    padding: 16px;
    border-bottom: 1px solid var(--border);
}

.side-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 10px;
}

.side-search {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
}

.side-search:focus {
    border-color: var(--accent);
}

.script-list {
    padding: 10px;
    overflow-y: auto;
    flex: 1;
}

.script-item {
    padding: 11px 12px;
    border-radius: 8px;
    margin-bottom: 5px;
    cursor: pointer;
    border: 1px solid transparent;
}

.script-item:hover {
    background: #f1f5f9;
}

.script-item.active {
    background: #eff6ff;
    border-color: #bfdbfe;
    color: #1d4ed8;
}

.script-name {
    font-size: 13px;
    font-weight: 600;
}

.script-meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
}

.side-bottom {
    padding: 12px;
    border-top: 1px solid var(--border);
}

.side-bottom .btn {
    width: 100%;
}

/* =========================================================
   WORKSPACE
========================================================= */

.workspace {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

/* =========================================================
   EDITOR TABS
========================================================= */

.tabbar {
    height: 46px;
    min-height: 46px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    overflow-x: auto;
}

.tab {
    height: 35px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 9px 0 12px;
    border: 1px solid transparent;
    border-radius: 7px 7px 0 0;
    background: #f1f5f9;
    white-space: nowrap;
    max-width: 240px;
    flex-shrink: 0;
}

.tab.active {
    background: #ffffff;
    border-color: var(--border);
    border-bottom-color: #ffffff;
    margin-bottom: -6px;
}

.tab-label {
    overflow: hidden;
    text-overflow: ellipsis;
}

.tab-close {
    border: 0;
    background: transparent;
    color: #647084;
    font-size: 16px;
    width: 20px;
    height: 20px;
    border-radius: 4px;
    padding: 0;
    line-height: 18px;
}

.tab-close:hover {
    background: #e2e8f0;
    color: #111827;
}

/* PLUS BUTTON IS DIRECTLY NEXT TO TABS */

.add-tab {
    flex: 0 0 35px;
    width: 35px;
    height: 35px;
    border: 1px dashed #94a3b8;
    background: #ffffff;
    border-radius: 8px;
    font-size: 21px;
    color: #475569;
    line-height: 30px;
    margin-left: 2px;
}

.add-tab:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: #eff6ff;
}

/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {
    min-height: 50px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 10px;
    flex-wrap: wrap;
}

.toolbar .separator {
    height: 25px;
    width: 1px;
    background: var(--border);
    margin: 0 2px;
}

.toolbar input,
.toolbar select {
    height: 34px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #ffffff;
    padding: 0 8px;
}

.toolbar input {
    width: 220px;
}

.toolbar .spacer {
    flex: 1;
}

/* =========================================================
   EDITOR
========================================================= */

.editor-wrap {
    flex: 1;
    min-height: 0;
    padding: 10px;
    background: #eef2f7;
    display: flex;
}

.editor-card {
    flex: 1;
    min-width: 0;
    min-height: 0;
    background: var(--editor-bg);
    border: 1px solid var(--border);
    border-radius: 9px;
    display: flex;
    overflow: hidden;
}

.line-numbers {
    width: 52px;
    min-width: 52px;
    background: #f8fafc;
    border-right: 1px solid #e2e8f0;
    color: #94a3b8;
    text-align: right;
    padding: 14px 9px 14px 0;
    font: 13px/20px Consolas, "Courier New", monospace;
    overflow: hidden;
    user-select: none;
    white-space: pre;
}

.editor {
    flex: 1;
    min-width: 0;
    min-height: 0;
    resize: none;
    border: 0;
    outline: 0;
    padding: 14px 16px;
    font: 13px/20px Consolas, "Courier New", monospace;
    color: var(--editor-text);
    background: var(--editor-bg);
    white-space: pre;
    overflow: auto;
    tab-size: 4;
}

.editor:focus {
    box-shadow: inset 0 0 0 2px rgba(37, 99, 235, 0.12);
}

.editor[readonly] {
    background: #fbfcfe;
}

/* =========================================================
   STATUS BAR
========================================================= */

.statusbar {
    height: 28px;
    min-height: 28px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-size: 11px;
    color: var(--muted);
    gap: 15px;
}

.statusbar .right {
    margin-left: auto;
}

/* =========================================================
   MODAL
========================================================= */

.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.38);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
}

.modal-backdrop.show {
    display: flex;
}

.modal {
    width: min(520px, calc(100vw - 32px));
    background: #ffffff;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 25px 70px rgba(15, 23, 42, 0.25);
    overflow: hidden;
}

.modal-head {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
}

.modal-title {
    font-weight: 700;
}

.modal-x {
    margin-left: auto;
    border: 0;
    background: transparent;
    font-size: 22px;
    color: #647084;
    cursor: pointer;
}

.modal-body {
    padding: 18px;
}

.modal-foot {
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

.option {
    display: flex;
    gap: 12px;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 9px;
    margin-bottom: 10px;
    cursor: pointer;
}

.option:hover {
    border-color: #93c5fd;
    background: #f8fbff;
}

.option-icon {
    font-size: 20px;
}

.option-title {
    font-weight: 650;
    font-size: 14px;
}

.option-desc {
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
}

.modal-input {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: 0;
}

.modal-input:focus {
    border-color: var(--accent);
}

/* =========================================================
   TOAST
========================================================= */

.toast {
    position: fixed;
    right: 18px;
    bottom: 42px;
    background: #172033;
    color: #ffffff;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    box-shadow: 0 8px 25px rgba(15, 23, 42, 0.15);
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: 0.2s;
    z-index: 2000;
}

.toast.show {
    opacity: 1;
    transform: translateY(0);
}

/* =========================================================
   DARK THEME
========================================================= */

body.dark {
    --bg: #111827;
    --panel: #172033;
    --panel-soft: #1e293b;
    --border: #334155;
    --text: #e5e7eb;
    --muted: #94a3b8;
    --editor-bg: #0f172a;
    --editor-text: #e5e7eb;
}

body.dark .btn,
body.dark .add-tab,
body.dark .toolbar input,
body.dark .toolbar select,
body.dark .side-search {
    background: #1e293b;
    color: #e5e7eb;
}

body.dark .script-item:hover,
body.dark .tab {
    background: #1e293b;
}

body.dark .tab.active {
    background: #172033;
    border-bottom-color: #172033;
}

body.dark .editor {
    background: #0f172a;
    color: #e5e7eb;
}

body.dark .line-numbers {
    background: #111827;
    color: #64748b;
    border-color: #334155;
}

body.dark .editor-wrap {
    background: #0b1220;
}

body.dark .editor[readonly] {
    background: #111827;
}

body.dark .modal {
    background: #172033;
}

body.dark .modal-foot,
body.dark .modal-head {
    border-color: #334155;
}

body.dark .option:hover {
    background: #1e293b;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 900px) {

    .sidebar {
        width: 230px;
        min-width: 230px;
    }

    .toolbar input {
        width: 150px;
    }
}

@media (max-width: 700px) {

    .sidebar {
        display: none;
    }

    .brand {
        font-size: 15px;
    }

    .top-actions .btn:first-child {
        display: none;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="topbar">

        <div class="brand">
            M365<span>Buddy</span> Script Workspace
        </div>

        <div class="top-actions">

            <button
                type="button"
                class="btn"
                id="homeBtn">
                Home
            </button>

            <button
                type="button"
                class="btn primary"
                id="newScriptBtn">
                ＋ Create New Script
            </button>

        </div>

    </header>


    <!-- =====================================================
         BODY
    ====================================================== -->

    <div class="body">

        <!-- =================================================
             SIDEBAR
        ================================================== -->

        <aside class="sidebar">

            <div class="side-head">

                <div class="side-title">
                    M365Buddy Scripts
                </div>

                <input
                    type="text"
                    id="sideSearch"
                    class="side-search"
                    placeholder="Search scripts...">

            </div>

            <div
                class="script-list"
                id="scriptList">
            </div>

            <div class="side-bottom">

                <button
                    type="button"
                    class="btn"
                    id="refreshBtn">
                    ↻ Refresh List
                </button>

            </div>

        </aside>


        <!-- =================================================
             WORKSPACE
        ================================================== -->

        <main class="workspace">

            <!-- =================================================
                 EDITOR TABS

                 IMPORTANT:
                 PLUS BUTTON IS HERE, DIRECTLY NEXT TO TABS.
            ================================================== -->

            <div
                class="tabbar"
                id="tabbar">

                <button
                    type="button"
                    class="add-tab"
                    id="addTabBtn"
                    title="Open another editor tab">
                    +
                </button>

            </div>


            <!-- =================================================
                 TOOLBAR
            ================================================== -->

            <div class="toolbar">

                <button
                    type="button"
                    class="btn"
                    id="saveBtn">
                    Save
                </button>

                <button
                    type="button"
                    class="btn"
                    id="copyBtn">
                    Copy
                </button>

                <button
                    type="button"
                    class="btn"
                    id="downloadBtn">
                    Download
                </button>

                <button
                    type="button"
                    class="btn"
                    id="renameBtn">
                    Rename
                </button>

                <button
                    type="button"
                    class="btn danger"
                    id="deleteBtn">
                    Delete
                </button>

                <button
                    type="button"
                    class="btn"
                    id="resetBtn">
                    Reset
                </button>

                <div class="separator"></div>

                <input
                    type="text"
                    id="findInput"
                    placeholder="Find in script..."
                    autocomplete="off">

                <button
                    type="button"
                    class="btn"
                    id="findPrevBtn">
                    ↑
                </button>

                <button
                    type="button"
                    class="btn"
                    id="findNextBtn">
                    ↓
                </button>

                <span
                    id="findCount"
                    style="font-size:12px;color:#647084">
                </span>

                <div class="spacer"></div>

                <select id="fontSelect">
                    <option value="Consolas">Consolas</option>
                    <option value="Courier New">Courier New</option>
                    <option value="monospace">Monospace</option>
                </select>

                <select id="fontSizeSelect">
                    <option value="12">12</option>
                    <option value="13" selected>13</option>
                    <option value="14">14</option>
                    <option value="15">15</option>
                    <option value="16">16</option>
                </select>

                <button
                    type="button"
                    class="btn"
                    id="themeBtn">
                    Dark
                </button>

            </div>


            <!-- =================================================
                 EDITOR
            ================================================== -->

            <div class="editor-wrap">

                <div class="editor-card">

                    <div
                        class="line-numbers"
                        id="lineNumbers">
                        1
                    </div>

                    <textarea
                        id="editor"
                        class="editor"
                        spellcheck="false"
                        wrap="off"></textarea>

                </div>

            </div>


            <!-- =================================================
                 STATUS BAR
            ================================================== -->

            <div class="statusbar">

                <span id="statusText">
                    Ready
                </span>

                <span id="dirtyText">
                </span>

                <span
                    class="right"
                    id="positionText">
                    Ln 1, Col 1
                </span>

            </div>

        </main>

    </div>

</div>


<!-- =========================================================
     SITE NATIVE MODAL
========================================================= -->

<div
    class="modal-backdrop"
    id="modalBackdrop">

    <div
        class="modal"
        role="dialog"
        aria-modal="true">

        <div class="modal-head">

            <div
                class="modal-title"
                id="modalTitle">
                Create New Script
            </div>

            <button
                type="button"
                class="modal-x"
                id="modalClose">
                ×
            </button>

        </div>

        <div
            class="modal-body"
            id="modalBody">
        </div>

        <div
            class="modal-foot"
            id="modalFoot">
        </div>

    </div>

</div>


<div
    class="toast"
    id="toast">
</div>


<script>

(function () {

"use strict";

/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
    "m365buddy_script_workspace_functional_v1";


/* =========================================================
   ORIGINAL M365BUDDY SCRIPTS
========================================================= */

const ORIGINAL_SCRIPTS = [

    {
        id: "spo-site-inventory",

        name: "SharePoint Online - Get All Sites",

        description: "PnP PowerShell site inventory example",

        content:
`# ============================================================
# M365Buddy - SharePoint Online Site Inventory
# ============================================================

# IMPORTANT:
# Replace the placeholder values before running.
#
# Do NOT publish:
# - Client secrets
# - PFX passwords
# - Private keys
# - Internal SMTP credentials
# - Tenant-specific confidential information


$TenantName = "YOUR-TENANT"

$TenantAdminUrl =
    "https://YOUR-TENANT-admin.sharepoint.com"

$ClientId =
    "YOUR-APP-CLIENT-ID"

$CertificatePath =
    "C:\\Path\\To\\SharePointAutomationCert.pfx"

$CertificatePassword =
    "YOUR-PFX-PASSWORD"


$OutputCsv =
    Join-Path $env:USERPROFILE `
    "Desktop\\SharePoint-Site-Inventory.csv"


# ============================================================
# CONNECT
# ============================================================

Connect-PnPOnline `
    -Url $TenantAdminUrl `
    -ClientId $ClientId `
    -CertificatePath $CertificatePath `
    -CertificatePassword $CertificatePassword


# ============================================================
# GET SITES
# ============================================================

$Sites =
    Get-PnPTenantSite -Detailed


# ============================================================
# BUILD REPORT
# ============================================================

$Report = foreach ($Site in $Sites) {

    [PSCustomObject]@{

        SiteName =
            $Site.Title

        SiteUrl =
            $Site.Url

        StorageMB =
            [math]::Round(
                $Site.StorageUsageCurrent,
                2
            )

        StorageQuotaMB =
            [math]::Round(
                $Site.StorageQuota,
                2
            )

        Template =
            $Site.Template

        Created =
            $Site.TimeCreated

        LastModified =
            $Site.LastContentModifiedDate
    }
}


# ============================================================
# EXPORT
# ============================================================

$Report |
    Sort-Object SiteName |
    Export-Csv `
        -Path $OutputCsv `
        -NoTypeInformation `
        -Encoding UTF8


Write-Host ""
Write-Host "Report created:" -ForegroundColor Green
Write-Host $OutputCsv -ForegroundColor Cyan
`,

        original: true,
        readOnly: true

    }

];


/* =========================================================
   APPLICATION STATE
========================================================= */

let state = {

    theme: "light",

    font: "Consolas",

    fontSize: "13",

    scripts: [],

    tabs: [],

    activeTabId: null

};


/* =========================================================
   SEARCH STATE
========================================================= */

let search = {

    term: "",

    matches: [],

    index: -1

};


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


/* =========================================================
   DOM REFERENCES
========================================================= */

const editor =
    document.getElementById("editor");

const lineNumbers =
    document.getElementById("lineNumbers");

const tabbar =
    document.getElementById("tabbar");

const addTabBtn =
    document.getElementById("addTabBtn");

const scriptList =
    document.getElementById("scriptList");

const sideSearch =
    document.getElementById("sideSearch");

const modalBackdrop =
    document.getElementById("modalBackdrop");

const modalTitle =
    document.getElementById("modalTitle");

const modalBody =
    document.getElementById("modalBody");

const modalFoot =
    document.getElementById("modalFoot");

const toast =
    document.getElementById("toast");

const statusText =
    document.getElementById("statusText");

const dirtyText =
    document.getElementById("dirtyText");

const positionText =
    document.getElementById("positionText");

const findInput =
    document.getElementById("findInput");

const findCount =
    document.getElementById("findCount");


/* =========================================================
   BASIC HELPERS
========================================================= */

function generateId(prefix) {

    return (
        prefix +
        "-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .substring(2, 8)
    );

}


function escapeHtml(value) {

    return String(value)
        .replace(/[&<>"']/g, function (character) {

            const map = {

                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"

            };

            return map[character];

        });

}


function showToast(message) {

    clearTimeout(toastTimer);

    toast.textContent = message;

    toast.classList.add("show");

    toastTimer =
        setTimeout(function () {

            toast.classList.remove("show");

        }, 2200);

}


function setStatus(message) {

    statusText.textContent = message;

}


/* =========================================================
   STORAGE FUNCTIONS
========================================================= */

function loadState() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (saved) {

            const parsed =
                JSON.parse(saved);

            state =
                Object.assign(
                    state,
                    parsed
                );

        }

    }

    catch (error) {

        console.warn(
            "Could not load workspace:",
            error
        );

    }


    if (!Array.isArray(state.scripts)) {

        state.scripts = [];

    }


    if (!Array.isArray(state.tabs)) {

        state.tabs = [];

    }


    if (!state.theme) {

        state.theme = "light";

    }


    if (!state.font) {

        state.font = "Consolas";

    }


    if (!state.fontSize) {

        state.fontSize = "13";

    }


    /*
       Make sure the original M365Buddy scripts
       are always available.
    */

    ORIGINAL_SCRIPTS.forEach(function (original) {

        const exists =
            state.scripts.some(function (script) {

                return script.id === original.id;

            });


        if (!exists) {

            state.scripts.push({

                id: original.id,

                name: original.name,

                description: original.description,

                content: original.content,

                original: true,

                readOnly: true

            });

        }

    });

}


function saveState() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(state)
        );

    }

    catch (error) {

        console.warn(
            "Could not save workspace:",
            error
        );

    }

}


/* =========================================================
   GETTERS
========================================================= */

function getActiveTab() {

    return state.tabs.find(function (tab) {

        return tab.id === state.activeTabId;

    }) || null;

}


function getScript(scriptId) {

    return state.scripts.find(function (script) {

        return script.id === scriptId;

    }) || null;

}


function getActiveScript() {

    const tab =
        getActiveTab();

    if (!tab) {

        return null;

    }

    return getScript(
        tab.scriptId
    );

}


/* =========================================================
   EDITOR
========================================================= */

function syncActiveContent() {

    const tab =
        getActiveTab();

    if (!tab) {

        return;

    }

    tab.content =
        editor.value;

}


function setEditorContent(content) {

    editor.value =
        content || "";

    updateLineNumbers();

    updatePosition();

}


function loadActiveTab() {

    const tab =
        getActiveTab();

    const script =
        getActiveScript();


    if (!tab || !script) {

        setEditorContent("");

        editor.readOnly = false;

        return;

    }


    editor.value =
        tab.content || "";


    editor.readOnly =
        !!script.readOnly;


    editor.scrollTop = 0;

    editor.scrollLeft = 0;

    editor.selectionStart = 0;

    editor.selectionEnd = 0;


    updateLineNumbers();

    updatePosition();

    clearSearch();


    if (script.readOnly) {

        setStatus(
            "Original M365Buddy script — Read Only"
        );

    }

    else {

        setStatus(
            "Ready to edit"
        );

    }


    updateDirtyStatus();

    applyTheme();

}


/* =========================================================
   LINE NUMBERS
========================================================= */

function updateLineNumbers() {

    const lineCount =
        Math.max(
            1,
            editor.value.split("\n").length
        );


    let output = "";


    for (
        let i = 1;
        i <= lineCount;
        i++
    ) {

        output +=
            i +
            (
                i < lineCount
                    ? "\n"
                    : ""
            );

    }


    lineNumbers.textContent =
        output;


    lineNumbers.scrollTop =
        editor.scrollTop;

}


/* =========================================================
   CURSOR POSITION
========================================================= */

function updatePosition() {

    const position =
        editor.selectionStart || 0;


    const before =
        editor.value.substring(
            0,
            position
        );


    const lines =
        before.split("\n");


    const line =
        lines.length;


    const column =
        lines[lines.length - 1].length + 1;


    positionText.textContent =
        "Ln " +
        line +
        ", Col " +
        column;

}


/* =========================================================
   DIRTY STATE
========================================================= */

function updateDirtyStatus() {

    const tab =
        getActiveTab();

    if (!tab) {

        dirtyText.textContent =
            "";

        return;

    }


    dirtyText.textContent =
        tab.dirty
            ? "• Unsaved changes"
            : "Saved";


    renderTabs();

}


/* =========================================================
   SIDEBAR
========================================================= */

function renderSidebar(filter) {

    const search =
        (filter || "")
            .trim()
            .toLowerCase();


    scriptList.innerHTML =
        "";


    state.scripts

        /*
           Only original scripts and custom scripts
           belong in the left sidebar.

           Editable copies created from an original
           are intentionally NOT added to this list.
        */

        .filter(function (script) {

            return (
                script.original ||
                !script.originalId
            );

        })

        .filter(function (script) {

            return (
                !search ||
                script.name
                    .toLowerCase()
                    .includes(search) ||
                (script.description || "")
                    .toLowerCase()
                    .includes(search)
            );

        })

        .forEach(function (script) {

            const item =
                document.createElement("div");


            item.className =
                "script-item";


            const activeTab =
                getActiveTab();


            if (
                activeTab &&
                activeTab.scriptId === script.id
            ) {

                item.classList.add(
                    "active"
                );

            }


            item.innerHTML =

                '<div class="script-name">' +

                escapeHtml(
                    script.name
                ) +

                '</div>' +

                '<div class="script-meta">' +

                escapeHtml(
                    script.description ||
                    "M365Buddy script"
                ) +

                '</div>';


            item.addEventListener(
                "click",
                function () {

                    openScript(
                        script.id
                    );

                }
            );


            scriptList.appendChild(
                item
            );

        });


    if (
        scriptList.children.length === 0
    ) {

        scriptList.innerHTML =
            '<div style="padding:12px;color:#647084;font-size:12px;">' +
            'No scripts found.' +
            '</div>';

    }

}


/* =========================================================
   TABS
========================================================= */

function renderTabs() {

    /*
       Remove existing tab elements
       but preserve the plus button.
    */

    const existingTabs =
        tabbar.querySelectorAll(
            ".tab"
        );


    existingTabs.forEach(
        function (tab) {

            tab.remove();

        }
    );


    state.tabs.forEach(
        function (tab) {

            const script =
                getScript(
                    tab.scriptId
                );


            if (!script) {

                return;

            }


            const tabElement =
                document.createElement(
                    "div"
                );


            tabElement.className =
                "tab";


            if (
                tab.id ===
                state.activeTabId
            ) {

                tabElement.classList.add(
                    "active"
                );

            }


            const label =
                document.createElement(
                    "span"
                );


            label.className =
                "tab-label";


            label.textContent =
                (
                    tab.dirty
                        ? "● "
                        : ""
                ) +
                script.name;


            const close =
                document.createElement(
                    "button"
                );


            close.type =
                "button";


            close.className =
                "tab-close";


            close.textContent =
                "×";


            close.title =
                "Close editor tab";


            close.addEventListener(
                "click",
                function (event) {

                    event.stopPropagation();

                    closeTab(
                        tab.id
                    );

                }
            );


            tabElement.appendChild(
                label
            );


            tabElement.appendChild(
                close
            );


            tabElement.addEventListener(
                "click",
                function () {

                    activateTab(
                        tab.id
                    );

                }
            );


            tabbar.insertBefore(
                tabElement,
                addTabBtn
            );

        }
    );

}


/* =========================================================
   OPEN SCRIPT
========================================================= */

function openScript(scriptId) {

    syncActiveContent();


    let tab =
        state.tabs.find(
            function (item) {

                return (
                    item.scriptId ===
                    scriptId
                );

            }
        );


    if (!tab) {

        const script =
            getScript(
                scriptId
            );


        if (!script) {

            return;

        }


        tab = {

            id:
                generateId("tab"),

            scriptId:
                script.id,

            content:
                script.content || "",

            dirty:
                false

        };


        state.tabs.push(
            tab
        );

    }


    state.activeTabId =
        tab.id;


    saveState();


    renderTabs();

    renderSidebar(
        sideSearch.value
    );

    loadActiveTab();

}


/* =========================================================
   ACTIVATE TAB
========================================================= */

function activateTab(tabId) {

    if (
        state.activeTabId ===
        tabId
    ) {

        return;

    }


    syncActiveContent();


    state.activeTabId =
        tabId;


    saveState();


    renderTabs();

    renderSidebar(
        sideSearch.value
    );

    loadActiveTab();

}


/* =========================================================
   CLOSE TAB
========================================================= */

function closeTab(tabId) {

    const index =
        state.tabs.findIndex(
            function (tab) {

                return tab.id === tabId;

            }
        );


    if (index < 0) {

        return;

    }


    const closingActive =
        state.activeTabId ===
        tabId;


    state.tabs.splice(
        index,
        1
    );


    if (closingActive) {

        if (state.tabs.length > 0) {

            const newIndex =
                Math.max(
                    0,
                    index - 1
                );


            state.activeTabId =
                state.tabs[
                    newIndex
                ].id;

        }

        else {

            state.activeTabId =
                null;

        }

    }


    saveState();


    renderTabs();

    renderSidebar(
        sideSearch.value
    );


    if (state.activeTabId) {

        loadActiveTab();

    }

    else {

        setEditorContent("");

        setStatus(
            "No editor tab open"
        );

        dirtyText.textContent =
            "";

    }

}


/* =========================================================
   CREATE PERSONAL SCRIPT
========================================================= */

function createPersonalScript(
    name,
    content,
    originalId
) {

    const script = {

        id:
            generateId("script"),

        name:
            name,

        description:
            originalId
                ? "Editable copy"
                : "Custom script",

        content:
            content || "",

        original:
            false,

        readOnly:
            false,

        originalId:
            originalId || null

    };


    state.scripts.push(
        script
    );


    /*
       Open it immediately in a
       completely separate editor tab.
    */

    openScript(
        script.id
    );


    saveState();


    renderSidebar(
        sideSearch.value
    );


    return script;

}


/* =========================================================
   COPY NAMING
========================================================= */

function getNextCopyName(
    originalName
) {

    const base =
        originalName
            .replace(
                /\s+Copy(?:\s+\d+)?$/i,
                ""
            )
            .trim();


    const existingNames =
        new Set(
            state.scripts.map(
                function (script) {

                    return script.name
                        .toLowerCase();

                }
            )
        );


    let name =
        base + " Copy";


    let number =
        2;


    while (
        existingNames.has(
            name.toLowerCase()
        )
    ) {

        name =
            base +
            " Copy " +
            number;

        number++;

    }


    return name;

}


/* =========================================================
   CREATE COPY
========================================================= */

function createCopy() {

    syncActiveContent();


    const current =
        getActiveScript();


    if (!current) {

        showToast(
            "No script is open."
        );

        return;

    }


    const copyName =
        getNextCopyName(
            current.name
        );


    createPersonalScript(
        copyName,
        editor.value,
        current.original
            ? current.id
            : current.originalId
    );


    showToast(
        copyName +
        " opened in a new editor tab."
    );

}


/* =========================================================
   SAVE
========================================================= */

function saveCurrent() {

    syncActiveContent();


    const tab =
        getActiveTab();


    const script =
        getActiveScript();


    if (!tab || !script) {

        showToast(
            "No script is open."
        );

        return;

    }


    if (script.readOnly) {

        showToast(
            "Original script is read-only. Use Copy first."
        );

        return;

    }


    script.content =
        tab.content;


    tab.dirty =
        false;


    saveState();


    renderTabs();


    updateDirtyStatus();


    setStatus(
        "Saved successfully"
    );


    showToast(
        "Script saved."
    );

}


/* =========================================================
   COPY TO CLIPBOARD
========================================================= */

function copyToClipboard() {

    syncActiveContent();


    if (!getActiveScript()) {

        showToast(
            "No script is open."
        );

        return;

    }


    if (
        navigator.clipboard &&
        window.isSecureContext
    ) {

        navigator.clipboard
            .writeText(
                editor.value
            )
            .then(
                function () {

                    showToast(
                        "Script copied to clipboard."
                    );

                },

                function () {

                    fallbackCopy();

                }
            );

    }

    else {

        fallbackCopy();

    }

}


function fallbackCopy() {

    editor.focus();

    editor.select();


    try {

        document.execCommand(
            "copy"
        );


        showToast(
            "Script copied to clipboard."
        );

    }

    catch (error) {

        showToast(
            "Copy failed. Please copy manually."
        );

    }

}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadCurrent() {

    syncActiveContent();


    const script =
        getActiveScript();


    if (!script) {

        showToast(
            "No script is open."
        );

        return;

    }


    const blob =
        new Blob(
            [
                editor.value
            ],
            {
                type:
                    "text/plain;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        (
            script.name
                .replace(
                    /[\\/:*?"<>|]/g,
                    "_"
                ) ||
            "script"
        ) +
        ".ps1";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );


    showToast(
        "PowerShell script downloaded."
    );

}

   DELETE
========================================================= */

    const script =
        getActiveScript();


    const tab =
        getActiveTab();


    if (!script || !tab) {

        showToast(
            "No script is open."
        );

        return;

    }


    if (script.readOnly) {

        showToast(
            "Original M365Buddy script cannot be deleted."
        );

        return;

    }


    showModal(

        "Delete Script",

        '<div style="font-size:13px;line-height:1.5;">' +

        'Delete <strong>' +

        escapeHtml(
            script.name
        ) +

        '</strong>?' +

        '<br><br>' +

        'This will remove the custom script from this browser workspace.' +

        '</div>',

        '<button type="button" class="btn" id="deleteCancel">Cancel</button>' +

        '<button type="button" class="btn danger" id="deleteOk">Delete</button>'

    );


    document
        .getElementById("deleteCancel")
        .addEventListener(
            "click",
            closeModal
        );


    document
        .getElementById("deleteOk")
        .addEventListener(
            "click",
            function () {

                state.scripts =
                    state.scripts.filter(
                        function (item) {

                            return (
                                item.id !==
                                script.id
                            );

                        }
                    );


                state.tabs =
                    state.tabs.filter(
                        function (item) {

                            return (
                                item.scriptId !==
                                script.id
                            );

                        }
                    );


                if (
                    state.tabs.length > 0
                ) {

                    state.activeTabId =
                        state.tabs[
                            state.tabs.length - 1
                        ].id;

                }

                else {

                    state.activeTabId =
                        null;

                }


                saveState();


                closeModal();


                renderTabs();

                renderSidebar(
                    sideSearch.value
                );


                if (
                    state.activeTabId
                ) {

                    loadActiveTab();

                }

                else {

                    setEditorContent("");

                }


                showToast(
                    "Script deleted."
                );

            }
        );

/* =========================================================
   SEARCH
========================================================= */

function findMatches(term) {

    const value =
        editor.value;


    const lowerValue =
        value.toLowerCase();


    const lowerTerm =
        term.toLowerCase();


    const matches = [];


    if (!lowerTerm) {

        return matches;

    }


    let start = 0;


    while (true) {

        const index =
            lowerValue.indexOf(
                lowerTerm,
                start
            );


        if (index === -1) {

            break;

        }


        matches.push(
            index
        );


        start =
            index +
            Math.max(
                1,
                lowerTerm.length
            );

    }


    return matches;

}


function updateSearch() {

    search.term =
        findInput.value;


    search.matches =
        findMatches(
            search.term
        );


    search.index =
        -1;


    if (!search.term) {

        findCount.textContent =
            "";

        return;

    }


    findCount.textContent =
        search.matches.length +
        (
            search.matches.length === 1
                ? " match"
                : " matches"
        );


    if (
        search.matches.length > 0
    ) {

        goToMatch(0);

    }

}


function goToMatch(index) {

    if (
        search.matches.length === 0
    ) {

        return;

    }


    search.index =
        (
            index +
            search.matches.length
        ) %
        search.matches.length;


    const start =
        search.matches[
            search.index
        ];


    const end =
        start +
        search.term.length;


    editor.focus();


    editor.setSelectionRange(
        start,
        end
    );


    const textBefore =
        editor.value.substring(
            0,
            start
        );


    const line =
        textBefore.split(
            "\n"
        ).length;


    const lineHeight =
        parseInt(
            getComputedStyle(
                editor
            ).lineHeight,
            10
        ) || 20;


    editor.scrollTop =
        Math.max(
            0,
            (line - 3) *
            lineHeight
        );


    findCount.textContent =
        (
            search.index + 1
        ) +
        " / " +
        search.matches.length;

}


function clearSearch() {

    search.term =
        "";

    search.matches =
        [];

    search.index =
        -1;

    findInput.value =
        "";

    findCount.textContent =
        "";

}


/* =========================================================
   THEME
========================================================= */

function applyTheme() {

    if (
        state.theme ===
        "dark"
    ) {

        document.body.classList.add(
            "dark"
        );


        document.getElementById(
            "themeBtn"
        ).textContent =
            "Light";

    }

    else {

        document.body.classList.remove(
            "dark"
        );


        document.getElementById(
            "themeBtn"
        ).textContent =
            "Dark";

    }


    editor.style.fontFamily =
        state.font;


    editor.style.fontSize =
        state.fontSize +
        "px";


    lineNumbers.style.fontFamily =
        state.font;


    lineNumbers.style.fontSize =
        state.fontSize +
        "px";

}


/* =========================================================
   HOME
========================================================= */

function openHome() {

    /*
       Named window allows the browser to reuse the
       M365Buddy home window when possible.
    */

    window.open(
        "https://m365buddy.com/",
        "M365BuddyHome"
    );

}


/* =========================================================
   EVENT HANDLERS
========================================================= */


/* CREATE NEW */

document
    .getElementById("newScriptBtn")
    .addEventListener(
        "click",
        openCreateModal
    );


/* PLUS NEXT TO TABS */

addTabBtn.addEventListener(
    "click",
    function () {

        openCreateModal();

    }
);


/* HOME */

document
    .getElementById("homeBtn")
    .addEventListener(
        "click",
        openHome
    );


/* SAVE */

document
    .getElementById("saveBtn")
    .addEventListener(
        "click",
        saveCurrent
    );


/* COPY */

document
    .getElementById("copyBtn")
    .addEventListener(
        "click",
        copyToClipboard
    );


/* DOWNLOAD */

document
    .getElementById("downloadBtn")
    .addEventListener(
        "click",
        downloadCurrent
    );


/* RENAME */

document
    .getElementById("renameBtn")
    .addEventListener(
        "click",
        renameCurrent
    );


/* DELETE */

document
    .getElementById("deleteBtn")
    .addEventListener(
        "click",
        deleteCurrent
    );


/* RESET */

document
    .getElementById("resetBtn")
    .addEventListener(
        "click",
        resetCurrent
    );


/* SIDEBAR SEARCH */

sideSearch.addEventListener(
    "input",
    function () {

        renderSidebar(
            sideSearch.value
        );

    }
);


/* REFRESH */

document
    .getElementById("refreshBtn")
    .addEventListener(
        "click",
        function () {

            renderSidebar(
                sideSearch.value
            );

            renderTabs();

            showToast(
                "Script list refreshed."
            );

        }
    );


/* EDITOR INPUT */

editor.addEventListener(
    "input",
    function () {

        syncActiveContent();


        const tab =
            getActiveTab();


        if (tab) {

            tab.dirty =
                true;

        }


        updateLineNumbers();

        updatePosition();

        updateSearch();

        renderTabs();

        saveState();

    }
);


/* EDITOR SCROLL */

editor.addEventListener(
    "scroll",
    function () {

        lineNumbers.scrollTop =
            editor.scrollTop;

    }
);


/* CURSOR POSITION */

editor.addEventListener(
    "click",
    updatePosition
);


editor.addEventListener(
    "keyup",
    updatePosition
);


/* TAB KEY */

editor.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key ===
            "Tab"
        ) {

            event.preventDefault();


            const start =
                editor.selectionStart;


            const end =
                editor.selectionEnd;


            editor.setRangeText(
                "    ",
                start,
                end,
                "end"
            );


            editor.dispatchEvent(
                new Event(
                    "input",
                    {
                        bubbles: true
                    }
                )
            );

        }

    }
);


/* FIND */

findInput.addEventListener(
    "input",
    updateSearch
);


findInput.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();


            if (
                event.shiftKey
            ) {

                goToMatch(
                    search.index - 1
                );

            }

            else {

                goToMatch(
                    search.index + 1
                );

            }

        }


        if (
            event.key ===
            "Escape"
        ) {

            clearSearch();

        }

    }
);


/* FIND PREVIOUS */

document
    .getElementById("findPrevBtn")
    .addEventListener(
        "click",
        function () {

            goToMatch(
                search.index - 1
            );

        }
    );


/* FIND NEXT */

document
    .getElementById("findNextBtn")
    .addEventListener(
        "click",
        function () {

            goToMatch(
                search.index + 1
            );

        }
    );


/* FONT */

document
    .getElementById("fontSelect")
    .addEventListener(
        "change",
        function (event) {

            state.font =
                event.target.value;


            saveState();

            applyTheme();

        }
    );


/* FONT SIZE */

document
    .getElementById("fontSizeSelect")
    .addEventListener(
        "change",
        function (event) {

            state.fontSize =
                event.target.value;


            saveState();

            applyTheme();

            updateLineNumbers();

        }
    );


/* THEME */

document
    .getElementById("themeBtn")
    .addEventListener(
        "click",
        function () {

            state.theme =
                state.theme === "light"
                    ? "dark"
                    : "light";


            saveState();

            applyTheme();


            showToast(
                state.theme === "light"
                    ? "Light theme enabled."
                    : "Dark theme enabled."
            );

        }
    );


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
    "keydown",
    function (event) {

        /*
           Ctrl + S
        */

        if (
            (event.ctrlKey ||
             event.metaKey) &&
            event.key.toLowerCase() === "s"
        ) {

            event.preventDefault();

            saveCurrent();

        }


        /*
           Ctrl + F
        */

        if (
            (event.ctrlKey ||
             event.metaKey) &&
            event.key.toLowerCase() === "f"
        ) {

            event.preventDefault();

            findInput.focus();

            findInput.select();

        }


        /*
           Escape closes modal
        */

        if (
            event.key ===
            "Escape"
        ) {

            if (
                modalBackdrop.classList.contains(
                    "show"
                )
            ) {

                closeModal();

            }

        }

    }
);


/* =========================================================
   START APPLICATION
========================================================= */

function startApplication() {

    loadState();


    /*
       IMPORTANT:
       Light is the default.
    */

    if (!state.theme) {

        state.theme =
            "light";

    }


    document.getElementById(
        "fontSelect"
    ).value =
        state.font;


    document.getElementById(
        "fontSizeSelect"
    ).value =
        state.fontSize;


    applyTheme();


    renderSidebar("");


    /*
       Restore existing tabs if possible.
    */

    if (
        state.tabs.length > 0 &&
        state.activeTabId &&
        state.tabs.some(
            function (tab) {

                return (
                    tab.id ===
                    state.activeTabId
                );

            }
        )
    ) {

        renderTabs();

        renderSidebar("");

        loadActiveTab();

    }

    else {

        /*
           First visit:
           automatically open the
           M365Buddy original script.
        */

        state.tabs = [];

        state.activeTabId =
            null;


        openScript(
            ORIGINAL_SCRIPTS[0].id
        );

    }


    updateLineNumbers();

    updatePosition();

}


/* RUN */

startApplication();


})();

</script>

</body>
</html>
