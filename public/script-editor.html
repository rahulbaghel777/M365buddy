<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>M365Buddy Script Workspace</title>

<link rel="icon"
      type="image/svg+xml"
      href="favicon.svg">

<!-- CodeMirror -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/powershell/powershell.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/scroll/annotatescrollbar.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/matchesonscrollbar.min.js"></script>


<style>

:root {
    --bg: #f5f7fb;
    --panel: #ffffff;
    --panel2: #f8fafc;

    --border: #d9dee8;

    --text: #172033;
    --muted: #687386;

    --primary: #2563eb;
    --primary-hover: #1d4ed8;

    --danger: #dc2626;

    --tab-bg: #eef2f7;
    --tab-active: #ffffff;

    --editor-bg: #ffffff;
    --editor-text: #172033;

    --search-bg: #fff1a8;
    --search-current: #86efac;

    --shadow:
        0 10px 30px rgba(15, 23, 42, 0.08);
}

html.dark {

    --bg: #0f172a;
    --panel: #111827;
    --panel2: #172033;

    --border: #293548;

    --text: #e5e7eb;
    --muted: #9ca3af;

    --primary: #60a5fa;
    --primary-hover: #93c5fd;

    --danger: #f87171;

    --tab-bg: #172033;
    --tab-active: #1e293b;

    --editor-bg: #111827;
    --editor-text: #e5e7eb;

    --search-bg: #713f12;
    --search-current: #166534;

    --shadow:
        0 10px 30px rgba(0,0,0,0.35);
}


* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        Inter,
        Segoe UI,
        Arial,
        sans-serif;

    background: var(--bg);
    color: var(--text);
}


button,
input,
select {

    font: inherit;
}


/* =========================================================
   MAIN APPLICATION
   ========================================================= */

.app {

    width: 100%;
    height: 100vh;

    display: flex;
}


/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar {

    width: 280px;
    min-width: 280px;

    height: 100%;

    display: flex;
    flex-direction: column;

    background: var(--panel);

    border-right:
        1px solid var(--border);
}


.brand {

    padding: 18px;

    border-bottom:
        1px solid var(--border);
}


.brand-title {

    font-size: 20px;
    font-weight: 700;
}


.brand-subtitle {

    margin-top: 4px;

    font-size: 12px;

    color: var(--muted);
}


.sidebar-actions {

    padding: 12px;

    display: flex;
    flex-direction: column;

    gap: 8px;
}


.sidebar-section-title {

    padding:
        12px 14px 6px;

    font-size: 11px;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 0.08em;

    color: var(--muted);
}


.script-list {

    flex: 1;

    overflow-y: auto;

    padding:
        4px 10px 16px;
}


.script-item {

    width: 100%;

    display: flex;
    align-items: center;

    gap: 10px;

    padding: 11px 12px;

    margin-bottom: 5px;

    border:
        1px solid transparent;

    border-radius: 8px;

    background: transparent;

    color: var(--text);

    cursor: pointer;

    text-align: left;
}


.script-item:hover {

    background: var(--panel2);
}


.script-item.active {

    background:
        rgba(37, 99, 235, 0.10);

    border-color:
        rgba(37, 99, 235, 0.25);
}


.script-icon {

    width: 28px;
    height: 28px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 7px;

    background:
        rgba(37,99,235,0.10);

    color: var(--primary);

    flex-shrink: 0;
}


.script-info {

    min-width: 0;
}


.script-name {

    font-size: 13px;

    font-weight: 600;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.script-type {

    margin-top: 2px;

    font-size: 11px;

    color: var(--muted);
}


/* =========================================================
   MAIN AREA
   ========================================================= */

.main {

    flex: 1;

    min-width: 0;

    height: 100%;

    display: flex;
    flex-direction: column;
}


/* =========================================================
   TOP HEADER
   ========================================================= */

.topbar {

    height: 58px;

    min-height: 58px;

    display: flex;
    align-items: center;

    justify-content: space-between;

    padding:
        0 14px;

    background: var(--panel);

    border-bottom:
        1px solid var(--border);
}


.topbar-left {

    display: flex;

    align-items: center;

    gap: 10px;

    min-width: 0;
}


.current-title {

    font-size: 15px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.topbar-right {

    display: flex;

    align-items: center;

    gap: 7px;
}


.btn {

    height: 34px;

    padding:
        0 12px;

    border:
        1px solid var(--border);

    border-radius: 7px;

    background: var(--panel);

    color: var(--text);

    cursor: pointer;

    font-size: 12px;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 6px;
}


.btn:hover {

    background: var(--panel2);
}


.btn-primary {

    background: var(--primary);

    border-color: var(--primary);

    color: white;

    font-weight: 600;
}


.btn-primary:hover {

    background: var(--primary-hover);

    border-color: var(--primary-hover);
}


.btn-danger {

    color: var(--danger);
}


.plus-button {

    width: 36px;
    height: 36px;

    padding: 0;

    border-radius: 8px;

    font-size: 21px;

    font-weight: 500;

    color: white;

    background: var(--primary);

    border: none;

    cursor: pointer;
}


.plus-button:hover {

    background: var(--primary-hover);

    transform: translateY(-1px);
}


/* =========================================================
   EDITOR TABS
   ========================================================= */

.tabs-row {

    height: 46px;

    min-height: 46px;

    display: flex;

    align-items: center;

    gap: 5px;

    padding:
        5px 8px;

    background: var(--panel2);

    border-bottom:
        1px solid var(--border);

    overflow-x: auto;

    overflow-y: hidden;
}


.tab {

    height: 34px;

    min-width: 130px;

    max-width: 230px;

    display: flex;

    align-items: center;

    gap: 6px;

    padding:
        0 8px 0 12px;

    border:
        1px solid var(--border);

    border-radius: 7px;

    background: var(--tab-bg);

    color: var(--text);

    cursor: pointer;

    flex-shrink: 0;
}


.tab.active {

    background: var(--tab-active);

    border-color:
        var(--primary);
}


.tab-name {

    flex: 1;

    min-width: 0;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    font-size: 12px;
}


.tab-close {

    width: 22px;
    height: 22px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 5px;

    color: var(--muted);

    cursor: pointer;
}


.tab-close:hover {

    background:
        rgba(239,68,68,0.12);

    color: var(--danger);
}


.new-tab-label {

    white-space: nowrap;

    font-size: 12px;

    font-weight: 600;
}


/* =========================================================
   TOOLBAR
   ========================================================= */

.toolbar {

    min-height: 48px;

    display: flex;

    align-items: center;

    gap: 7px;

    padding:
        7px 10px;

    background: var(--panel);

    border-bottom:
        1px solid var(--border);

    overflow-x: auto;
}


.toolbar-spacer {

    flex: 1;
}


.select {

    height: 32px;

    padding:
        0 8px;

    border:
        1px solid var(--border);

    border-radius: 6px;

    background: var(--panel);

    color: var(--text);

    font-size: 12px;
}


/* =========================================================
   SEARCH BAR
   ========================================================= */

.searchbar {

    display: none;

    min-height: 44px;

    align-items: center;

    gap: 7px;

    padding:
        6px 10px;

    background: var(--panel2);

    border-bottom:
        1px solid var(--border);
}


.searchbar.visible {

    display: flex;
}


.search-input {

    width: 260px;

    max-width: 35vw;

    height: 31px;

    padding:
        0 9px;

    border:
        1px solid var(--border);

    border-radius: 6px;

    outline: none;

    background: var(--panel);

    color: var(--text);
}


.search-input:focus {

    border-color:
        var(--primary);
}


.search-count {

    min-width: 65px;

    font-size: 11px;

    color: var(--muted);
}


/* =========================================================
   EDITOR CANVAS
   ========================================================= */

.editor-canvas {

    flex: 1;

    min-height: 0;

    position: relative;

    background: var(--editor-bg);
}


.editor-wrapper {

    width: 100%;
    height: 100%;
}


.CodeMirror {

    width: 100%;
    height: 100%;

    background: var(--editor-bg);

    color: var(--editor-text);

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size: 14px;

    line-height: 1.55;
}


.CodeMirror-gutters {

    background: var(--panel2);

    border-right:
        1px solid var(--border);
}


.CodeMirror-linenumber {

    color: var(--muted);
}


.CodeMirror-cursor {

    border-left:
        2px solid var(--primary);
}


.CodeMirror-selected {

    background:
        rgba(37,99,235,0.20) !important;
}


/* Search highlighting */

.cm-search-match {

    background:
        var(--search-bg);

    border-radius: 2px;
}


.cm-search-current {

    background:
        var(--search-current);

    border-radius: 2px;
}


/* =========================================================
   EMPTY STATE
   ========================================================= */

.empty-state {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    pointer-events: none;
}


.empty-card {

    max-width: 500px;

    padding: 35px;

    border:
        1px solid var(--border);

    border-radius: 12px;

    background: var(--panel);

    box-shadow: var(--shadow);
}


.empty-title {

    font-size: 20px;

    font-weight: 700;
}


.empty-text {

    margin-top: 10px;

    font-size: 13px;

    color: var(--muted);

    line-height: 1.6;
}


/* =========================================================
   MODAL
   ========================================================= */

.modal-backdrop {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        rgba(15,23,42,0.48);

    z-index: 1000;
}


.modal-backdrop.show {

    display: flex;
}


.modal {

    width: min(560px, 94vw);

    max-height: 85vh;

    overflow: hidden;

    display: flex;

    flex-direction: column;

    background: var(--panel);

    color: var(--text);

    border:
        1px solid var(--border);

    border-radius: 12px;

    box-shadow:
        0 25px 70px rgba(0,0,0,0.25);
}


.modal-header {

    padding:
        18px 20px;

    border-bottom:
        1px solid var(--border);
}


.modal-title {

    font-size: 17px;

    font-weight: 700;
}


.modal-description {

    margin-top: 5px;

    font-size: 12px;

    color: var(--muted);

    line-height: 1.5;
}


.modal-body {

    padding: 20px;

    overflow-y: auto;
}


.modal-footer {

    display: flex;

    justify-content: flex-end;

    gap: 8px;

    padding:
        12px 20px;

    border-top:
        1px solid var(--border);
}


.modal-option {

    width: 100%;

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 15px;

    margin-bottom: 10px;

    text-align: left;

    border:
        1px solid var(--border);

    border-radius: 9px;

    background: var(--panel);

    color: var(--text);

    cursor: pointer;
}


.modal-option:hover {

    border-color:
        var(--primary);

    background:
        rgba(37,99,235,0.06);
}


.modal-option-icon {

    width: 38px;
    height: 38px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 8px;

    background:
        rgba(37,99,235,0.10);

    color: var(--primary);

    font-size: 18px;
}


.modal-option-title {

    font-size: 13px;

    font-weight: 700;
}


.modal-option-text {

    margin-top: 3px;

    font-size: 11px;

    color: var(--muted);

    line-height: 1.4;
}


.input-label {

    display: block;

    margin-bottom: 6px;

    font-size: 12px;

    font-weight: 600;
}


.modal-input {

    width: 100%;

    height: 38px;

    padding:
        0 10px;

    border:
        1px solid var(--border);

    border-radius: 7px;

    outline: none;

    background: var(--panel);

    color: var(--text);
}


.modal-input:focus {

    border-color:
        var(--primary);
}


.available-script {

    width: 100%;

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 12px;

    margin-bottom: 8px;

    border:
        1px solid var(--border);

    border-radius: 8px;

    background: var(--panel);

    color: var(--text);

    cursor: pointer;

    text-align: left;
}


.available-script:hover {

    border-color:
        var(--primary);
}


.available-script-name {

    font-size: 13px;

    font-weight: 600;
}


.available-script-description {

    margin-top: 3px;

    font-size: 11px;

    color: var(--muted);
}


/* =========================================================
   TOAST
   ========================================================= */

.toast-container {

    position: fixed;

    right: 20px;

    bottom: 20px;

    display: flex;

    flex-direction: column;

    gap: 8px;

    z-index: 2000;
}


.toast {

    min-width: 250px;

    max-width: 400px;

    padding:
        12px 15px;

    border:
        1px solid var(--border);

    border-radius: 8px;

    background: var(--panel);

    color: var(--text);

    box-shadow: var(--shadow);

    font-size: 12px;

    animation:
        toastIn 0.18s ease;
}


@keyframes toastIn {

    from {

        opacity: 0;

        transform:
            translateY(8px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:900px) {

    .sidebar {

        width: 220px;
        min-width: 220px;
    }

    .toolbar {

        gap: 5px;
    }

}


@media(max-width:700px) {

    .sidebar {

        width: 190px;
        min-width: 190px;
    }

    .topbar-right .optional-btn {

        display: none;
    }

    .search-input {

        width: 180px;
    }

}

</style>
</head>


<body>

<div class="app">

    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-title">
                M365Buddy
            </div>

            <div class="brand-subtitle">
                PowerShell Script Workspace
            </div>

        </div>


        <div class="sidebar-actions">

            <button
                class="btn btn-primary"
                id="createScriptBtn">

                ＋ Create New Script

            </button>

        </div>


        <div class="sidebar-section-title">
            M365Buddy Scripts
        </div>


        <div
            class="script-list"
            id="scriptList">
        </div>

    </aside>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="main">


        <!-- TOP BAR -->

        <header class="topbar">

            <div class="topbar-left">

                <div
                    class="current-title"
                    id="currentTitle">

                    Script Workspace

                </div>

            </div>


            <div class="topbar-right">

                <!-- THIS IS THE IMPORTANT PLUS BUTTON -->

                <button
                    class="plus-button"
                    id="newEditorTabBtn"
                    title="Open a new editor tab">

                    +

                </button>


                <button
                    class="btn optional-btn"
                    id="homeBtn">

                    Home

                </button>


                <button
                    class="btn"
                    id="themeBtn">

                    ☼ Light

                </button>

            </div>

        </header>


        <!-- =================================================
             TABS
             ================================================= -->

        <div class="tabs-row"
             id="tabsRow">

        </div>


        <!-- =================================================
             TOOLBAR
             ================================================= -->

        <div class="toolbar">

            <button
                class="btn"
                id="copyBtn">

                Copy

            </button>


            <button
                class="btn"
                id="createCopyBtn">

                Create Editable Copy

            </button>


            <button
                class="btn"
                id="saveBtn">

                Save

            </button>


            <button
                class="btn"
                id="downloadBtn">

                Download

            </button>


            <button
                class="btn"
                id="renameBtn">

                Rename

            </button>


            <button
                class="btn"
                id="findBtn">

                Find

            </button>


            <button
                class="btn btn-danger"
                id="deleteBtn">

                Delete

            </button>


            <div class="toolbar-spacer"></div>


            <select
                class="select"
                id="fontFamily">

                <option value="Consolas">
                    Consolas
                </option>

                <option value="'Courier New'">
                    Courier New
                </option>

                <option value="monospace">
                    Monospace
                </option>

                <option value="Arial">
                    Arial
                </option>

            </select>


            <select
                class="select"
                id="fontSize">

                <option value="12">
                    12px
                </option>

                <option value="13">
                    13px
                </option>

                <option value="14">
                    14px
                </option>

                <option value="15">
                    15px
                </option>

                <option value="16">
                    16px
                </option>

                <option value="18">
                    18px
                </option>

            </select>

        </div>


        <!-- =================================================
             SEARCH BAR
             ================================================= -->

        <div
            class="searchbar"
            id="searchbar">

            <input
                class="search-input"
                id="searchInput"
                type="text"
                placeholder="Find in script...">

            <span
                class="search-count"
                id="searchCount">

                0 matches

            </span>


            <button
                class="btn"
                id="previousMatchBtn">

                ↑ Previous

            </button>


            <button
                class="btn"
                id="nextMatchBtn">

                ↓ Next

            </button>


            <button
                class="btn"
                id="closeSearchBtn">

                Close

            </button>

        </div>


        <!-- =================================================
             EDITOR CANVAS
             ================================================= -->

        <section
            class="editor-canvas"
            id="editorCanvas">

            <div
                class="editor-wrapper"
                id="editorWrapper">

                <textarea
                    id="codeEditor"></textarea>

            </div>


            <div
                class="empty-state"
                id="emptyState"
                style="display:none;">

                <div class="empty-card">

                    <div class="empty-title">
                        No script open
                    </div>

                    <div class="empty-text">
                        Click the <strong>+</strong> button above
                        to open a new editor tab.
                        You can then paste any PowerShell script
                        and edit it independently.
                    </div>

                </div>

            </div>

        </section>

    </main>

</div>


<!-- =========================================================
     CREATE SCRIPT MODAL
     ========================================================= -->

<div
    class="modal-backdrop"
    id="createModal">

    <div class="modal">

        <div class="modal-header">

            <div
                class="modal-title"
                id="createModalTitle">

                Create New Script

            </div>

            <div
                class="modal-description"
                id="createModalDescription">

                Choose how you want to start your new editor.

            </div>

        </div>


        <div
            class="modal-body"
            id="createModalBody">

        </div>


        <div class="modal-footer">

            <button
                class="btn"
                id="modalBackBtn"
                style="display:none;">

                Back

            </button>


            <div style="flex:1;"></div>


            <button
                class="btn"
                id="modalCancelBtn">

                Cancel

            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     GENERAL DIALOG
     ========================================================= -->

<div
    class="modal-backdrop"
    id="dialogModal">

    <div class="modal">

        <div class="modal-header">

            <div
                class="modal-title"
                id="dialogTitle">

                Dialog

            </div>

            <div
                class="modal-description"
                id="dialogDescription">
            </div>

        </div>


        <div
            class="modal-body"
            id="dialogBody">

        </div>


        <div class="modal-footer">

            <button
                class="btn"
                id="dialogCancelBtn">

                Cancel

            </button>


            <button
                class="btn btn-primary"
                id="dialogOkBtn">

                OK

            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     TOAST
     ========================================================= -->

<div
    class="toast-container"
    id="toastContainer">
</div>


<script>

/* ============================================================
   M365BUDDY SCRIPT WORKSPACE V4
   ============================================================ */


const STORAGE_KEY =
    "m365buddy_script_workspace_v4";


/*
 * Only sanitized public scripts belong here.
 *
 * DO NOT put:
 * - Tenant IDs
 * - Client IDs belonging to private environments
 * - Certificates
 * - PFX passwords
 * - SMTP credentials
 * - Internal email addresses
 * - Internal SharePoint URLs
 */

const ORIGINAL_SCRIPTS = [

    {
        id: "sharepoint-site-inventory",

        name:
            "SharePoint Online Site Inventory",

        type:
            "M365Buddy",

        description:
            "Export SharePoint Online site inventory using PnP PowerShell.",

        content:
`# ============================================================
# SharePoint Online Site Inventory
# M365Buddy Public Example
# ============================================================

# Replace these values with your own environment values.

/* ============================================================
   STATE
   ============================================================ */

let state = {

    theme: "light",

    fontFamily:
        "Consolas",

    fontSize:
        "14",

    personalScripts:
        [],

    openTabs:
        [],

    activeTabId:
        null
};


let editor = null;

let searchMarks = [];

let currentSearchMark = null;

let searchMatches = [];

let currentSearchIndex = -1;


/* ============================================================
   LOAD / SAVE STATE
   ============================================================ */

function loadState() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (saved) {

            const parsed =
                JSON.parse(saved);

            state = {

                ...state,
                ...parsed
            };

        }

    }
    catch (error) {

        console.error(
            "Could not load workspace state:",
            error
        );

    }


    /*
     * V4 intentionally defaults to LIGHT.
     *
     * We don't inherit the old V3 dark-theme preference
     * because the requested V4 default is light.
     */

    if (
        state.theme !== "light" &&
        state.theme !== "dark"
    ) {

        state.theme = "light";

    }


    if (!Array.isArray(state.personalScripts)) {

        state.personalScripts = [];

    }


    if (!Array.isArray(state.openTabs)) {

        state.openTabs = [];

    }


    if (
        !state.activeTabId &&
        state.openTabs.length
    ) {

        state.activeTabId =
            state.openTabs[0];

    }

}


function saveState() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(state)
        );

    }
    catch (error) {

        console.error(
            "Could not save workspace state:",
            error
        );

        showToast(
            "Could not save workspace data."
        );

    }

}


/* ============================================================
   HELPERS
   ============================================================ */

function generateId(prefix = "script") {

    return (
        prefix +
        "-" +
        Date.now().toString(36) +
        "-" +
        Math.random()
            .toString(36)
            .substring(2, 8)
    );

}


function escapeHtml(value) {

    return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");
}


function getOriginalScript(id) {

    return ORIGINAL_SCRIPTS.find(
        script => script.id === id
    );

}


function getPersonalScript(id) {

    return state.personalScripts.find(
        script => script.id === id
    );

}


function getScript(id) {

    return (
        getOriginalScript(id) ||
        getPersonalScript(id)
    );

}


function getOpenTabIds() {

    return state.openTabs;

}


function isOpen(id) {

    return state.openTabs.includes(id);

}


/* ============================================================
   THEME
   ============================================================ */

function applyTheme() {

    document.documentElement.classList.toggle(
        "dark",
        state.theme === "dark"
    );


    document.getElementById(
        "themeBtn"
    ).textContent =
        state.theme === "dark"
            ? "☀ Dark"
            : "☼ Light";


    if (editor) {

        editor.refresh();

    }

}


function toggleTheme() {

    state.theme =
        state.theme === "light"
            ? "dark"
            : "light";

    saveState();

    applyTheme();

}


/* ============================================================
   FONT SETTINGS
   ============================================================ */

function applyEditorFont() {

    if (!editor) return;


    const wrapper =
        editor.getWrapperElement();


    wrapper.style.fontFamily =
        state.fontFamily;


    wrapper.style.fontSize =
        state.fontSize + "px";


    editor.refresh();

}


function loadFontSettings() {

    document.getElementById(
        "fontFamily"
    ).value =
        state.fontFamily;


    document.getElementById(
        "fontSize"
    ).value =
        state.fontSize;

}


/* ============================================================
   CODEMIRROR INITIALIZATION
   ============================================================ */

function initializeEditor() {

    editor =
        CodeMirror.fromTextArea(
            document.getElementById("codeEditor"),
            {

                mode: "powershell",

                lineNumbers: true,

                lineWrapping: false,

                indentUnit: 4,

                tabSize: 4,

                indentWithTabs: false,

                autofocus: true,

                viewportMargin: Infinity

            }
        );


    editor.on(
        "change",
        function() {

            const script =
                getActiveScript();

            if (!script) return;


            script.content =
                editor.getValue();


            markTabDirty();

            saveState();

        }
    );


    applyEditorFont();

}


/* ============================================================
   ACTIVE SCRIPT
   ============================================================ */

function getActiveScript() {

    if (!state.activeTabId) {

        return null;

    }


    return getScript(
        state.activeTabId
    );

}


/* ============================================================
   RENDER SIDEBAR
   ============================================================ */

function renderSidebar() {

    const list =
        document.getElementById(
            "scriptList"
        );


    list.innerHTML = "";


    ORIGINAL_SCRIPTS.forEach(
        script => {

            list.appendChild(
                createScriptListItem(
                    script,
                    false
                )
            );

        }
    );


    state.personalScripts.forEach(
        script => {

            list.appendChild(
                createScriptListItem(
                    script,
                    true
                )
            );

        }
    );

}


function createScriptListItem(
    script,
    isPersonal
) {

    const item =
        document.createElement("button");


    item.className =
        "script-item";


    if (
        script.id ===
        state.activeTabId
    ) {

        item.classList.add(
            "active"
        );

    }


    item.innerHTML = `

        <div class="script-icon">
            ${isPersonal ? "✎" : "PS"}
        </div>

        <div class="script-info">

            <div class="script-name">
                ${escapeHtml(script.name)}
            </div>

            <div class="script-type">
                ${isPersonal ? "Custom script" : "M365Buddy script"}
            </div>

        </div>

    `;


    item.addEventListener(
        "click",
        function() {

            openScript(
                script.id
            );

        }
    );


    return item;

}


/* ============================================================
   RENDER TABS
   ============================================================ */

function renderTabs() {

    const row =
        document.getElementById(
            "tabsRow"
        );


    row.innerHTML = "";


    state.openTabs.forEach(
        id => {

            const script =
                getScript(id);


            if (!script) return;


            const tab =
                document.createElement("div");


            tab.className =
                "tab";


            if (
                id ===
                state.activeTabId
            ) {

                tab.classList.add(
                    "active"
                );

            }


            const dirty =
                script.dirty
                    ? " •"
                    : "";


            tab.innerHTML = `

                <div class="tab-name">
                    ${escapeHtml(script.name)}
                    ${dirty}
                </div>

                <div
                    class="tab-close"
                    title="Close editor tab">

                    ×

                </div>

            `;


            tab.addEventListener(
                "click",
                function(event) {

                    if (
                        event.target.closest(
                            ".tab-close"
                        )
                    ) {

                        closeTab(
                            id
                        );

                        return;

                    }


                    openScript(
                        id
                    );

                }
            );


            row.appendChild(tab);

        }
    );


    /*
     * Permanent + button at the end of the tab strip.
     */

    const newTab =
        document.createElement("button");


    newTab.className =
        "tab";


    newTab.style.minWidth =
        "auto";


    newTab.innerHTML = `

        <span
            style="
                font-size:18px;
                line-height:1;
            ">

            +

        </span>

        <span class="new-tab-label">
            New Editor Tab
        </span>

    `;


    newTab.addEventListener(
        "click",
        openCreateScriptModal
    );


    row.appendChild(
        newTab
    );

}


/* ============================================================
   OPEN SCRIPT
   ============================================================ */

function openScript(id) {

    const script =
        getScript(id);


    if (!script) {

        showToast(
            "Script could not be found."
        );

        return;

    }


    if (!isOpen(id)) {

        state.openTabs.push(id);

    }


    state.activeTabId =
        id;


    saveState();

    renderTabs();

    renderSidebar();

    loadActiveScriptIntoEditor();

}


/* ============================================================
   LOAD ACTIVE SCRIPT INTO EDITOR
   ============================================================ */

function loadActiveScriptIntoEditor() {

    const script =
        getActiveScript();


    const emptyState =
        document.getElementById(
            "emptyState"
        );


    if (!script) {

        emptyState.style.display =
            "flex";

        if (editor) {

            editor.setValue("");

        }

        document.getElementById(
            "currentTitle"
        ).textContent =
            "Script Workspace";

        return;

    }


    emptyState.style.display =
        "none";


    document.getElementById(
        "currentTitle"
    ).textContent =
        script.name;


    editor.off(
        "change",
        editorChangeHandler
    );


    editor.setValue(
        script.content || ""
    );


    editor.on(
        "change",
        editorChangeHandler
    );


    applyEditorFont();

    clearSearchMarks();

    updateSearchResults();


    setTimeout(
        function() {

            editor.refresh();

            editor.focus();

        },
        50
    );

}


function editorChangeHandler() {

    const script =
        getActiveScript();


    if (!script) return;


    script.content =
        editor.getValue();


    script.dirty =
        true;


    saveState();

    renderTabs();

}


/* ============================================================
   MARK TAB DIRTY
   ============================================================ */

function markTabDirty() {

    const script =
        getActiveScript();


    if (!script) return;


    script.dirty =
        true;


    saveState();

    renderTabs();

}


/* ============================================================
   CLOSE TAB
   ============================================================ */

function closeTab(id) {

    const index =
        state.openTabs.indexOf(id);


    if (index === -1) return;


    state.openTabs.splice(
        index,
        1
    );


    if (
        state.activeTabId === id
    ) {

        if (
            state.openTabs.length
        ) {

            const nextIndex =
                Math.max(
                    0,
                    index - 1
                );


            state.activeTabId =
                state.openTabs[
                    nextIndex
                ];

        }
        else {

            state.activeTabId =
                null;

        }

    }


    saveState();

    renderTabs();

    renderSidebar();

    loadActiveScriptIntoEditor();

}

/* ============================================================
   CUSTOM SCRIPT
   ============================================================ */

function createCustomScript() {

    closeCreateScriptModal();


    openInputDialog(
        "New Custom Script",
        "Give your new editor tab a name. You can paste your script after the editor opens.",
        "Script name",
        "My Custom Script",
        function(name) {

            if (!name) {

                showToast(
                    "Script name is required."
                );

                return;

            }


            const script = {

                id:
                    generateId(
                        "custom"
                    ),

                name:
                    name,

                type:
                    "Custom",

                content:
                    "",

                dirty:
                    false

            };


            state.personalScripts.push(
                script
            );


            /*
             * IMPORTANT:
             *
             * The custom script is immediately opened
             * as its own top-level editor tab.
             *
             * It does NOT create another editor inside
             * the existing editor canvas.
             */

            state.openTabs.push(
                script.id
            );


            state.activeTabId =
                script.id;


            saveState();

            renderSidebar();

            renderTabs();

            loadActiveScriptIntoEditor();

            showToast(
                "New editor tab created. Paste your script here."
            );

        }
    );

}


/* ============================================================
   CREATE EDITABLE COPY
   ============================================================ */

function createEditableCopy() {

    const source =
        getActiveScript();


    if (!source) {

        showToast(
            "Open a script first."
        );

        return;

    }


    const baseName =
        source.name
            .replace(/\s+Copy(\s+\d+)?$/i, "");


    let copyNumber = 0;

    let copyName;


    while (true) {

        copyNumber++;


        copyName =
            copyNumber === 1
                ? `${baseName} Copy`
                : `${baseName} Copy ${copyNumber}`;


        const exists =
            state.personalScripts.some(
                script =>
                    script.name ===
                    copyName
            );


        if (!exists) break;

    }


    const copy = {

        id:
            generateId(
                "copy"
            ),

        name:
            copyName,

        type:
            "Copy",

        content:
            source.content || "",

        dirty:
            false

    };


    /*
     * Copies intentionally go only into
     * the top editor tabs.
     *
     * They do NOT get added to the
     * left script list.
     */

    state.openTabs.push(
        copy.id
    );


    state.personalScripts.push(
        {
            ...copy,

            /*
             * hiddenFromSidebar is used so copies
             * don't appear in the left navigation.
             */

            hiddenFromSidebar:
                true
        }
    );


    state.activeTabId =
        copy.id;


    saveState();

    renderSidebar();

    renderTabs();

    loadActiveScriptIntoEditor();


    showToast(
        `Created "${copyName}" in a new editor tab.`
    );

}


/* ============================================================
   COPY TO CLIPBOARD
   ============================================================ */

async function copyScript() {

    const script =
        getActiveScript();


    if (!script) {

        showToast(
            "Open a script first."
        );

        return;

    }


    try {

        await navigator.clipboard.writeText(
            editor.getValue()
        );


        showToast(
            "Script copied to clipboard."
        );

    }
    catch {

        editor.focus();

        editor.execCommand(
            "selectAll"
        );

        showToast(
            "Clipboard access was unavailable. Script selected for manual copy."
        );

    }

}


/* ============================================================
   SAVE
   ============================================================ */

function saveCurrentScript() {

    const script =
        getActiveScript();


    if (!script) {

        showToast(
            "No script is open."
        );

        return;

    }


    script.content =
        editor.getValue();


    script.dirty =
        false;


    saveState();

    renderTabs();

    renderSidebar();


    showToast(
        `"${script.name}" saved.`
    );

}


/* ============================================================
   DOWNLOAD
   ============================================================ */

function downloadCurrentScript() {

    const script =
        getActiveScript();


    if (!script) {

        showToast(
            "Open a script first."
        );

        return;

    }


    const blob =
        new Blob(
            [
                editor.getValue()
            ],
            {
                type:
                    "text/plain;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement("a");


    link.href =
        url;


    link.download =
        script.name
            .replace(/[<>:"/\\|?*]+/g, "_")
            + ".ps1";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );


    showToast(
        "Script downloaded."
    );

}


/* ============================================================
   RENAME
   ============================================================ */

function renameCurrentScript() {

    const script =
        getActiveScript();


    if (!script) {

        showToast(
            "Open a script first."
        );

        return;

    }


    openInputDialog(
        "Rename Script",
        "Enter the new name for this editor tab.",
        "Script name",
        script.name,
        function(name) {

            if (!name) return;


            script.name =
                name;


            saveState();

            renderTabs();

            renderSidebar();


            document.getElementById(
                "currentTitle"
            ).textContent =
                name;


            showToast(
                "Script renamed."
            );

        }
    );

}


/* ============================================================
   DELETE
   ============================================================ */

function deleteCurrentScript() {

    const script =
        getActiveScript();


    if (!script) {

        showToast(
            "Open a script first."
        );

        return;

    }


    const isOriginal =
        ORIGINAL_SCRIPTS.some(
            item =>
                item.id === script.id
        );


    if (isOriginal) {

        showToast(
            "Original M365Buddy scripts cannot be deleted."
        );

        return;

    }


    openConfirmDialog(
        "Delete Script",
        `Delete "${script.name}"? This cannot be undone.`,
        function() {

            state.personalScripts =
                state.personalScripts.filter(
                    item =>
                        item.id !== script.id
                );


            state.openTabs =
                state.openTabs.filter(
                    id =>
                        id !== script.id
                );


            if (
                state.activeTabId ===
                script.id
            ) {

                state.activeTabId =
                    state.openTabs.length
                        ? state.openTabs[
                            state.openTabs.length - 1
                        ]
                        : null;

            }


            saveState();

            renderSidebar();

            renderTabs();

            loadActiveScriptIntoEditor();


            showToast(
                "Script deleted."
            );

        }
    );

}


/* ============================================================
   SEARCH
   ============================================================ */

function openSearch() {

    const bar =
        document.getElementById(
            "searchbar"
        );


    bar.classList.add(
        "visible"
    );


    const input =
        document.getElementById(
            "searchInput"
        );


    input.focus();

    input.select();

}


function closeSearch() {

    document.getElementById(
        "searchbar"
    ).classList.remove(
        "visible"
    );


    document.getElementById(
        "searchInput"
    ).value = "";


    clearSearchMarks();

    updateSearchCount();

    editor.focus();

}


function clearSearchMarks() {

    searchMarks.forEach(
        mark => {

            try {

                mark.clear();

            }
            catch {}

        }
    );


    searchMarks = [];


    if (currentSearchMark) {

        try {

            currentSearchMark.clear();

        }
        catch {}

    }


    currentSearchMark =
        null;


    searchMatches = [];

    currentSearchIndex =
        -1;

}


function updateSearchResults() {

    const input =
        document.getElementById(
            "searchInput"
        );


    if (!input) return;


    const query =
        input.value;


    clearSearchMarks();


    if (!query) {

        updateSearchCount();

        return;

    }


    const cursor =
        editor.getSearchCursor(
            query,
            CodeMirror.Pos(
                0,
                0
            ),
            {
                caseFold: true
            }
        );


    while (
        cursor.findNext()
    ) {

        searchMatches.push(
            {
                from:
                    cursor.from(),

                to:
                    cursor.to()
            }
        );

    }


    searchMatches.forEach(
        match => {

            const mark =
                editor.markText(
                    match.from,
                    match.to,
                    {
                        className:
                            "cm-search-match"
                    }
                );


            searchMarks.push(
                mark
            );

        }
    );


    if (
        searchMatches.length
    ) {

        currentSearchIndex =
            0;


        highlightCurrentSearch();

    }


    updateSearchCount();

}


function highlightCurrentSearch() {

    if (
        currentSearchMark
    ) {

        try {

            currentSearchMark.clear();

        }
        catch {}

    }


    if (
        currentSearchIndex < 0 ||
        currentSearchIndex >=
        searchMatches.length
    ) {

        return;

    }


    const match =
        searchMatches[
            currentSearchIndex
        ];


    currentSearchMark =
        editor.markText(
            match.from,
            match.to,
            {
                className:
                    "cm-search-current"
            }
        );


    editor.scrollIntoView(
        {
            from:
                match.from,

            to:
                match.to
        },
        100
    );


    editor.setSelection(
        match.from,
        match.to
    );


    updateSearchCount();

}


function updateSearchCount() {

    const count =
        document.getElementById(
            "searchCount"
        );


    if (
        !searchMatches.length
    ) {

        count.textContent =
            document.getElementById(
                "searchInput"
            ).value
                ? "0 matches"
                : "0 matches";

        return;

    }


    count.textContent =
        `${currentSearchIndex + 1} of ${searchMatches.length}`;

}


function nextMatch() {

    if (!searchMatches.length) {

        updateSearchResults();

        return;

    }


    currentSearchIndex =
        (
            currentSearchIndex + 1
        ) %
        searchMatches.length;


    highlightCurrentSearch();

}


function previousMatch() {

    if (!searchMatches.length) {

        updateSearchResults();

        return;

    }


    currentSearchIndex =
        (
            currentSearchIndex - 1 +
            searchMatches.length
        ) %
        searchMatches.length;


    highlightCurrentSearch();

}


/* ============================================================
   DIALOG SYSTEM
   ============================================================ */

let dialogCallback =
    null;


function openInputDialog(
    title,
    description,
    label,
    defaultValue,
    callback
) {

    document.getElementById(
        "dialogTitle"
    ).textContent =
        title;


    document.getElementById(
        "dialogDescription"
    ).textContent =
        description;


    document.getElementById(
        "dialogBody"
    ).innerHTML = `

        <label class="input-label">
            ${escapeHtml(label)}
        </label>

        <input
            class="modal-input"
            id="dialogInput"
            value="${escapeHtml(defaultValue || "")}"
            autocomplete="off">

    `;


    dialogCallback =
        callback;


    document.getElementById(
        "dialogModal"
    ).classList.add(
        "show"
    );


    setTimeout(
        function() {

            const input =
                document.getElementById(
                    "dialogInput"
                );


            input.focus();

            input.select();

        },
        50
    );

}


function openConfirmDialog(
    title,
    description,
    callback
) {

    document.getElementById(
        "dialogTitle"
    ).textContent =
        title;


    document.getElementById(
        "dialogDescription"
    ).textContent =
        description;


    document.getElementById(
        "dialogBody"
    ).innerHTML = `

        <div
            style="
                font-size:13px;
                line-height:1.6;
                color:var(--muted);
            ">

            Please confirm that you want to continue.

        </div>

    `;


    dialogCallback =
        callback;


    document.getElementById(
        "dialogModal"
    ).classList.add(
        "show"
    );


    document.getElementById(
        "dialogOkBtn"
    ).textContent =
        "Confirm";

}


function closeDialog() {

    document.getElementById(
        "dialogModal"
    ).classList.remove(
        "show"
    );


    dialogCallback =
        null;


    document.getElementById(
        "dialogOkBtn"
    ).textContent =
        "OK";

}


/* ============================================================
   TOAST
   ============================================================ */

function showToast(message) {

    const container =
        document.getElementById(
            "toastContainer"
        );


    const toast =
        document.createElement("div");


    toast.className =
        "toast";


    toast.textContent =
        message;


    container.appendChild(
        toast
    );


    setTimeout(
        function() {

            toast.style.opacity =
                "0";

            toast.style.transform =
                "translateY(5px)";

            setTimeout(
                function() {

                    toast.remove();

                },
                200
            );

        },
        2600
    );

}


/* ============================================================
   HOME
   ============================================================ */

function openHome() {

    /*
     * Named window means that if M365Buddy Home is already
     * open in another browser tab/window, the browser can
     * reuse that named window instead of continually opening
     * additional copies.
     */

    window.open(
        "https://m365buddy.com/",
        "M365BuddyHome"
    );

}

            closeSearch();

        }

    }
);

            dialogCallback;

            input

                : null;

        if (callback) {

    }
);


/* ============================================================
   ESCAPE KEY
   ============================================================ */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key !==
            "Escape"
        ) {

            return;

        }


        const createModal =
            document.getElementById(
                "createModal"
            );


        const dialogModal =
            document.getElementById(
                "dialogModal"
            );


        if (
            createModal.classList.contains(
                "show"
            )
        ) {

            closeCreateScriptModal();

            return;

        }


        if (
            dialogModal.classList.contains(
                "show"
            )
        ) {

            closeDialog();

        }

    }
);


/* ============================================================
   INITIALIZATION
   ============================================================ */

function initializeWorkspace() {

    loadState();

    applyTheme();

    loadFontSettings();

    initializeEditor();

    renderSidebar();

    renderTabs();


    /*
     * Open first available script automatically.
     */

    if (
        state.activeTabId &&
        getScript(
            state.activeTabId
        )
    ) {

        loadActiveScriptIntoEditor();

    }
    else if (
        state.openTabs.length
    ) {

        state.activeTabId =
            state.openTabs[0];

        loadActiveScriptIntoEditor();

    }
    else if (
        ORIGINAL_SCRIPTS.length
    ) {

        openScript(
            ORIGINAL_SCRIPTS[0].id
        );

    }
    else {

        loadActiveScriptIntoEditor();

    }

}


initializeWorkspace();
